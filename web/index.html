async function ttsDoRegen(msgId, comment) {
  if (!_chatSid) return;
  const chatBox = $('agentChatBox');
  // 原地标记正在重写（在对应气泡里显示 loading）
  const row = chatBox.querySelector('.wc-row[data-msgid="' + msgId + '"]');
  let bub = null;
  if (row) {
    bub = row.querySelector('.wc-bub');
    if (bub) bub.innerHTML = '⏳ 正在重新生成…';
    // 如果这条消息正在合成音频，取消它自己的并行任务，避免旧音频写回来（不影响其他消息）
    const rkey = row.getAttribute('data-key');
    const rtask = _msgGenTasks[rkey];
    if (rtask) {
      delete _msgGenTasks[rkey];
      try { fetch('/api/tts/cancel', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ task_id: rtask.taskId }) }); } catch (e) {}
      if (_msgGenTarget === rkey) _msgGenTarget = null;
    }
  }
  try {
    const d = await fetch('/api/agent/regenerate', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ sid: _chatSid, msg_id: msgId, comment }) }).then(r => r.json());
    if (d && d.error) d.error = friendlyError(d.error);
    if (!d.ok) { showToast('⚠ ' + (d.error || '重写失败')); return; }
    // 后端是原地替换该条消息，前端同步原地替换气泡内容（旧气泡自动消失，无需手动删除）
    if (bub) {
      bub.innerHTML = esc(d.agent_msg.content);
    } else {
      const r2 = chatBox.querySelector('.wc-row[data-msgid="' + msgId + '"]');
      const b2 = r2 ? r2.querySelector('.wc-bub') : null;
      if (b2) b2.innerHTML = esc(d.agent_msg.content);
    }
    // 内容变了：清掉旧的语音条，并把右侧按钮重置回「转音频」状态（提示用户重新合成）
    if (row) {
      const oldBar = row.querySelector('.wc-audio');
      if (oldBar) oldBar.remove();
      ttsSetBtnState(row.getAttribute('data-key'), 'toaudio');
      // 内容已变，清除后端旧的音频绑定，避免重开后误用旧语音条
      if (msgId && _chatSid) {
        fetch('/api/agent/msg_audio', { method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ sid: _chatSid, msg_id: msgId, audio: '' }) }).catch(() => {});
      }
    }
    chatBox.scrollTop = chatBox.scrollHeight;
  } catch (e) {
    if (bub) bub.innerHTML = '⚠ ' + esc(e.message);
    showToast('⚠ ' + e.message);
  }
}

// 点击气泡直接编辑文字：单击进入编辑态，失焦或 Ctrl+Enter 保存
function ttsEditBubble(ev, bub, key, msgId) {
  if (bub.classList.contains('editing')) return; // 已在编辑态，不重复触发
  // 避免点按钮/徽标时误触发（按钮在气泡外，此处不涉及）
  if (bub.querySelector('input,textarea')) return;
  bub.classList.add('editing');
  bub.setAttribute('contenteditable', 'true');
  // 记录原文，用于取消（Esc）恢复
  bub.dataset.orig = bub.textContent.replace(/\s*新增\s*$/, '').trim();
  bub.dataset.key = key;
  bub.dataset.msgid = msgId || '';
  // 聚焦并把光标放到末尾
  const sel = window.getSelection();
  const range = document.createRange();
  range.selectNodeContents(bub);
  range.collapse(false);
  sel.removeAllRanges();
  sel.addRange(range);
  // 保存按钮（编辑态出现一个小的「保存/取消」提示条）
  ttsShowEditBar(bub);
  // 绑定失焦/键盘事件（只绑一次，通过 dataset 标记）
  if (!bub.dataset.bound) {
    bub.dataset.bound = '1';
    bub.addEventListener('keydown', e => {
      if (e.key === 'Escape') { e.preventDefault(); ttsCancelEdit(bub); }
      else if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); ttsSaveEdit(bub, true); }
      else if (e.key.toLowerCase() === 'a' && (e.ctrlKey || e.metaKey)) {
        // 全选只选中正文文本节点，排除 wc-edit-hint 图标和 wc-edit-bar 按钮
        e.preventDefault();
        const sel = window.getSelection();
        const range = document.createRange();
        const textNodes = [];
        (function collect(n) {
          if (n.nodeType === 3) { // 文本节点
            if (n.textContent && n.textContent.trim()) textNodes.push(n);
          } else if (n.nodeType === 1) {
            const cls = n.className || '';
            if (typeof cls === 'string' && (cls.indexOf('wc-edit-hint') >= 0 || cls.indexOf('wc-edit-bar') >= 0)) return;
            Array.prototype.forEach.call(n.childNodes, collect);
          }
        })(bub);
        if (textNodes.length) {
          range.setStartBefore(textNodes[0], 0);
          range.setEndAfter(textNodes[textNodes.length - 1]);
          sel.removeAllRanges();
          sel.addRange(range);
        }
      }
    });
    bub.addEventListener('blur', e => {
      // 点击编辑栏内部按钮时不触发 blur 保存（避免与取消/保存重复）
      if (bub.querySelector('.wc-edit-bar:hover')) return;
      ttsSaveEdit(bub, false);
    });
  }
}

function ttsShowEditBar(bub) {
  let bar = bub.querySelector('.wc-edit-bar');
  if (!bar) {
    bar = document.createElement('div');
    bar.className = 'wc-edit-bar';
    bar.innerHTML =
      '<button class="wc-op" data-act="save" style="color:var(--c-accent,#af52de);font-weight:600">保存</button>' +
      '<button class="wc-op" data-act="cancel">取消</button>' +
      '<span class="muted" style="font-size:10px">Ctrl+Enter 保存 · Esc 取消</span>';
    bar.addEventListener('mousedown', e => e.preventDefault()); // 避免抢焦点
    bar.addEventListener('click', e => {
      const act = e.target.getAttribute('data-act');
      if (act === 'save') ttsSaveEdit(bub, true);
      else if (act === 'cancel') ttsCancelEdit(bub);
    });
    bub.appendChild(bar);
  }
}

function ttsCancelEdit(bub) {
  bub.classList.remove('editing');
  bub.removeAttribute('contenteditable');
  const bar = bub.querySelector('.wc-edit-bar');
  if (bar) bar.remove();
  if (bub.dataset.orig !== undefined) {
    bub.innerHTML = esc(bub.dataset.orig) + '<span class="wc-edit-hint"><span class="ico" style="width:12px;height:12px"><svg><use href="#ic-edit"/></svg></span></span>';
  }
}

async function ttsSaveEdit(bub, manual) {
  // 先临时移除编辑栏和编辑提示图标，再取纯正文，避免把按钮文字带进正文
  const bar = bub.querySelector('.wc-edit-bar');
  const hint = bub.querySelector('.wc-edit-hint');
  if (bar) bar.remove();
  if (hint) hint.remove();
  let text = (bub.textContent || '').replace(/\s*新增\s*$/, '').trim();
  if (!text) { showToast('内容不能为空'); ttsCancelEdit(bub); return; }
  const msgId = bub.dataset.msgid;
  if (!msgId || !_chatSid) {
    // 没有真实 msgId（如刚发送的临时消息）——只本地改，不调后端
    bub.classList.remove('editing');
    bub.removeAttribute('contenteditable');
    const bar = bub.querySelector('.wc-edit-bar');
    if (bar) bar.remove();
    bub.innerHTML = esc(text) + '<span class="wc-edit-hint"><span class="ico" style="width:12px;height:12px"><svg><use href="#ic-edit"/></svg></span></span>';
    return;
  }
  try {
    const d = await fetch('/api/agent/update', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ sid: _chatSid, msg_id: msgId, content: text }) }).then(r => r.json());
    if (!d.ok) { showToast('⚠ ' + (d.error || '保存失败')); return; }
    // 退出编辑态，用转义后的文本重新渲染气泡正文
    bub.classList.remove('editing');
    bub.removeAttribute('contenteditable');
    const bar = bub.querySelector('.wc-edit-bar');
    if (bar) bar.remove();
    bub.innerHTML = esc(text) + '<span class="wc-edit-hint"><span class="ico" style="width:12px;height:12px"><svg><use href="#ic-edit"/></svg></span></span>';
    // 内容变了：清掉旧语音条，右侧按钮重置回「转音频」
    const row = bub.closest('.wc-row');
    if (row) {
      const oldBar = row.querySelector('.wc-audio');
      if (oldBar) oldBar.remove();
      const key = row.getAttribute('data-key');
      // 若这条消息正在并行合成，取消它自己的任务，避免旧音频写回
      if (_msgGenTasks[key]) {
        const rtask = _msgGenTasks[key];
        delete _msgGenTasks[key];
        try { fetch('/api/tts/cancel', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ task_id: rtask.taskId }) }); } catch (e) {}
        if (_msgGenTarget === key) _msgGenTarget = null;
      }
      ttsSetBtnState(key, 'toaudio');
      // 内容已变，清除后端旧的音频绑定
      if (msgId && _chatSid) {
        fetch('/api/agent/msg_audio', { method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ sid: _chatSid, msg_id: msgId, audio: '' }) }).catch(() => {});
      }
    }
    showToast('✏️ 已保存');
  } catch (e) {
    showToast('⚠ ' + e.message);
  }
}

// 插入消息成功后，用后端返回的正式 msg_id 回填 DOM：把占位 insert_xxx 换成真实 id、
// 去掉「新增」徽标，并重渲染操作栏（补上删除按钮），让新增的消息也能正常删除/重写/评论。
function ttsFinalizeInsert(tmpId, realMsgId) {
  const chatBox = $('agentChatBox');
  if (!chatBox) return;
  let row = null;
  if (tmpId) row = chatBox.querySelector('.wc-row[data-msgid="' + tmpId + '"]');
  if (!row) row = chatBox.querySelector('.wc-row[data-msgid="' + realMsgId + '"]');
  if (!row) return;
  const real = realMsgId || tmpId;
  row.setAttribute('data-msgid', real);
  // 去掉「新增」徽标（气泡里那行小字）
  const bub = row.querySelector('.wc-bub');
  if (bub) {
    const badge = bub.querySelector('.tc-badge');
    if (badge) badge.remove();
  }
  // 重渲染操作栏：现在有真实 msgId 了，补上「删除」（agent 还有「重写/评论」）按钮
  const isAgent = row.classList.contains('agent');
  const ops = row.querySelector('.wc-ops');
  if (ops) {
    ops.innerHTML =
      (isAgent
        ? '<button class="wc-op" onclick="ttsDoRegen(\'' + real + '\', \'\')"><span class="ico" style="width:13px;height:13px"><svg><use href="#ic-refresh"/></svg></span>重写</button>' +
          '<button class="wc-op" onclick="ttsCommentMsg(\'' + real + '\')"><span class="ico" style="width:13px;height:13px"><svg><use href="#ic-comment"/></svg></span>评论</button>'
        : '') +
      '<button class="wc-op" style="color:#ff3b30" onclick="ttsDelMsg(\'' + real + '\')"><span class="ico" style="width:13px;height:13px"><svg><use href="#ic-trash"/></svg></span>删除</button>';
  }
  // agent 消息补上「评论音频」按钮
  if (isAgent) {
    const vaOps = row.querySelector('.wc-va-ops');
    if (vaOps) {
      const key = row.getAttribute('data-key');
      const commentBtn = vaOps.querySelector('[data-commentbtn]');
      if (!commentBtn) {
        vaOps.insertAdjacentHTML('beforeend',
          '<button class="wc-op" data-commentbtn="' + key + '" onclick="ttsCommentAudio(\'' + key + '\', \'' + real + '\')" title="评论音频：按你的意见只调整语气重新合成，不改文字"><span class="ico" style="width:13px;height:13px"><svg><use href="#ic-comment"/></svg></span></button>');
      }
    }
  }
  // 句间插入点已经由 ttsRenderChatMsg 在 msgId 存在时生成，这里无需额外处理
}

async function ttsDelMsg(msgId) {
  if (!_chatSid) return;
  const ok = await confirmDanger('删除这条回复？','删除后不可恢复。确定吗？','删除');
  if (!ok) return;
  try {
    const d = await fetch('/api/agent/delete', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ sid: _chatSid, msg_id: msgId }) }).then(r => r.json());
    if (!d.ok) { showToast('⚠ ' + (d.error || '删除失败')); return; }
    const chatBox = $('agentChatBox');
    const row = chatBox.querySelector('.wc-row[data-msgid="' + msgId + '"]');
    if (row) row.remove();
    showToast('🗑 已删除');
  } catch (e) {
    showToast('⚠ ' + e.message);
  }
}

// 重新开始聊天：清空当前对话消息，保留角色，回到刚创建好角色的空聊天状态
async function ttsRestartChat() {
  if (!_chatSid) { showToast('还没有进行中的对话'); return; }
  const ok = await confirmDanger('重新开始对话？','将清空当前所有聊天记录（角色保留），且不可恢复。确定吗？','清空重来');
  if (!ok) return;
  try {
    const d = await fetch('/api/agent/reset', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ sid: _chatSid }) }).then(r => r.json());
    if (!d.ok) { showToast('⚠ ' + (d.error || '重置失败')); return; }
    // 清空聊天区，回到空状态（角色信息保留在头部）
    const chatBox = $('agentChatBox');
    chatBox.innerHTML = '<div class="wc-time">' + nowTime() + '</div>';
    chatBox.scrollTop = chatBox.scrollHeight;
    $('chatInput').value = '';
    ttsUpdateCharCount();
    $('chatInput').focus();
    showToast('✅ 已重新开始，可以发新消息了');
  } catch (e) {
    showToast('⚠ ' + e.message);
  }
}

// 结束模拟：彻底结束这次对话，删除本角色的对话记录和已生成的配音文件，回到未创建角色的初始状态
async function ttsEndChat() {
  if (!_chatSid) { showToast('还没有进行中的对话'); return; }
  // 若当前角色是从作品库「导入」的，结束时一并删除来源作品 + 记入排除清单
  const srcAcc = _extractData && _extractData.account_id;
  const srcAweme = _extractData && _extractData.aweme_id;
  const srcFromWorkslib = _extractData && _extractData.source === 'workslib' && srcAcc && srcAweme;
  const ok = await confirmDanger('结束这次模拟？',
    '将删除本角色的所有对话记录和已生成的配音文件（不可恢复）。' +
    (srcFromWorkslib ? '同时会从作品库删除这条来源作品，并在下次抓取时排除它。' : '') +
    '确定要结束吗？', '结束并删除');
  if (!ok) return;
  try {
    const d = await fetch('/api/agent/end', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ sid: _chatSid }) }).then(r => r.json());
    if (!d.ok) { showToast('⚠ ' + (d.error || '结束失败')); return; }

    // 若来源是作品库导入，删除来源作品 + 记入排除清单（下次抓取不再抓回）
    if (srcFromWorkslib) {
      try {
        await fetch('/api/workslib/video/delete', { method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ account_id: srcAcc, aweme_id: srcAweme, exclude: true }) }).then(r => r.json());
      } catch (e) { /* 删除来源失败不影响结束主流程 */ }
    }

    // 清空会话 ID，回到初始状态
    _chatSid = '';
    _extractData = null;

    // 聊天区回到空状态
    const chatBox = $('agentChatBox');
    chatBox.innerHTML =
      '<div class="wc-empty">' +
        '<div class="wc-emoji"><span class="ico" style="width:34px;height:34px;color:var(--c-text-mute)"><svg><use href="#ic-chat"/></svg></span></div>' +
        '<div class="wc-title">还没有对话</div>' +
        '<div class="wc-hint">提取抖音视频文案 → 创建 AI 角色 → 模拟微信对话</div>' +
        '<div class="wc-steps">' +
          '<span class="wc-step">① 提取</span>' +
          '<span class="wc-step">② 创建角色</span>' +
          '<span class="wc-step">③ 对话</span>' +
        '</div>' +
      '</div>';

    // 头部信息复位
    $('tcAvatar').innerHTML = '<span class="ico"><svg><use href="#ic-chat"/></svg></span>';
    $('tcName').textContent = '未创建角色';
    $('tcSub').textContent = '点右上角「工具」提取文案并创建角色';

    // 禁用所有对话相关按钮
    $('chatInput').disabled = true;
    $('chatInput').placeholder = '创建角色后输入消息…';
    $('chatInput').value = '';
    $('chatSendBtn').disabled = true;
    $('chatBatchBtn').disabled = true;
    $('chatAddBtn').disabled = true;
    $('ttsRestartBtn').disabled = true;
    $('ttsEndBtn').disabled = true;
    const _g = $('ttsGenAllBtn'); if (_g) _g.disabled = true;

    // 字数统计复位
    const cbox = $('chatCountBox'); if (cbox) cbox.style.display = 'none';

    // 清空角色信息面板
    const pInfo = $('personaInfo'); if (pInfo) pInfo.innerHTML = '';

    showToast('✅ 已结束模拟，对话记录和配音文件已删除' +
      (srcFromWorkslib ? '，来源作品已从作品库移除' : '') +
      (d.removed_audio ? '（清理 ' + d.removed_audio + ' 个音频）' : ''));
  } catch (e) {
    showToast('⚠ ' + e.message);
  }
}

/* ---------- 单条消息转音频（气泡内语音条） ---------- */

// 获取消息气泡的正文文本（去掉「新增」徽标残留）
function ttsGetMsgText(row) {
  const bub = row.querySelector('.wc-bub');
  if (!bub) return '';
  return bub.textContent.replace(/\s*新增\s*$/, '').trim();
}

// 在气泡下方插入「生成中」占位条（带动态加载动画 + 阶段文字），返回 bar 元素
function ttsInsertGenBar(row) {
  const oldBar = row.querySelector('.wc-audio');
  if (oldBar) oldBar.remove();
  const bar = document.createElement('div');
  bar.className = 'wc-audio';
  bar.innerHTML =
    '<span class="wc-spin" style="width:14px;height:14px;border:2px solid var(--c-border);border-top-color:var(--c-accent,#af52de);border-radius:50%;animation:wcspin 0.8s linear infinite;display:inline-block"></span>' +
    '<span class="wc-gen-stage muted" style="font-size:12px">⏳ 正在合成语音…</span>';
  // 插入到 .wc-main（气泡+音频按钮）之后、文字操作栏 .wc-ops 之前
  const col = row.querySelector('.wc-col');
  const ops = col.querySelector('.wc-ops');
  if (ops) col.insertBefore(bar, ops);
  else col.appendChild(bar);
  // 不自动滚到底部：点「转音频」时保持当前视线，避免用户被强制拽到对话末尾
  return bar;
}

// 更新某条消息「转音频」主按钮的三态：toaudio=未生成 / gening=生成中 / regen=已成功 / retry=失败
function ttsSetBtnState(key, state) {
  const row = $('agentChatBox').querySelector('.wc-row[data-key="' + key + '"]');
  if (!row) return;
  const btn = row.querySelector('[data-ttsbtn="' + key + '"]');
  if (!btn) return;
  btn.disabled = (state === 'gening');
  if (state === 'gening') {
    btn.innerHTML = '<span class="wc-spin" style="width:13px;height:13px;border:2px solid currentColor;border-top-color:transparent;border-radius:50%;animation:wcspin 0.8s linear infinite;display:inline-block"></span>';
    btn.title = '正在合成语音…';
    btn.style.opacity = '0.6';
  } else if (state === 'regen') {
    btn.innerHTML = '<span class="ico" style="width:13px;height:13px"><svg><use href="#ic-refresh"/></svg></span>';
    btn.title = '情绪随机，重新合成一条不同的音频';
    btn.style.opacity = '';
    ttsHintGenAll();
  } else if (state === 'retry') {
    btn.innerHTML = '<span class="ico" style="width:13px;height:13px"><svg><use href="#ic-refresh"/></svg></span>';
    btn.title = '上次自动恢复未成功；可在修正 Token、参考音频或服务状态后重新提交';
    btn.style.opacity = '';
    ttsHintGenAll();
  } else {
    btn.innerHTML = '<span class="ico" style="width:13px;height:13px"><svg><use href="#ic-speaker"/></svg></span>';
    btn.title = '用当前音色合成这条消息';
    btn.style.opacity = '';
  }
}

// 带超时的 fetch：情绪分析/评论翻译是「锦上添花」的本地 LLM 步骤，不能因为它慢就卡死
// 整个合成流程。超过 timeoutMs 直接放弃，返回 null，调用方回退默认语气继续合成。
// 注意：绝不把「信号丢失」当作「还在等」——AbortController 超时后 fetch 会立刻 reject。
async function ttsFetchTimeout(url, body, timeoutMs) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), timeoutMs);
  try {
    const r = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
      signal: ctrl.signal,
    });
    const j = await r.json().catch(() => ({ ok:false, error:'服务响应异常' }));
    if (!r.ok && !j.error) j.error = '请求失败（HTTP ' + r.status + '）';
    if (j && j.error) j.error = friendlyError(j.error);
    return j;
  } catch (e) {
    return { ok:false, error: friendlyError(e.name === 'AbortError' ? '请求超时' : e.message) };
  } finally {
    clearTimeout(timer);
  }
}

// 核心：对指定 key 的气泡做一次单条合成（点「转音频/重新生成/再次尝试」都走这里）
// 并行模型：每条消息独立 task_id、独立轮询，点另一条不会取消这一条，两条各自并行合成
async function ttsGenAudioForRow(key, audioComment, presetOverride) {
  // 批量任务传入 presetOverride 后锁定音色；不能因页面重开或下拉框恢复默认而串音色。
  const pid = presetOverride || _chatVoiceId || $('ttsChatVoiceSel').value;
  if (!pid) { showToast('请先在上方「转音频用音色」选择一个音色'); return; }
  ttsLockGenerationVoice(pid);
  const chatBox = $('agentChatBox');
  const row = chatBox.querySelector('.wc-row[data-key="' + key + '"]');
  if (!row) { showToast('未找到该消息'); return; }
  const text = ttsGetMsgText(row);
  if (!text) { showToast('消息内容为空'); return; }

  // 若这条消息自己已经在合成中，忽略重复点击
  if (_msgGenTasks[key] && _msgGenTasks[key].taskId) return;

  // 本次请求的代次：同一气泡被「重新生成」顶掉时，旧异步回调据此放弃
  const mySeq = ++_genSeq;

  const bar = ttsInsertGenBar(row);
  ttsSetBtnState(key, 'gening');
  // 失败过的任务要留在“生成失败”页做完整闭环；本次重新提交只标记恢复中。
  if (_ttsQueueStates[key] && _ttsQueueStates[key].everFailed) {
    _ttsQueueStates[key].recovering = true;
    _ttsQueueStates[key].failed = false;
  }
  ttsRenderQueue();

  // ---- 第一步：语气/情绪分析（根据发言人性格/上下文锁定语气，或按评论翻译成参数） ----
  const msgId = row.getAttribute('data-msgid') || '';
  let emo = null;   // 情绪/评论分析结果；失败则回退默认平静，不影响合成
  const stageEl = bar.querySelector('.wc-gen-stage');
  if (audioComment) {
    // 评论音频：把用户的评论翻译成一整套音频参数（emo_text/emo_vec/emo_weight/duration_factor）
    // 注意：这一步是本地 LLM 分析，通常几秒内返回；真正耗时的是后面的 ModelScope 免费
    // 创空间「排队合成」（实测单条 87~189s）。提前说明，避免用户误以为卡住。
    if (stageEl) stageEl.textContent = '🎯 正在把你的评论翻译成音频参数（本地分析，最多 20 秒）…';
    if (_chatSid) {
      const cr = await ttsFetchTimeout('/api/agent/audio_comment',
        { sid: _chatSid, msg_id: msgId, text, comment: audioComment }, 20000);
      if (cr && cr.ok) emo = cr;
      else {
        const reason = (cr && cr.error) ? cr.error : '评论理解超时';
        if (bar) bar.innerHTML = '<span style="color:#ff3b30;font-size:12px">❌ ' + esc(reason) + '；未改动原音频</span>';
        ttsSetBtnState(key, 'retry');
        showToast('⚠ ' + reason + '，已保留原音频');
        ttsPlaySound('err');
        return;
      }
    }
    if (mySeq !== _genSeq) return;
  } else {
    // 分析阶段：本地 LLM 判断语气，通常几秒内返回。用「倒计时」让用户明确看到它在跑，
    // 而不是静止的提示文字让人误以为卡住。超时自动降级默认语气，绝不阻塞后续合成。
    if (stageEl) {
      stageEl.textContent = '🧠 正在分析这句该用什么语气（最多 15 秒）…';
      stageEl.setAttribute('data-analysing', '1');
      const t0 = Date.now();
      (function tickAnalysing() {
        if (stageEl.getAttribute('data-analysing') !== '1') return;
        const el = Math.max(0, 15 - Math.round((Date.now() - t0) / 1000));
        stageEl.textContent = '🧠 正在分析语气（还剩 ' + el + ' 秒，超时自动用默认语气）…';
        setTimeout(tickAnalysing, 1000);
      })();
    }
    if (_chatSid) {
      const er = await ttsFetchTimeout('/api/agent/line_emotion',
        { sid: _chatSid, msg_id: msgId, text }, 15000);
      if (er && er.ok) emo = er;
      // 超时/失败 → emo 保持 null，走默认平静语气，绝不阻塞合成
    }
    if (stageEl) stageEl.removeAttribute('data-analysing');
    // 情绪分析期间，同一条气泡若被重新生成顶掉则放弃（不影响其他气泡的并行任务）
    if (mySeq !== _genSeq) return;
  }

  // ---- 第二步：组装 TTS 参数，用情绪向量+情感描述锁定语气（关闭随机） ----
  // 拼音声调标注文本：让多音字/轻声字读准（IndexTTS 硬能力），原样透传给 TTS
  const ttsBody = {
    text: (emo && emo.annotated_text) ? emo.annotated_text : text,
    preset_id: pid, lang: 'ZH',
    emo_mode: 'vector',
    emo_random: false,
  };
  // 语速控制：优先看用户在「语速」下拉里选了啥
  // - auto（默认）：优先用「目标发言人逐句基准语速」（后端从提取记录 speaker_speed 读取），
  //   即按发言人实际说的那句话在音轨里的真实时长测出的语速，最贴合真人语速；
  // - 其它（较快/正常/较慢）：显式传 duration_factor，覆盖上面的自适应值
  const chatSpeedEl = $('ttsChatSpeedSel');
  const chatSpeedVal = chatSpeedEl ? chatSpeedEl.value : 'auto';
  if (chatSpeedVal && chatSpeedVal !== 'auto') {
    ttsBody.duration_factor = parseFloat(chatSpeedVal);
    ttsBody.auto_speed = false;
  } else {
    ttsBody.auto_speed = true;
    // 传提取记录 + 该消息的发言人，让后端优先按「该发言人那句话的真实语速」对齐
    if (_extractData && _extractData.extract_id) {
      ttsBody.extract_id = _extractData.extract_id;
      ttsBody.speaker = row.classList.contains('agent') ? 'B' : 'A';
    }
  }
  if (emo && Array.isArray(emo.emo_vec) && emo.emo_vec.length === 8) {
    ttsBody.emo_vec = emo.emo_vec;
    ttsBody.emo_weight = (typeof emo.emo_weight === 'number') ? emo.emo_weight : 0.6;
    if (emo.emo_text) ttsBody.emo_text = emo.emo_text;
    // 语速优先级（2026-08-17 修复「逐句语速无差异」）：
    // 核心原则——「语速 = 发言人基准语速 × 本句情绪快慢倍率」：
    // - 评论音频（audioComment）：评论翻译出的 duration_factor 是「绝对基准」，直接用；
    // - 语速下拉选了具体档位：显式 duration_factor，直接用；
    // - 下拉=auto：基准交给后端（发言人基准语速），情绪 LLM 判出的本句 duration_factor
    //   作为「相对基准的倍率」传给后端（speed_ratio），由后端「基准 × 倍率」算出最终因子。
    //   这样每句话语速会随情绪/内容真实起伏：着急 0.85（快15%）、委屈 1.1（慢10%），
    //   而不是之前把情绪因子砍半封顶 ±0.1 导致每句话语速几乎一样。
    if (typeof emo.duration_factor === 'number') {
      if (audioComment) {
        ttsBody.duration_factor = emo.duration_factor;
        ttsBody.auto_speed = false;
      } else if (chatSpeedVal === 'auto' && !ttsBody.duration_factor) {
        // 情绪因子作为「相对发言人基准的倍率」原样传下，后端 clamp 到 0.7~1.3。
        ttsBody.speed_ratio = parseFloat(emo.duration_factor.toFixed(3));
      }
    }
    if (stageEl) {
      let hint = (audioComment ? '🎯' : '🎭') + ' ' + emo.emotion_label + '（' + (emo.emo_text || '自动语气') + '）';
      if (emo.stress_word) hint += ' · 重音「' + emo.stress_word + '」';
      stageEl.textContent = hint + '…';
    }
  } else {
    // 情绪分析/评论翻译都没拿到有效参数：回退默认平静语气（评论翻译失败已在上方 toast 提示）
    if (stageEl) stageEl.textContent = '🎭 未拿到有效语气参数，用默认语气合成…';
  }

  const d = await fetch('/api/tts/generate', { method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(ttsBody) }).then(r => r.json());
  // 合成启动请求返回后，再校验一次代次（同一气泡被顶掉则放弃）
  if (mySeq !== _genSeq) return;
  if (!d.ok) {
    bar.innerHTML = '<span style="color:#ff3b30;font-size:12px">❌ ' + esc(d.error || '启动失败') + '</span>';
    ttsSetBtnState(key, 'retry');
    showToast('❌ 合成失败：' + (d.error || '启动失败'));
    ttsPlaySound('err');
    return;
  }
  const taskId = d.task_id;
  if (!taskId) {
    bar.innerHTML = '<span style="color:#ff3b30;font-size:12px">❌ 后端未返回任务编号</span>';
    ttsSetBtnState(key, 'retry');
    ttsPlaySound('err');
    return;
  }

  // 注册并行任务：每条消息独立 task_id + 开始时间，点另一条完全不干扰
  _msgGenTasks[key] = { taskId, startAt: Date.now() };
  _msgGenTarget = key;
  _msgGenStartAt = Date.now();
  ttsMsgEnsurePolling();
  ttsRenderQueue();
}

// 启动/维护全局轮询定时器：并行轮询所有进行中的任务（每 1.2s 一次）
function ttsMsgEnsurePolling() {
  if (ttsMsgPollTimer) return;
  ttsMsgPollTimer = setInterval(ttsMsgPollStatus, 1200);
}

// 点击「🔊 转音频 / 🎲 重新生成 / 🔄 再次尝试」：主按钮统一入口
async function ttsMsgToAudio(key) {
  await ttsGenAudioForRow(key);
}

// -------- 语音生成队列：只展示和操作，不创建另一套任务逻辑 --------
function ttsToggleQueue(force) {
  const panel = $('ttsQueuePanel');
  const mask = $('ttsQueueMask');
  if (!panel) return;
  const open = typeof force === 'boolean' ? force : !panel.classList.contains('open');
  panel.classList.toggle('open', open);
  if (mask) mask.classList.toggle('open', open);
  if (open) ttsRenderQueue();
}

function ttsQueueLocate(key) {
  const row = $('agentChatBox') && $('agentChatBox').querySelector('.wc-row[data-key="' + key + '"]');
  if (!row) { showToast('这条消息已不存在'); return; }
  row.scrollIntoView({ behavior:'smooth', block:'center' });
  row.classList.add('tts-q-highlight');
  setTimeout(() => row.classList.remove('tts-q-highlight'), 1800);
}

function ttsQueueRegenerate(key) {
  ttsQueueLocate(key);
  ttsMsgToAudio(key);
}

function ttsQueueComment(key) {
  const row = $('agentChatBox') && $('agentChatBox').querySelector('.wc-row[data-key="' + key + '"]');
  if (!row) { showToast('这条消息已不存在'); return; }
  ttsQueueLocate(key);
  ttsCommentAudio(key, row.getAttribute('data-msgid') || '');
}

function ttsLockGenerationVoice(pid) {
  if (!pid) return;
  try {
    localStorage.setItem('tts_generation_voice_lock', pid);
    localStorage.setItem('tts_generation_voice_incomplete', '1');
  } catch (e) {}
}

function ttsClearGenerationVoiceLock() {
  try {
    localStorage.removeItem('tts_generation_voice_incomplete');
    localStorage.removeItem('tts_generation_voice_lock');
  } catch (e) {}
}

function ttsRenderQueue() {
  const list = $('ttsQueueList');
  const count = $('ttsQueueCount');
  if (!list) return;
  const box = $('agentChatBox');
  if (!box) { list.innerHTML = ''; return; }
  const rows = Array.prototype.slice.call(box.querySelectorAll('.wc-row.agent'));
  const items = rows.map(row => {
    const key = row.getAttribute('data-key');
    const task = _msgGenTasks[key];
    const hasAudio = !!row.querySelector('.wc-voice');
    let kind = 'waiting', label = '待生成', detail = '';
    if (task) {
      const stage = (row.querySelector('.wc-gen-stage') || {}).textContent || '正在准备';
      kind = /等待前一条/.test(stage) ? 'waiting' : 'running';
      label = kind === 'waiting' ? '队列等待中' : '生成中';
      detail = stage.replace(/^⏳\s*/, '').replace(/…$/, '');
    } else if (hasAudio) {
      kind = 'done'; label = '已完成';
    } else if (_ttsQueueStates[key] && _ttsQueueStates[key].failed) {
      kind = 'failed'; label = '生成失败'; detail = _ttsQueueStates[key].error || '';
    }
    const history = _ttsQueueStates[key] && _ttsQueueStates[key].everFailed;
    if (_ttsQueueTab === 'failed' && !history) return null;
    if (_ttsQueueTab === 'running' && history && !task && !(!hasAudio)) return null;
    if (_ttsQueueTab === 'running' && history && !task && hasAudio) return null;
    if (_ttsQueueTab === 'running' && kind === 'failed') return null;
    if (_ttsQueueTab === 'failed' && history) {
      label = _ttsQueueStates[key].recovered ? '已恢复' : (_ttsQueueStates[key].failed ? '生成失败' : '恢复中');
      kind = _ttsQueueStates[key].recovered ? 'done' : (_ttsQueueStates[key].failed ? 'failed' : 'running');
      detail = _ttsQueueStates[key].error || '';
    }
    const dl = row.querySelector('.wc-voice-dl');
    return { key, text: ttsGetMsgText(row), kind, label, detail, audioUrl: dl ? dl.getAttribute('href') : '', order: kind === 'running' ? 0 : kind === 'waiting' ? 1 : kind === 'failed' ? 2 : kind === 'done' ? 3 : 4 };
  }).filter(Boolean).sort((a, b) => a.order - b.order);
  const active = items.filter(x => x.kind === 'running' || x.kind === 'waiting').length;
  const allRows = rows.length;
  const failedRows = rows.filter(row => _ttsQueueStates[row.getAttribute('data-key')] && _ttsQueueStates[row.getAttribute('data-key')].everFailed).length;
  const runCount = $('ttsQRunningCount'), failCount = $('ttsQFailedCount');
  if (runCount) runCount.textContent = allRows - failedRows;
  if (failCount) failCount.textContent = failedRows;
  const rt = $('ttsQTabRunning'), ft = $('ttsQTabFailed');
  if (rt) rt.classList.toggle('active', _ttsQueueTab === 'running');
  if (ft) ft.classList.toggle('active', _ttsQueueTab === 'failed');
  if (count) count.textContent = items.length ? ('共 ' + items.length + ' 条' + (active ? ' · ' + active + ' 条处理中' : '')) : '';
  if (!items.length) { list.innerHTML = '<div class="tts-queue-empty">当前会话还没有可生成语音的回复</div>'; return; }
  list.innerHTML = items.map(item =>
    '<div class="tts-q-item" data-key="' + esc(item.key) + '">' +
      '<div class="tts-q-main"><div class="tts-q-text">' + esc(item.text || '（空消息）') + '</div>' +
      (item.kind === 'done' && item.audioUrl ? '<audio class="tts-q-audio" controls preload="metadata" src="' + esc(item.audioUrl) + '"></audio>' : '') +
      '<div class="tts-q-meta"><span class="tts-q-status ' + item.kind + '">' + esc(item.label) + '</span>' + (item.detail ? '<span>' + esc(item.detail.slice(0, 44)) + '</span>' : '') + '</div>' +
      '<div class="tts-q-actions"><button class="tts-q-icon" onclick="ttsQueueLocate(\'' + item.key + '\')" title="定位到聊天记录"><svg><use href="#ic-search"/></svg></button><button onclick="ttsQueueRegenerate(\'' + item.key + '\')">重新生成</button><button onclick="ttsQueueComment(\'' + item.key + '\')">评论音频</button></div></div></div>'
  ).join('');
}

// 生成微信语音条的静态波形条（随机高度柱状，模拟语音振幅）
function ttsVoiceBars(n) {
  const hs = [5, 12, 8, 16, 10, 14, 6, 11, 9, 15, 7, 13, 8, 12, 6, 10, 14, 8, 11, 7];
  let out = '';
  for (let i = 0; i < n; i++) {
    const h = hs[i % hs.length];
    out += '<i style="height:' + h + 'px"></i>';
  }
  return out;
}

// 把某条消息的音频渲染成微信语音条（气泡+波形+时长+播放/下载）
function ttsRenderVoiceBar(bar, audioUrl, presetName) {
  const id = 'v' + (++ttsMsgSeq);
  const iconPlay = '<svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';
  const iconPause = '<svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>';
  const dlIcon = '<svg viewBox="0 0 24 24" width="13" height="13" fill="currentColor"><path d="M12 3a1 1 0 0 1 1 1v9.59l3.3-3.3a1 1 0 0 1 1.4 1.42l-5 5a1 1 0 0 1-1.4 0l-5-5a1 1 0 1 1 1.4-1.42l3.3 3.3V4a1 1 0 0 1 1-1zM5 19a1 1 0 0 1 1-1h12a1 1 0 0 1 0 2H6a1 1 0 0 1-1-1z"/></svg>';
  bar.innerHTML =
    '<div class="wc-voice" id="' + id + '" title="点击播放 / 暂停">' +
      '<span class="wc-voice-ico">' + iconPlay + '</span>' +
      '<span class="wc-voice-bar">' + ttsVoiceBars(20) + '</span>' +
      '<span class="wc-voice-dur">0″</span>' +
      '<a class="wc-voice-dl" href="' + audioUrl + '" download="' + esc(presetName || '语音') + '.wav" title="下载音频">' + dlIcon + '</a>' +
    '</div>';
  // 播放逻辑：点击切换播放/暂停，动态获取时长；全局互斥（微信式：点新条，旧条自动停）
  const el = bar.querySelector('.wc-voice');
  const audio = new Audio(audioUrl);
  audio.preload = 'auto';      // 整段预加载：点击时数据已就绪，避免「点了没反应/缓冲空档」
  let dur = 0;
  let loading = false;         // 是否正在加载/准备播放（防止重复触发）
  const setPlayingUI = (on) => {
    el.classList.toggle('playing', on);
    const ico = el.querySelector('.wc-voice-ico');
    if (ico) ico.innerHTML = on ? iconPause : iconPlay;
  };
  const stopThis = () => {
    try { audio.pause(); } catch (e) {}
    setPlayingUI(false);
    if (_curVoice && _curVoice.audio === audio) _curVoice = null;
  };
  audio.addEventListener('loadedmetadata', function () {
    dur = Math.max(1, Math.round(audio.duration || 0));
    const durEl = bar.querySelector('.wc-voice-dur');
    if (durEl) durEl.textContent = dur + '″';
  });
  audio.addEventListener('ended', function () {
    setPlayingUI(false);
    if (_curVoice && _curVoice.audio === audio) _curVoice = null;
  });
  audio.addEventListener('error', function () {
    // 音频加载/解码失败：复位 UI 并明确提示（而非静默没声音）
    loading = false;
    setPlayingUI(false);
    if (_curVoice && _curVoice.audio === audio) _curVoice = null;
    showToast('⚠ 音频加载失败，请稍后重试或重新生成这条语音');
    ttsPlaySound('err');
  });
  // 播放一条：先停旧条（互斥），再确保数据就绪后才真正 play，失败给出反馈
  const playThis = function () {
    // 互斥：先停掉全局正在播的另一条
    if (_curVoice && _curVoice.audio !== audio) {
      const prev = _curVoice;
      try { prev.audio.pause(); } catch (e) {}
      if (prev.el) prev.el.classList.remove('playing');
      const pico = prev.el && prev.el.querySelector('.wc-voice-ico');
      if (pico) pico.innerHTML = iconPlay;
    }
    _curVoice = { audio: audio, el: el };
    setPlayingUI(true);
    loading = true;
    // 若数据未就绪，强制加载（确保可播），加载完成再 play
    const doPlay = function () {
      const p = audio.play();
      if (p && typeof p.then === 'function') {
        p.then(function () { loading = false; })
         .catch(function (err) {
           loading = false;
           setPlayingUI(false);
           if (_curVoice && _curVoice.audio === audio) _curVoice = null;
           // 自动播放策略或解码失败：明确提示
           const name = (err && err.name) || '';
           if (name === 'NotAllowedError' || name === 'NotSupportedError') {
             showToast('⚠ 浏览器阻止了播放，请再点一下');
           } else {
             showToast('⚠ 播放失败，请重试');
           }
           ttsPlaySound('err');
         });
      } else {
        loading = false;
      }
    };
    if (audio.readyState >= 2) {           // HAVE_CURRENT_DATA 以上：可直接播
      doPlay();
    } else if (audio.readyState === 0) {   // 完全没数据：先 load 再播
      audio.load();
      audio.addEventListener('canplay', function onCan() {
        audio.removeEventListener('canplay', onCan);
        if (_curVoice && _curVoice.audio === audio) doPlay();
      }, { once: true });
    } else {
      audio.addEventListener('canplay', function onCan() {
        audio.removeEventListener('canplay', onCan);
        if (_curVoice && _curVoice.audio === audio) doPlay();
      }, { once: true });
    }
  };
  el.addEventListener('click', function (ev) {
    if (ev.target.closest('.wc-voice-dl')) return; // 点下载不触发放/停
    if (loading) return;                            // 正在准备播放，忽略连点
    if (audio.paused) {
      playThis();
    } else {
      audio.pause();
      setPlayingUI(false);
      if (_curVoice && _curVoice.audio === audio) _curVoice = null;
    }
  });
}

function ttsMsgPollStatus() {
  const keys = Object.keys(_msgGenTasks);
  // 没有进行中的任务就停掉定时器，节省轮询
  if (!keys.length) {
    if (ttsMsgPollTimer) { clearInterval(ttsMsgPollTimer); ttsMsgPollTimer = null; }
    return;
  }
  // 并行轮询所有进行中的任务，各自独立推进
  keys.forEach(key => {
    const task = _msgGenTasks[key];
    if (!task || !task.taskId) return;
    // 后端会为已提交到远端的任务持续守候（最长 15 分钟），避免重复提交；
    // 前端必须给出更长余量，不能提前把正常守候误判为卡死。
    const elapsed = Date.now() - (task.startAt || Date.now());
    if (elapsed > 1000 * 60 * 16) {
      delete _msgGenTasks[key];
      if (_msgGenTarget === key) _msgGenTarget = null;
      const row = $('agentChatBox').querySelector('.wc-row[data-key="' + key + '"]');
      if (row) {
        const bar = row.querySelector('.wc-audio');
        if (bar) bar.innerHTML = '<span style="color:#ff3b30;font-size:12px">❌ 合成超过远端保护时限，已安全结束；没有重复提交该请求</span>';
        ttsSetBtnState(key, 'retry');
      }
      ttsPlaySound('err');
      _ttsQueueStates[key] = { failed:true, everFailed:true, error:'超过远端保护时限' };
      ttsRenderQueue();
      return;
    }
    fetch('/api/tts/task/' + encodeURIComponent(task.taskId)).then(r => r.json()).then(d => {
      if (!d.ok) return; // 任务已结束被清理，忽略
      const st = d.state || {};
      if (st.running) {
        // 还在合成：更新对应气泡占位条
        const row = $('agentChatBox').querySelector('.wc-row[data-key="' + key + '"]');
        if (row) {
          const bar = row.querySelector('.wc-audio');
          const stage = st.stage || '正在合成语音';
          const waited = Math.max(0, Math.round((Date.now() - (task.startAt || Date.now())) / 1000));
          if (bar) {
            const stEl = bar.querySelector('.wc-gen-stage');
            if (stEl) {
              // 免费创空间是排队制，评论重生成等于重新排队。
              // 后端会在受控预算内自动重建连接和重试；这里仅展示其真实进度。
              stEl.textContent = '⏳ ' + stage + '…';
              // 5 分钟自动放弃：按已等待秒数推进进度条，替代原来的一长串文字说明
              let prog = bar.querySelector('.wc-gen-progress');
              if (!prog) {
                prog = document.createElement('div');
                prog.className = 'wc-gen-progress';
                prog.innerHTML = '<div class="wc-gen-fill"></div>';
                bar.appendChild(prog);
              }
              const pct = Math.min(100, Math.round(waited / 300 * 100));
              const fill = prog.querySelector('.wc-gen-fill');
              if (fill) fill.style.width = pct + '%';
              if (pct >= 100) prog.title = '自动恢复预算接近结束，程序会给出明确原因';
            }
          }
        }
        ttsRenderQueue();
        return; // 继续等这条
      }
      // 这条任务已结束：从注册表移除
      delete _msgGenTasks[key];
      if (_msgGenTarget === key) _msgGenTarget = null;
      const row = $('agentChatBox').querySelector('.wc-row[data-key="' + key + '"]');
      if (!row) return;
      const bar = row.querySelector('.wc-audio');
      if (st.last_error) {
        if (bar) bar.innerHTML = '<span style="color:#ff3b30;font-size:12px">❌ ' + esc(st.last_error.slice(0, 120)) + '</span>';
        ttsSetBtnState(key, 'retry');
        showToast('❌ 合成失败：' + (st.last_error.slice(0, 60) || '未知错误'));
        ttsPlaySound('err');
        _ttsQueueStates[key] = { failed:true, everFailed:true, error:st.last_error };
        ttsRenderQueue();
        return;
      }
      const h = st.result;
      if (h && bar) {
        ttsRenderVoiceBar(bar, '/api/tts/audio/' + encodeURIComponent(h.audio), h.preset);
        ttsSetBtnState(key, 'regen');
        ttsPlaySound('ok');
        if (_ttsQueueStates[key] && _ttsQueueStates[key].everFailed) {
          _ttsQueueStates[key].failed = false;
          _ttsQueueStates[key].recovering = false;
          _ttsQueueStates[key].recovered = true;
        }
        // 把音频结果绑定到消息并持久化，重开软件后直接恢复语音条、无需重新合成
        const mId = row.getAttribute('data-msgid') || '';
        if (mId && _chatSid) {
          fetch('/api/agent/msg_audio', { method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ sid: _chatSid, msg_id: mId, audio: h.audio, preset: h.preset || '' }) }).catch(() => {});
        }
      }
      ttsRenderQueue();
      if (!Object.keys(_msgGenTasks).length && !ttsMissingKeys().length) ttsClearGenerationVoiceLock();
    }).catch(() => {});
  });
  // 全部结束后自动停表
  if (!Object.keys(_msgGenTasks).length) {
    if (ttsMsgPollTimer) { clearInterval(ttsMsgPollTimer); ttsMsgPollTimer = null; }
  }
}

/* ---------- 批量配音 ---------- */

// 一键生成全部音频：智能识别「对方（求测者 B）」所有回复里，还有哪几条没生成语音条（含失败/未生成），
// 然后持续补生成，直到全部补齐。补齐期间新发的对方消息也会被自动纳入扫描。
// 判定「缺失」的依据：该 agent 消息行没有 .wc-voice 语音条（未生成 或 生成失败被清掉），且当前不在合成中。
function ttsMissingKeys() {
  const chatBox = $('agentChatBox');
  if (!chatBox) return [];
  return Array.prototype.slice.call(chatBox.querySelectorAll('.wc-row.agent')).filter(row => {
    if (!ttsGetMsgText(row)) return false;                          // 空正文跳过
    if (row.querySelector('.wc-voice')) return false;               // 已有语音条 → 不缺
    const key = row.getAttribute('data-key');
    if (_msgGenTasks[key] && _msgGenTasks[key].taskId) return false; // 正在合成 → 不缺（等它完成）
    return true;
  }).map(row => row.getAttribute('data-key'));
}

// 一键生成全部音频：手动一次性语义 + 并发限流 + 失败自动重试。
// 点一下 → 先检查当前「对方回复」还有哪几条没生成 → 快照这批 → 按并发窗口逐个生成（最多同时 TTS_CONCURRENT_MAX 条，
// 避免一次性打爆 IndexTTS 免费服务导致接口返回 None）→ 失败的自动补重试（最多 2 轮）→ 结束。
// 不自动追新消息；生成期间新发的消息要再点一次按钮才会被扫到。
// 兜底：①并发限流防过载 ②每条任务独立超时（轮询里 8 分钟卡死判定）③整体最多等 10 分钟 ④失败自动补生成 2 轮。

/* 强化主出口：对话里出现「对方回复还没生成语音」时，给「一键生成全部音频」按钮加脉冲高亮 + 缺失计数徽标，
   引导用户点主出口，而不是逐条点单条按钮。生成齐了自动消除。 */
function ttsHintGenAll() {
  const btn = $('ttsGenAllBtn');
  if (!btn || !_chatSid) return;
  const missing = ttsMissingKeys().length;
  // 清掉旧徽标
  const oldBadge = btn.querySelector('.tts-genall-badge');
  if (oldBadge) oldBadge.remove();
  if (missing > 0 && !_genAllRunning) {
    btn.classList.add('tts-genall-hint');
    const b = document.createElement('span');
    b.className = 'tts-genall-badge';
    b.textContent = missing;
    btn.appendChild(b);
  } else {
    btn.classList.remove('tts-genall-hint');
  }
}

async function ttsGenAllAudio() {
  if (_genAllRunning) { showToast('正在生成音频中，请稍候…'); return; }
  if (!_chatSid) { showToast('请先创建角色并进行对话'); return; }
  const pid = _chatVoiceId || $('ttsChatVoiceSel').value;
  if (!pid) { showToast('请先在上方选择一个音色'); return; }
  ttsLockGenerationVoice(pid);
  const btn = $('ttsGenAllBtn');
  const origLabel = btn ? btn.innerHTML : '';

  // 第一步：只检查，报告还有几条没生成（此刻的快照）
  const keys = ttsMissingKeys();
  if (!keys.length) { showToast('✅ 对方所有回复都已生成语音，无需生成'); return; }

  _genAllRunning = true;
  if (btn) { btn.disabled = true; btn.innerHTML = '<span class="btn-ico" style="margin-right:0"><svg><use href="#ic-speaker"/></svg></span>生成中…'; }
  showToast('🎵 检查到 ' + keys.length + ' 条回复没生成语音，开始生成（并发上限 ' + TTS_CONCURRENT_MAX + ' 条）');

  // 并发限流信号量：等「正在合成的任务数」降到上限以下再发起下一条
  const waitSlot = async function () {
    while (Object.keys(_msgGenTasks).length >= TTS_CONCURRENT_MAX) {
      await new Promise(res => setTimeout(res, 600));
    }
  };

  // 每一条由后端在受控预算内自动重连和重试；前端不再叠加盲目的第二套重试。
  const RETRY_ROUNDS = 0;
  let pending = keys.slice();       // 待生成队列
  try {
    for (let round = 0; round <= RETRY_ROUNDS && pending.length; round++) {
      const batch = pending;
      pending = [];
      for (const key of batch) {
        // 已被用户手动删掉/内容清空的行直接跳过
        const row = $('agentChatBox').querySelector('.wc-row[data-key="' + key + '"]');
        if (!row || !ttsGetMsgText(row)) continue;
        // 已有语音条说明上一轮其实成功了（或被手动生成），跳过
        if (row.querySelector('.wc-voice')) continue;
        await waitSlot();   // 并发限流：满 3 条就等
        await ttsGenAudioForRow(key, '', pid);
        await new Promise(res => setTimeout(res, 250));  // 启动间隔，避免请求太密
      }
      // 严格串行时，要给每条已提交的远端任务留足守候时间。
      const deadline = Date.now() + 1000 * 60 * 16 * Math.max(1, batch.length);
      while (Object.keys(_msgGenTasks).length && Date.now() < deadline) {
        await new Promise(res => setTimeout(res, 1200));
      }
      // 收集本轮仍失败的，进入下一轮重试
      if (round < RETRY_ROUNDS) {
        for (const key of batch) {
          const r2 = $('agentChatBox').querySelector('.wc-row[data-key="' + key + '"]');
          if (r2 && !r2.querySelector('.wc-voice')) pending.push(key);
        }
        if (pending.length) showToast('🔄 有 ' + pending.length + ' 条失败，自动重试第 ' + (round + 1) + ' 轮…');
      }
    }
  } finally {
    _genAllRunning = false;
    if (btn) { btn.disabled = false; btn.innerHTML = origLabel; }
  }

  // 收尾：统计最终结果（只统计本次快照这批）
  let okCount = 0, failCount = 0;
  for (const key of keys) {
    const row = $('agentChatBox').querySelector('.wc-row[data-key="' + key + '"]');
    if (row && row.querySelector('.wc-voice')) okCount++;
    else failCount++;
  }
  if (failCount) {
    showToast('⚠ 生成完成：成功 ' + okCount + ' 条，失败 ' + failCount + ' 条。失败项已完成自动恢复，请按错误原因检查配置或服务状态。');
    ttsPlaySound('err');
  } else {
    showToast('✅ 全部音频生成完成（共 ' + okCount + ' 条）');
    ttsPlaySound('ok');
  }
  ttsHintGenAll();
}

async function ttsStartBatch() {
  if (!_chatSid) { showToast('请先进行对话'); return; }
  const pid = _chatVoiceId || $('ttsChatVoiceSel').value;
  if (!pid) { showToast('请先在上方选择一个音色'); return; }
  ttsLockGenerationVoice(pid);
  $('chatBatchBtn').disabled = true;
  try {
    // 获取 agent 所有回复
    const msgsResp = await fetch('/api/agent/tts_messages/' + _chatSid).then(r => r.json());
    if (!msgsResp.ok || !msgsResp.messages.length) { showToast('没有可配音的回复'); return; }
    const messages = msgsResp.messages.map(m => ({ id: m.id, text: m.content }));
    // 语速：优先用聊天区顶部「语速」下拉的显式档位，auto 走自适应
    const chatSpeedEl = $('ttsChatSpeedSel');
    const speedVal = chatSpeedEl ? chatSpeedEl.value : 'auto';
    const payload = {
      messages, preset_id: pid,
      lang: 'ZH',
      emo_mode: 'same',
      emo_vec: [],
      emo_weight: 0.65,
      duration_factor: (speedVal && speedVal !== 'auto') ? parseFloat(speedVal) : 1.0,
      emo_random: false,
    };
    const d = await fetch('/api/tts/batch', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload) }).then(r => r.json());
    if (!d.ok) { showToast('⚠ ' + (d.error || '启动失败')); return; }
    showToast('🎵 批量配音已启动，共 ' + d.total + ' 条');
    // 弹出批量结果面板
    const chatBox = $('agentChatBox');

    ttsBatchTimer = setInterval(ttsPollBatch, 2000);

// 批量调音：一次评论，应用到当前已经生成语音的所有求测者回复。
// 只重做音频参数，不改文字、不调用洗稿接口；逐条等待上一条结束，避免打爆免费 TTS 队列。
async function ttsBatchCommentAudio() {
  if (!_chatSid) { showToast('请先进行对话'); return; }
  const pid = _chatVoiceId || ($('ttsChatVoiceSel') && $('ttsChatVoiceSel').value);
  if (!pid) { showToast('请先选择音色'); return; }
  ttsLockGenerationVoice(pid);
  if (window.__ttsBatchCommentRunning) { showToast('批量调音正在进行中'); return; }
  const rows = Array.prototype.slice.call(document.querySelectorAll('#agentChatBox .wc-row.agent')).filter(row => {
    return ttsGetMsgText(row) && row.querySelector('.wc-voice') && row.getAttribute('data-msgid');
  });
  if (!rows.length) { showToast('没有已生成语音的对方回复可调整'); return; }
  const f = await openModal({
    title: '批量调音',
    sub: '这条意见会逐条应用到已生成的对方语音；原文不变。',
    fields: [{ name:'comment', label:'统一调整意见', type:'textarea', rows:4,
      placeholder:'例如：整体再自然一点，语速稍慢，情绪收一点，重点词停顿一下。' }],
    okText: '开始批量调音'
  });
  if (!f || !f.comment || !f.comment.trim()) return;
  const btn = $('chatBatchBtn');
  window.__ttsBatchCommentRunning = true;
  if (btn) { btn.disabled = true; btn.textContent = '调音中…'; }
  let ok = 0, fail = 0;
  try {
    for (let i = 0; i < rows.length; i++) {
      const row = rows[i];
      const key = row.getAttribute('data-key');
      showToast('🎯 正在调音 ' + (i + 1) + '/' + rows.length + '，完成后自动处理下一条');
      await ttsGenAudioForRow(key, f.comment.trim(), pid);
      // ttsGenAudioForRow 注册任务后立即返回；等待该任务从轮询表移除，再处理下一条。
      const deadline = Date.now() + 1000 * 60 * 8;
      while (_msgGenTasks[key] && Date.now() < deadline) {
        await new Promise(resolve => setTimeout(resolve, 1200));
      }
      if (row.querySelector('.wc-voice')) ok++; else fail++;
    }
  } finally {
    window.__ttsBatchCommentRunning = false;
    if (btn) { btn.disabled = false; btn.innerHTML = '<span class="btn-ico" style="margin-right:0"><svg><use href="#ic-comment"/></svg></span>批量调音'; }
  }
  showToast(fail ? ('⚠ 批量调音完成：成功 ' + ok + ' 条，失败 ' + fail + ' 条，失败项已保留原音频') : ('✅ 批量调音完成：' + ok + ' 条'));
}

async function ttsPollBatch() {
  try {
    const d = await fetch('/api/tts/batch/status').then(r => r.json());
    const st = d.state || {};
    const panel = $('batchPanel');
    if (!panel) { if (ttsBatchTimer) { clearInterval(ttsBatchTimer); ttsBatchTimer = null; } return; }
    if (st.running) {
      panel.innerHTML = '<div style="font-weight:600;margin-bottom:6px">🎵 批量配音进度：' + st.done + '/' + st.total + '</div>' +
        '<div class="muted" style="font-size:12px">' + esc(st.stage || '') + ' · ' + esc(st.current_text || '') + '</div>' +
        '<div style="margin-top:6px"><div style="height:6px;background:var(--c-border);border-radius:3px;overflow:hidden">' +
          '<div style="height:100%;width:' + (st.total ? st.done / st.total * 100 : 0) + '%;background:#34c759;transition:width .3s"></div>' +
        '</div></div>';
    } else {
      if (ttsBatchTimer) { clearInterval(ttsBatchTimer); ttsBatchTimer = null; }
      const results = st.results || [];
      const okCount = results.filter(r => r.ok).length;
      panel.innerHTML = '<div style="font-weight:600;margin-bottom:8px">✅ 批量完成：' + okCount + '/' + results.length + ' 条成功</div>' +
        results.map(r =>
          '<div class="tts-hist-item">' +
            '<div style="min-width:0;flex:1">' +
              '<div style="font-size:13px">' + (r.ok ? '✅' : '❌') + ' ' + esc(r.text || '') + '</div>' +
              (r.error ? '<div style="color:#ff3b30;font-size:12px">' + esc(r.error) + '</div>' : '') +
            '</div>' +
            (r.ok ? '<audio controls src="/api/tts/audio/' + encodeURIComponent(r.audio) + '" style="height:28px;width:200px"></audio>' +
              '<a class="mp-mini-btn" href="/api/tts/audio/' + encodeURIComponent(r.audio) + '" download="agent-' + esc(r.msg_id) + '.wav">⬇</a>' : '') +
          '</div>').join('');
    }
  } catch (_) {}
}

async function loadRewrite(){

      v.innerHTML = '<div class="empty">⏳ 仍在加载中…如果超过 10 秒请检查服务是否启动，或<button class="btn-ghost" onclick="loadRewrite()">重试</button></div>';
    }
  }, 5000);
  try {
    const [l, m] = await Promise.all([
      fetch('/api/rewrite/list').then(r=>r.json()),
      fetch('/api/rewrite/meta').then(r=>r.json())
    ]);

  let logHtml = replLog.length
    ? replLog.slice(-8).reverse().map(x =>
        '<div class="li">🔁 ' + esc(x.region_label || x.region) + '：' + esc(x.from) + ' → <b>' + esc(x.to) + '</b><span class="muted">' + esc(x.date || '') + '</span></div>'
      ).join('')
    : '<div class="muted">暂无负责人替换记录</div>';

    ? shown.map(rwItemHtml).join('')

        '<button class="btn-ghost" onclick="rwEvaluate()"><span class="btn-ico"><svg style="width:14px;height:14px"><use href="#ic-chart"/></svg></span>负责人评价' +
          (meta.evaluated_count ? '（' + meta.evaluated_count + '/3）' : '') + '</button>' +
        '<button class="btn-primary" onclick="newRewrite()"><span class="btn-ico"><svg style="width:14px;height:14px"><use href="#ic-plus"/></svg></span>新建洗稿</button>' +
      '</div>' +
    '</div>' +
    '<div class="rw-mat" id="rwMatPanel" style="display:none">' +
      '<div class="rw-mat-hd" onclick="rwToggleMaterials()"><span class="ico" style="width:15px;height:15px;color:var(--primary)"><svg><use href="#ic-fire"/></svg></span>爆款素材库<span class="cnt" id="rwMatCnt2"></span><span class="chev" id="rwMatChev">▾</span></div>' +

      '<select id="rwStatus">' + ['', 'running', 'review', 'done'].map(s =>

    '</div>' +

      '<div class="rw-list">' + shownHtml + '</div>' +

        (rwCurrent ? '' : '<div class="rw-empty">👈 从左侧选择一篇洗稿，或新建一篇</div>') +

async function rwRedo(rid){
  // 「重新洗」：保留原稿与四维数据，换要求一键重跑
  let old = null;
  try{ const d = await fetch('/api/rewrite/' + rid).then(r=>r.json()); if (d.ok) old = d.session; }catch(_){}
  if (!old){ showToast('⚠ 找不到该洗稿记录'); return; }
  const f = await openModal({
    title: '🔄 重新洗',
    sub: '保留原稿与四维数据，只换洗稿要求重跑一遍（生成新记录，旧稿保留可对比）。',
    fields: [
      { name:'requirements', label:'新的洗稿要求', type:'textarea', rows:3, placeholder: old.requirements || '例如：这次把开头改成更炸的钩子；结尾加强行动号召…' },
    ], okText:'重新洗'
  });
  if (!f) return;
  const d = await post('/api/rewrite/' + rid + '/redo', { requirements: f.requirements || '' });
  if (!d.ok){ showToast('⚠ ' + (d.error || '重新洗失败')); return; }
  showToast('🔄 已重新洗稿，正在生成中…');
  loadRewrite();
  setTimeout(()=>{ if (d.sid) openRwStream(d.sid); }, 600);
}

function _mergeLimitAndRequirements(limitChecked, requirements) {

// 分步洗稿向导：①校对原稿 → ②校对数据 → ③洗稿要求。返回最终数据对象或 null。
async function wizardRewrite(init){
  const data = Object.assign({ original:'', likes:'', comments:'', forwards:'', saves:'', limit_chars:true, requirements:'' }, init || {});
  let step = 1;
  const root = $('modalRoot');
  const box = document.createElement('div');
  box.className = 'modal-mask';
  box.innerHTML =
    '<div class="modal-box" style="max-width:560px">' +
      '<div class="wizard-step" id="wzSteps"></div>' +
      '<div class="modal-title" id="wzTitle">📝 第 1 步 · 校对原稿文案</div>' +
      '<div class="modal-sub" id="wzSub">检查并修改原稿文案，确认后进入下一步。</div>' +
      '<div id="wzBody"></div>' +
      '<div class="modal-btns">' +
        '<button class="cancel" id="wzBack" style="display:none">‹ 上一步</button>' +
        '<button class="cancel" data-act="cancel">取消</button>' +
        '<button class="ok" id="wzNext">下一步 ›</button>' +
      '</div>' +
    '</div>';
  root.appendChild(box);

  const titleEl = box.querySelector('#wzTitle');
  const subEl = box.querySelector('#wzSub');
  const bodyEl = box.querySelector('#wzBody');
  const backBtn = box.querySelector('#wzBack');
  const nextBtn = box.querySelector('#wzNext');

  function renderSteps(){
    const steps = [ {n:1,label:'校对原稿'}, {n:2,label:'校对数据'}, {n:3,label:'洗稿要求'} ];
    const stepsEl = box.querySelector('#wzSteps');
    if (!stepsEl) return;
    stepsEl.innerHTML = steps.map((s,i)=>{
      const state = s.n < step ? 'done' : (s.n === step ? ' active' : '');
      const sep = i < steps.length - 1 ? '<span class="ws-sep' + (s.n < step ? ' done' : '') + '"></span>' : '';
      return '<span class="ws-dot' + state + '" data-step="' + s.n + '"' + (s.n < step ? ' title="回到第 ' + s.n + ' 步"' : '') + '>' + s.n + '</span><span class="ws-label">' + s.label + '</span>' + sep;
    }).join('');
    stepsEl.querySelectorAll('.ws-dot[data-step]').forEach(d => {
      const n = +d.dataset.step;
      d.addEventListener('click', () => {
        if (n >= step) return;
        collect();
        step = n; render();
      });
    });
  }

  function render(){
    renderSteps();
    let body = '', okLabel = '下一步 ›', showBack = step > 1;
    if (step === 1) {
      titleEl.textContent = '📝 第 1 步 · 校对原稿文案';
      subEl.textContent = '检查并修改原稿文案，确认无误后进入下一步。';
      body = '<div class="mfield"><label>原稿文案（可编辑）</label>' +
        '<textarea id="wzOriginal" rows="12" placeholder="提取到的文案…">' + esc(data.original) + '</textarea></div>';
    } else if (step === 2) {
      titleEl.textContent = '📊 第 2 步 · 校对互动数据';
      subEl.textContent = '检查四维互动数据，可从监控/作品库带入，也可留空。';
      body =
        '<div class="wz-metrics">' +
          '<div class="mfield"><label>点赞量</label><input type="text" id="wzLikes" placeholder="例如 12800" value="' + esc(data.likes) + '"></div>' +
          '<div class="mfield"><label>评论量</label><input type="text" id="wzComments" placeholder="例如 860" value="' + esc(data.comments) + '"></div>' +
          '<div class="mfield"><label>转发量</label><input type="text" id="wzForwards" placeholder="例如 320" value="' + esc(data.forwards) + '"></div>' +
          '<div class="mfield"><label>收藏量</label><input type="text" id="wzSaves" placeholder="例如 1500" value="' + esc(data.saves) + '"></div>' +
        '</div>';
    } else {
      titleEl.textContent = '🎯 第 3 步 · 洗稿要求';
      subEl.textContent = '设置洗稿后的字数与你的具体要求，确认后开始洗稿。';
      okLabel = '确认并开始洗稿';
      body =
        '<label class="checkbox-row" style="margin-top:2px"><input type="checkbox" id="wzLimit"' + (data.limit_chars ? ' checked' : '') + '><span>默认洗稿后完整字数为 550-600 字</span></label>' +
        '<div class="mfield"><label>洗稿要求（可选）</label>' +
        '<textarea id="wzReq" rows="4" placeholder="例如：开头更有冲击力，结尾加关注引导…">' + esc(data.requirements) + '</textarea></div>';
    }
    bodyEl.innerHTML = body;
    backBtn.style.display = showBack ? '' : 'none';
    nextBtn.textContent = okLabel;
  }

  function collect(){
    if (step === 1) data.original = (box.querySelector('#wzOriginal')||{}).value || '';
    else if (step === 2) {
      data.likes = (box.querySelector('#wzLikes')||{}).value || '';
      data.comments = (box.querySelector('#wzComments')||{}).value || '';
      data.forwards = (box.querySelector('#wzForwards')||{}).value || '';
      data.saves = (box.querySelector('#wzSaves')||{}).value || '';
    } else {
      data.limit_chars = (box.querySelector('#wzLimit')||{}).checked === true;
      data.requirements = (box.querySelector('#wzReq')||{}).value || '';
    }
  }

  function finish(value){
    animateRemove(box, 'closing', 150);
    if (resolveFn){ const r = resolveFn; resolveFn = null; r(value); }
  }

  render();
  nextBtn.addEventListener('click', ()=>{
    collect();
    if (step === 1) {
      if (!data.original.trim()) { showToast('原稿文案不能为空'); return; }
      step = 2; render();
    } else if (step === 2) {
      step = 3; render();
    } else {
      finish({ original:data.original, likes:data.likes, comments:data.comments, forwards:data.forwards, saves:data.saves, requirements:_mergeLimitAndRequirements(data.limit_chars, data.requirements) });
    }
  });
  backBtn.addEventListener('click', ()=>{ collect(); step--; render(); });
  box.querySelector('[data-act=cancel]').addEventListener('click', ()=>finish(null));
  box.addEventListener('mousedown', e=>{ if (e.target===box) finish(null); });
  const escHandler = ev => { if (ev.key === 'Escape') { finish(null); document.removeEventListener('keydown', escHandler); } };
  document.addEventListener('keydown', escHandler);
  let resolveFn = null;
  return new Promise(resolve => { resolveFn = resolve; });
}

// 把一段文本切成句子（前端兜底，与后端 split_sentences 一致）
function rwSplitSentences(text){
  if (!text) return [];
  const parts = String(text).split(/(?<=[。！？!?…\n])|(?<=\n)/);
  return parts.map(s => s.trim()).filter(s => typeof s === 'string' && s.length >= 2);
}

function rwDetailHtml(s){
  const regions = (rwMeta && rwMeta.regions) || [];
  const untouchable = s.untouchable || [];
  const parts = s.parts || {};
  // 兼容旧流程：无 final 或 final 是后端兜底生成的 → 顶部给「重新洗稿」引导
  const backfilled = !!(parts['final'] && parts['final'].backfilled);
  const isLegacy = !parts['final'] || backfilled;
  // 全文流：按 regions 顺序把所有句子拼成一篇连续文章
  const fullTextHtml = rwFullTextHtml(s.id, regions, parts, untouchable);

  const { sentCount, charCount } = (() => {
    let n = 0, c = 0, allText = '';
    const final = parts['final'];
    if (final && final.sentences && final.sentences.length) {
      n = final.sentences.length;
      for (const s of final.sentences) { if (s) allText += String(s); }
    } else {
      for (const r of regions) {
        const p = parts[r.id] || {};
        const sents = p.sentences && p.sentences.length ? p.sentences : (rwSplitSentences(p.text) || []);
        n += sents.length;
        for (const s of sents) { if (s) allText += String(s); }
      }
    }
    // 中文字符 + 英文/数字字符（去除空白）
    c = (allText.match(/[\u4e00-\u9fa5a-zA-Z0-9]/g) || []).length;
    return { sentCount: n, charCount: c };
  })();
  const targetMin = 550, targetMax = 700;
  const charTip = charCount > 0
    ? (' · 约 ' + charCount + ' 字' + (charCount < targetMin ? '（偏少，目标 550-700）' : charCount > targetMax ? '（偏多，目标 550-700）' : '（目标 550-700）'))
    : '';
  const charColor = charCount > 0 && (charCount < targetMin || charCount > targetMax) ? 'color:#dc2626;' : '';

  // 洗稿要求若有则短展示一行
  const reqBar = s.requirements
    ? '<div class="rw-bar" style="margin:6px 0 0;color:var(--c-text-sub);font-size:12px">📌 ' + esc(s.requirements) + '</div>'
    : '';

  // 行动作按钮（保留最核心的 4 个）
  const actions = '<div class="rw-actions" style="margin-top:14px">' +
    (s.status !== 'done'
      ? '<button class="btn-primary" onclick="rwFinalize(\'' + s.id + '\')">⚖️ 最终审查 + 记录分工</button>'
      : '') +
    '<button class="btn-ghost" onclick="rwToWork(\'' + s.id + '\')">💾 保存为作品</button>' +

function toggleRwHd(btn){
  const detail = btn && btn.parentNode && btn.parentNode.nextElementSibling;
  if (!detail) return;
  const open = btn.getAttribute('data-open') === '1';
  detail.style.display = open ? 'none' : '';
  btn.setAttribute('data-open', open ? '0' : '1');
  btn.textContent = open ? '▾ 详情' : '▴ 收起';
}

// 剥掉旧数据里专家自带的作者前缀（「XX：」「【整体节奏】」等），返回干净句子。
// 整句是专家的过程性/指令性话语时返回空串丢弃。
function rwStripPrefix(s){
  if (!s) return '';
  let t = String(s).trim();
  if (/^[—\-*＿=~·\.\s]+$/.test(t)) return '';   // 纯分隔符丢弃
  // 剥掉整段开头的「【某某】」独占行前缀
  t = t.replace(/^【[^】]+】\s*/, '').trim();
  // 剥掉句首「作者名：」前缀
  t = t.replace(/^[^\s，。！？！；]{1,6}[:：]\s*/, '').trim();
  if (!t) return '';
  // 过滤明显的过程性/指令性句子
  const head = t.slice(0, 6);
  const PROC = ['收到','我来','我负责','我这边','已收到','好的','好嘞','明白','按骨架','按第','这一part','这一部分','这部分','交给评论区','我只负责','先给你','我来写','我先把','我的思路','这里我','这part'];
  for (const k of PROC) if (head.indexOf(k) >= 0) return '';
  return t;
}

// 全文流：优先渲染 final（连续文章，每句按作者颜色），无 final 时回退把各分区剥前缀后拼成连续段落
function rwFullTextHtml(rid, regions, parts, untouchable){
  let html = '';
  const untSet = new Set((untouchable || []).map(u => (u && u.sentence ? u.sentence : '').replace(/[\s\u3000]+/g, '')));
  const lines = [];
  // 优先使用整体节奏负责人拼装后的最终成品（final 分区）
  const final = (parts && parts['final']);
  if (final && final.sentences && final.sentences.length) {
    const agents = final.agents || [];
    for (let i = 0; i < final.sentences.length; i++) {
      const s = final.sentences[i];
      if (s === null || s === undefined || (typeof s !== 'string' && typeof s !== 'number')) continue;
      const str = String(s).trim();
      if (!str) continue;
      const norm = str.replace(/[\s\u3000]+/g, '');
      const isUnt = untSet.has(norm);
      const safe = esc(str);
      const inner = isUnt ? '<strong>' + safe + '</strong>' : safe;
      const agent = agents[i] || final.agent || '';
      const color = agent ? colorOf(agent) : '#94A3B8';
      lines.push('<span class="rw-s-line" id="rws-' + rid + '-final-' + i + '" data-region="final" data-idx="' + i + '" data-txt="' + safe + '" style="color:' + color + '">' + inner + '<span class="rw-s-act"><button onclick="rwSentenceComment(\'' + rid + '\',\'final\',' + i + ')">💬</button></span></span>');
    }
  }
  // 没有 final 时回退到按 regions 顺序拼（兼容旧数据）：剥作者前缀，全部连成一篇连续文章
  if (!lines.length) {
    for (const r of regions || []) {
      if (!r) continue;
      const p = (parts && parts[r.id]) || {};
      const agent = p.agent || '';
      const sentences = p.sentences && p.sentences.length
        ? p.sentences
        : (rwSplitSentences(p.text) || []);
      if (!sentences.length) continue;
      const color = agent ? colorOf(agent) : '#94A3B8';
      for (let i = 0; i < sentences.length; i++) {
        const s = sentences[i];
        if (s === null || s === undefined || (typeof s !== 'string' && typeof s !== 'number')) continue;
        // 旧数据句子常带作者前缀，剥掉只留正文
        const clean = rwStripPrefix(s);
        if (!clean) continue;
        const norm = clean.replace(/[\s\u3000]+/g, '');
        const isUnt = untSet.has(norm);
        const safe = esc(clean);
        const inner = isUnt ? '<strong>' + safe + '</strong>' : safe;
        lines.push('<span class="rw-s-line" id="rws-' + rid + '-' + r.id + '-' + i + '" data-region="' + esc(r.id) + '" data-idx="' + i + '" data-txt="' + safe + '" style="color:' + color + '">' + inner + '<span class="rw-s-act"><button onclick="rwSentenceComment(\'' + rid + '\',\'' + esc(r.id) + '\',' + i + ')">💬</button></span></span>');
      }
    }
  }
  if (!lines.length) return '<div class="rw-flow-empty">（暂无成品内容）</div>';
  return '<p class="rw-para">' + lines.join('') + '</p>';
}

function scrollBottomRw(){
  const el = document.querySelector('.main');
  if (el) el.scrollTop = el.scrollHeight;

function connectRwStream(sid){
  if (rwEs) { try { rwEs.close(); } catch(_){} }
  rwEs = new EventSource('/api/stream/' + sid);
  rwEs.onmessage = e => {
    let ev; try { ev = JSON.parse(e.data); } catch(_) { return; }
    rwHandle(ev);
  };
  rwEs.onerror = () => {};
}

function rwHandle(ev){
  if (ev.seq && rwRenderedSeqs.has(ev.seq)) return;
  if (ev.seq) rwRenderedSeqs.add(ev.seq);
  if (ev.type === 'system' || ev.kind === 'phase') {
    // 阶段进度 → 可见的进度条区（不折叠）
    const prog = $('rwProgress');
    if (prog) {
      const div = document.createElement('div');
      div.className = 'rw-prog-item';
      div.innerHTML = '<span class="dot"></span>' + esc(ev.text || '');
      prog.appendChild(div);
      scrollBottomRw();
    }
    return;
  }
  if (ev.type === 'error') { showToast('⚠ ' + (ev.text || '出错')); return; }
  if (ev.type === 'typing') {
    // 谁正在写 → 进度条区显示
    const prog = $('rwProgress');
    if (prog) {
      const old = $('rwTyping');
      if (old) old.remove();
      const div = document.createElement('div');
      div.className = 'rw-typing'; div.id = 'rwTyping';
      div.textContent = ev.name + ' 正在写…';
      prog.appendChild(div); scrollBottomRw();
    }
    return;
  }
  if (ev.type === 'message') {
    const typing = $('rwTyping'); if (typing) typing.remove();
    const kind = ev.kind || 'analysis';
    // 句级重写：直接在成品句子流里就地更新这一句，不往讨论区堆消息
    if (kind === 'sentence_update') {
      if (ev.region) {
        rwSentenceUpdate(ev);
        rwBusy = false;   // 句级重写完成解除 busy
      }
      return;
    }
    // 分区成品 → 只更新成品句子流（可见），不往折叠的分析区重复堆
    if (kind === 'part' && ev.region) {
      if (ev.region === 'final') {
        // final 是整体节奏拼装的成品，不在 rwMeta.regions 里，直接更新
        upsertRwPart(ev);
      } else {
        const r = (rwMeta && rwMeta.regions || []).find(x => x.id === ev.region);
        if (r) upsertRwPart(ev);
      }
      if (ev.is_iteration) rwBusy = false;  // 迭代完成解除 busy
      return;
    }
    // 其余（分析/骨架/审查/记录/评价）→ 详情页不再展示长文，直接跳过
    return;
  }
  if (ev.type === 'done') {
    const typing = $('rwTyping'); if (typing) typing.remove();
    if (rwEs) { try { rwEs.close(); } catch(_){} rwEs = null; }
    loadRewrite();
    return;
  }
}

function upsertRwPart(ev){
  // 分区成品消息（实时流程中）→ 更新 rwSessionCache 并重建全文流
  if (!rwSessionCache || !ev.region) return;
  const parts = rwSessionCache.parts || (rwSessionCache.parts = {});
  const old = parts[ev.region] || {};
  const agent = ev.name || old.agent || '';
  if (ev.region === 'final' && ev.text) {
    // final 是整体节奏拼装的成品：解析带【作者】的句子，保存每句作者
    const sents = [];
    const ags = [];
    for (const raw of rwSplitSentences(ev.text)) {
      const m = raw.match(/^【(.+?)】\s*(.+)$/);
      if (m) { sents.push(m[2]); ags.push(m[1].trim()); }
      else { sents.push(raw); ags.push(''); }
    }
    parts['final'] = {
      agent: agent,
      text: ev.text || old.text || '',
      sentences: sents,
      agents: (ev.agents && ev.agents.length ? ev.agents : ags),
      comments: old.comments || [],
    };
  } else {
    parts[ev.region] = {
      agent: agent,
      text: ev.text || old.text || '',
      sentences: rwSplitSentences(ev.text || old.text || ''),
      comments: old.comments || [],
    };
  }
  // 重建全文流容器
  const full = document.querySelector('.rw-fulltext');
  if (full) {
    full.innerHTML = rwFullTextHtml(rwCurrent, (rwMeta && rwMeta.regions) || [], parts, rwSessionCache.untouchable || []);
  }
  if (ev.is_iteration) rwBusy = false;   // 迭代完成解除 busy
  scrollBottomRw();
}

// 逐句评论：让负责该分区的专家只按你的评论重写这一句

    fields: [{ name:'comment', label:'你的评论', type:'textarea', rows:3, placeholder:'例如：这句太软，换成更扎心的反问…' }],

  });

  if (rwBusy) { showToast('⏳ 专家正在重写中，请稍候…'); return; }

  try {
    const d = await post('/api/rewrite/' + rid + '/sentence_comment', {

    });

    el.classList.add('rw-s-pending');

    setTimeout(() => { rwBusy = false; }, 90000);
  }
}

// SSE 就地更新某一句（sentence_update 事件）
function rwSentenceUpdate(ev){
  const regionId = ev.region;
  const oldTxt = ev.sentence || '';
  const newTxt = ev.text || '';
  if (!regionId || !oldTxt || !newTxt) return;
  // 更新 rwSessionCache 中的对应句（保持缓存与 DOM 一致）
  if (rwSessionCache && rwSessionCache.parts && rwSessionCache.parts[regionId]) {
    const p = rwSessionCache.parts[regionId];
    const sents = p.sentences || rwSplitSentences(p.text || '');
    for (let i = 0; i < sents.length; i++) {
      const norm = sents[i].replace(/[\s\u3000]+/g, '');
      const oldNorm = oldTxt.replace(/[\s\u3000]+/g, '');
      if (norm === oldNorm || norm.slice(0, 12) === oldNorm.slice(0, 12)) {
        sents[i] = newTxt;
        break;
      }
    }
    p.sentences = sents;
    p.text = sents.join('\n\n');
  }
  // 在全文流里定位该句并就地更新（inline span .rw-s-line）
  const full = document.querySelector('.rw-fulltext');
  if (!full) return;
  let target = null;
  full.querySelectorAll('.rw-s-line').forEach(s => {
    if (s.getAttribute('data-txt') === oldTxt) target = s;
  });
  if (!target) {
    const head = oldTxt.replace(/[\s\u3000]+/g, '').slice(0, 12);
    full.querySelectorAll('.rw-s-line').forEach(s => {
      const t = (s.getAttribute('data-txt') || '').replace(/[\s\u3000]+/g, '').slice(0, 12);
      if (head && t === head) target = s;
    });
  }
  if (!target) { showToast('已重写，但找不到对应句子，请刷新查看'); return; }
  // 重建该句 innerHTML：保留评论按钮；如果新句是某个不可动句，加 strong
  const untSet = new Set(((rwSessionCache && rwSessionCache.untouchable) || []).map(u => (u && u.sentence ? u.sentence : '').replace(/[\s\u3000]+/g, '')));
  const newNorm = newTxt.replace(/[\s\u3000]+/g, '');
  const isUnt = untSet.has(newNorm);
  const safe = esc(newTxt);
  const inner = isUnt ? '<strong>' + safe + '</strong>' : safe;
  // 保留原有的 comment 按钮
  const actBtn = target.querySelector('.rw-s-act');
  target.innerHTML = inner + (actBtn ? actBtn.outerHTML : '');
  target.setAttribute('data-txt', newTxt);
  target.classList.remove('rw-s-pending');
  showToast('✅ 该句已按你的评论重写');
}

/* ---------- 评价结果面板 + 一键应用替换 ---------- */
function rwEvalPanelHtml(evals){
  if (!evals || evals.status !== 'evaluated') return '';
  const verdicts = evals.verdicts || [];
  const curAssign = (rwMeta && rwMeta.assignments) || {};
  const rows = verdicts.map(v => {
    const r = (rwMeta && rwMeta.regions || []).find(x => x.id === v.region) || {};
    const label = r.label || v.region;
    const isReplace = v.verdict === 'replace';
    const applied = !!v.applied;
    const cur = curAssign[v.region];
    const nowAgent = v.agent || cur || '?';
    return '<div class="rw-vd ' + (isReplace ? 'rep' : 'keep') + (applied ? ' applied' : '') + '">' +
      '<div class="vd-h"><span class="vd-region">' + esc(label) + '</span>' +
        '<span class="vd-badge ' + (isReplace ? 'rep' : 'keep') + '">' + (applied ? '✅ 已应用' : (isReplace ? '🔁 建议替换' : '✅ 留任')) + '</span>' +
        '<span class="vd-agent" style="background:' + colorOf(nowAgent) + '">' + esc(nowAgent) + '</span>' +
        (isReplace && v.suggested ? '<span class="vd-arrow">→</span><span class="vd-agent" style="background:' + colorOf(v.suggested) + '">' + esc(v.suggested) + '</span>' : '') +
        (cur && cur !== nowAgent ? '<span class="muted">（当前：' + esc(cur) + '）</span>' : '') +
      '</div>' +
      (v.reason ? '<div class="vd-reason">' + esc(v.reason) + '</div>' : '') +
      (isReplace && !applied
        ? '<button class="btn-ghost vd-apply" onclick="rwApplyOne(\'' + esc(v.region) + '\')">应用这条替换</button>'
        : '') +
    '</div>';
  }).join('');
  const nRep = verdicts.filter(v => v.verdict === 'replace' && !v.applied).length;
  return '<div class="rw-eval panel" style="margin-top:14px">' +
    '<div class="card-title">📊 最近评价结果（阿数）' +
      (evals.applied_at ? '<span class="muted" style="font-weight:400">已应用：' + esc(evals.applied_at) + '</span>' : '') +
    '</div>' +
    (evals.standards ? '<div class="rw-bar">评价标准：' + esc(String(evals.standards).slice(0,300)) + '</div>' : '') +
    (verdicts.length ? '<div class="rw-vds">' + rows + '</div>' : '<div class="muted">暂无区域判断</div>') +
    (nRep > 0
      ? '<div style="margin-top:10px"><button class="btn-primary" onclick="rwApplyAll()">⚡ 一键应用全部替换（' + nRep + ' 条）</button></div>'
      : '') +
  '</div>';
}
async function rwApplyOne(regionId){
  const evals = (rwMeta && rwMeta.evaluation) || {};
  const v = (evals.verdicts || []).find(x => x.region === regionId && x.verdict === 'replace');
  if (!v) return;
  const ok = await confirmDanger('🔁 应用负责人替换', v.region + ' 区域：' + v.agent + ' → ' + v.suggested + '。下次洗稿该区域将由新负责人补写。确定？', '应用替换');
  if (!ok) return;
  const d = await post('/api/rewrite/apply', { replacements: [{ region: v.region, from: v.agent, to: v.suggested, reason: v.reason }] });
  if (!d.ok) { showToast('⚠ ' + (d.error || '应用失败')); return; }
  showToast('✅ 已应用：' + v.region + ' 改由 ' + v.suggested + ' 负责');
  loadRewrite();
}
async function rwApplyAll(){
  const evals = (rwMeta && rwMeta.evaluation) || {};
  const reps = (evals.verdicts || []).filter(v => v.verdict === 'replace' && !v.applied);
  if (!reps.length) { showToast('没有待应用的替换'); return; }
  const ok = await confirmDanger('⚡ 一键应用全部替换', '共 ' + reps.length + ' 条负责人替换（' + reps.map(v => v.region + ': ' + v.agent + '→' + v.suggested).join('、') + '）。确定？', '全部应用');
  if (!ok) return;
  const d = await post('/api/rewrite/apply', { replacements: reps.map(v => ({ region: v.region, from: v.agent, to: v.suggested, reason: v.reason })) });
  if (!d.ok) { showToast('⚠ ' + (d.error || '应用失败')); return; }
  showToast('✅ 已应用 ' + reps.length + ' 条负责人替换');
  loadRewrite();
}

/* ---------- 复制成品全文 ---------- */
function copyText(text){
  if (!text) { showToast('没有可复制的内容'); return false; }
  // 桌面 webview 的 clipboard API 可能受限，用 textarea 兜底
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  let ok = false;
  try { ok = document.execCommand('copy'); } catch(_) {}
  document.body.removeChild(ta);
  if (navigator.clipboard && navigator.clipboard.writeText) { try { navigator.clipboard.writeText(text).catch(()=>{}); ok = true; } catch(_) {} }
  return ok;
}
function copyFullText(rid){
  const regions = (rwMeta && rwMeta.regions) || [];
  fetch('/api/rewrite/' + rid).then(r => r.json()).then(d => {
    if (!d.ok || !d.session) { showToast('⚠ 加载失败'); return; }
    const parts2 = d.session.parts || {};
    const lines = regions.map(r => {
      const p = parts2[r.id];
      return p && p.text ? '【' + r.label + '】\n' + p.text : '';
    }).filter(Boolean);
    const full = lines.join('\n\n');
    if (copyText(full)) showToast('✅ 成品全文已复制（' + full.length + ' 字）');
    else showToast('⚠ 复制失败，请手动选择');
  }).catch(() => showToast('⚠ 复制失败'));
}
