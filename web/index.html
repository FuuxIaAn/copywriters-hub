async function newWorkFlow() {
  // done 二次确认：讨论进行中发起新讨论会中断当前现场
  if (busy) {
    const ok = await confirmDanger('当前讨论还在进行中', '发起新讨论会中断当前专家的发言，且当前进度不会保留。确定要新建文稿吗？', '仍要新建');
    if (!ok) return;
  }
  const f = await openModal({
    title: '新建口播文稿',
    sub: '先给作品起个名字（可留空自动取名），再贴入初稿 → 专家团队开始实时讨论',
    fields: [
      { name:'title', label:'作品标题（可选）', type:'text', placeholder:'例如：2026-08 八字看桃花' },
      { name:'script', label:'口播初稿', type:'textarea', rows:8, placeholder:'粘贴你的口播文稿…' },
    ],
    okText: '开始讨论'
  });
  if (!f || !f.script) { if (f) showToast('请贴入文稿内容'); return; }
  const d = await post('/api/start', { script:f.script, title:f.title });

  bindSession(d.sid, d.work_id, d.work_title);
  switchView('chat');
  startDiscussionLocal(f.script);
}

function bindSession(sid, workId, workTitle) {
  currentSid = sid;
  currentWorkId = workId || null;
  if (workTitle) currentWorkTitle = workTitle;
  if (currentWorkId && !workTitle) {
    fetch('/api/works/' + currentWorkId).then(r=>r.json()).then(d => {
      if (d.ok) { currentWorkTitle = d.work.title; refreshChatWorkChip(); }
    }).catch(()=>{});
  }
  try { localStorage.setItem('wb_sid', sid); localStorage.setItem('wb_work_id', currentWorkId||''); } catch(_){}
  refreshChatWorkChip();
}
function refreshChatWorkChip() {
  const el = $('chatWork');

function extractRewrites(text){
  const rewrites=[];
  const blocks=text.split(/(?=【(?:原文|段落定位)】)/);
  blocks.forEach(block=>{
    const om=block.match(/【(?:原文|段落定位)】\s*([\s\S]*?)(?=【改写】|$)/);
    const rm=block.match(/【改写】\s*([\s\S]*?)(?=【理由】|$)/);
    if(om && rm){
      let original=om[1].trim();
      let rewritten=rm[1].trim();
      // 去掉下一个标签残余
      rewritten=rewritten.split(/【/)[0].trim();
      rewrites.push({original, rewritten});
    }
  });
  return rewrites;
}
function attachParagraphAdopt(node, m){
  const inner=node.querySelector('.inner'); if(!inner) return;
  const rewrites=extractRewrites(inner.textContent || '');
  if(!rewrites.length) return;
  const wrap=document.createElement('div');
  wrap.className='para-adopt-wrap';
  wrap.innerHTML='<div class="para-adopt-hd"><span class="ico" style="width:13px;height:13px"><svg><use href="#ic-scissors"/></svg></span> 段落级改写建议 · 点击采纳后会进入合并编辑器</div>';
  rewrites.forEach((rw,i)=>{

async function adoptPara(original, rewritten, agentName){
  if(!currentSid){ showToast('会话未就绪'); return; }
  showToast('已采纳本段改写，正在生成合并预览...');
  try{
    const r=await post('/api/adopt_para',{sid:currentSid, original:original, rewritten:rewritten, agent_name:agentName});
    if(r.ok){
      updateMergePanel(r.preview, r.merges);

    }

}

/* ---------- 逐段对照 diff ---------- */
function splitSentences(t){
  return (t||'').split(/(?<=[。！？!?；;\n])/).map(s=>s.trim()).filter(Boolean);
}
function sim(a, b){
  // 字符级 Jaccard 相似度
  if (a===b) return 1;
  const sa=new Set(a), sb=new Set(b);
  if (!sa.size || !sb.size) return 0;
  let inter=0;
  sa.forEach(c=>{ if (sb.has(c)) inter++; });
  return inter / (sa.size + sb.size - inter);
}
function diffHtml(orig, fin){
  // 逐句贪心 diff：返回 HTML，删除句划线红、新增句绿底、相同句原色
  const A = splitSentences(orig), B = splitSentences(fin);
  const escS = s => esc(s).replace(/\n/g,'<br>');
  let i=0, j=0, out='';
  while (i < A.length || j < B.length){
    if (i < A.length && j < B.length && sim(A[i], B[j]) >= 0.55){
      out += '<div class="df-same">' + escS(A[i]) + '</div>';
      i++; j++;
    } else if (j < B.length && (i >= A.length || !A.slice(i, i+2).some(x=>sim(x, B[j]) >= 0.55))){
      out += '<div class="df-add">' + escS(B[j]) + '</div>';
      j++;
    } else if (i < A.length){
      out += '<div class="df-del">' + escS(A[i]) + '</div>';
      i++;
    }
  }
  return out || '<div class="muted">（无内容可对比）</div>';
}

async function handle(m){
  if (m.seq && renderedSeqs.has(m.seq)) return;
  if (m.seq) renderedSeqs.add(m.seq);
  if (m.type==='system'){ addSys(m.text); return; }
  if (m.type==='error'){ addSys('⚠ '+m.text); setBusy(false); return; }
  if (m.type==='script'){ addScriptCard(m.text); return; }
  if (m.type==='typing'){ showTyping(m); return; }
  if (m.type==='message'||m.type==='final'){
    removeTyping();
    const node = m.type==='final' ? finalNode({...m,time:nowTime()}) : bubbleNode({...m,time:nowTime()},'msg');
    node._msg = m;
    chat.appendChild(node); scrollBottom();
    await sleep(700 + Math.random()*600);
    await reveal(node.querySelector('.inner'), m.html || esc(m.text));
    if (m.type==='message'||m.type==='final') attachParagraphAdopt(node, m);
    if (doneHandled) attachAdopt(node);
    scrollBottom();
    return;
  }
  if (m.type==='review'||m.type==='score'||m.type==='learn'||m.type==='retention'){
    removeTyping();
    let node;
    if (m.type==='review') node = reviewNode({...m,time:nowTime()});
    else if (m.type==='score') node = scoreNode({...m,time:nowTime()});
    else if (m.type==='retention') node = retentionNode({...m,time:nowTime()});
    else node = learnNode({...m,time:nowTime()});
    chat.appendChild(node); scrollBottom();
    await sleep(350);
    await reveal(node.querySelector('.inner'), m.html || esc(m.text || m.reason || ''));
    scrollBottom();
    return;
  }
  if (m.type==='score_roast'){
    removeTyping();
    const node = scoreRoastNode({...m,time:nowTime()});
    chat.appendChild(node); scrollBottom();
    await sleep(350);
    await reveal(node.querySelector('.inner'), m.html || esc(m.text || ''));
    scrollBottom();
    return;
  }
  if (m.type==='debate'){
    removeTyping();
    const node = debateNode({...m,time:nowTime()});
    chat.appendChild(node); scrollBottom();
    await sleep(350);
    await reveal(node.querySelector('.inner'), m.html || esc(m.text || ''));
    scrollBottom();
    return;
  }
  if (m.type==='principle_review'){
    removeTyping();
    const node = principleReviewNode({...m,time:nowTime()});
    chat.appendChild(node); scrollBottom();
    await sleep(350);
    await reveal(node.querySelector('.inner'), m.html || esc(m.text || ''));
    scrollBottom();
    return;
  }
  if (m.type==='learn_done'){ ignoreDone=false; addSys('爆款学习完成 · 各专家吸收结果见上方卡片'); setBusy(false); if(es){es.close();es=null;} return; }
  if (m.type==='review_done'){ ignoreDone=false; addSys('复盘分析完成 · 结论见上方卡片'); setBusy(false); if(es){es.close();es=null;} return; }
  if (m.type==='retention_done'){ ignoreDone=false; addSys('📉 留存分析完成 · 句子级诊断见上方卡片'); setBusy(false); if(es){es.close();es=null;} return; }
  if (m.type==='debate_done'){ ignoreDone=false; addSys('🔔 黑榜讨论完成 · 已提炼原则性建议，下次专家产出前会过一遍'); setBusy(false); if(es){es.close();es=null;} return; }
  if (m.type==='teardown_done'){ ignoreDone=false; addSys('🧨 爆款拆解完成 · 已提炼原则性建议并让各专家吸收知识点'); setBusy(false); if(es){es.close();es=null;} return; }
  if (m.type==='score_done'){ ignoreDone=false; addSys('评分完成 · 各专家分数见上方卡片'); setBusy(false); if(es){es.close();es=null;} return; }
  if (m.type==='comment_done'){ addSys('💬 评论迭代完成 · 专家已根据你的反馈修改建议'); setBusy(false); if(es){es.close();es=null;} attachAdoptToAll(); if(document.querySelector('.heatmap-overlay')) showHeatmap(); return; }
  if (m.type==='done'){
    if (ignoreDone) return;
    doneHandled = true;
    addSys('讨论结束 · 各专家段落级改写建议见上方卡片');
    renderDoneActions();
    scrollBottom();
    setBusy(false);
    attachAdoptToAll();
    if (es){ es.close(); es=null; }
  }
}

function attachAdopt(node){
  if (!node || !node._msg || node._adoptIcon) return;
  const m = node._msg;
  if (m.name===RECORDER_NAME || m.type==='review') return;
  const who = node.querySelector('.who');
  if (!who) return;
  const icon = document.createElement('button');
  icon.className='adopt-icon'; icon.title='采纳这条观点'; icon.innerHTML='<span class="ico" style="width:14px;height:14px"><svg><use href="#ic-thumb"/></svg></span>';
  icon.addEventListener('click', e=>{ e.stopPropagation(); doAdopt(icon, m); });
  who.appendChild(icon);
  node._adoptIcon = icon;
  node.addEventListener('click', ()=>{ if (adoptMode && !icon.classList.contains('adopted')) doAdopt(icon, m); });
  // 评论按钮
  if (m.name && m.name !== RECORDER_NAME){
    const cmt = document.createElement('button');
    cmt.className='adopt-icon'; cmt.title='评论/反驳这条建议，专家会据此修改'; cmt.innerHTML='<span class="ico" style="width:14px;height:14px"><svg><use href="#ic-comment"/></svg></span>';
    cmt.style.marginLeft='2px';
    cmt.addEventListener('click', e=>{ e.stopPropagation(); openComment(m); });
    who.appendChild(cmt);
    node._cmtIcon = cmt;
  }
}

      {name:'avgRatio', label:'平均播放占比（%）', type:'text', placeholder:'例如 55', value:pf('平均播放占比')},

      {name:'plays', label:'播放量', type:'text', placeholder:'例如 12000', value:pf('播放量','plays')}
    ],

  });
  if (!f || !f.subtitle || !f.subtitle.trim()) return;

  for (const k in map){ if (f[k] && f[k].trim()) metrics[map[k]] = f[k].trim(); }
  addSys('📉 留存分析请求已发送 · 阿数正在逐句对照留存曲线做数据判级与句子归因');
  setBusy(true);

/* ---------- 静态渲染（刷新恢复） ---------- */
function renderStatic(m){
  if (m.type==='system'){ addSys(m.text); return; }
  if (m.type==='script'){ addScriptCard(m.text); return; }
  if (m.type==='error'){ addSys('⚠ '+m.text); setBusy(false); return; }
  if (m.type==='message'||m.type==='final'){
    const node = m.type==='final' ? finalNode({...m,time:m.time||nowTime()}) : bubbleNode({...m,time:m.time||nowTime()},'msg');
    node._msg = m; chat.appendChild(node);
    node.querySelector('.inner').innerHTML = m.html || esc(m.text||'');
    attachParagraphAdopt(node, m);
    scrollBottom(); return;
  }
  if (m.type==='review'||m.type==='score'||m.type==='learn'||m.type==='retention'){
    const node = m.type==='review' ? reviewNode({...m,time:m.time||nowTime()}) : m.type==='score' ? scoreNode({...m,time:m.time||nowTime()}) : m.type==='retention' ? retentionNode({...m,time:m.time||nowTime()}) : learnNode({...m,time:m.time||nowTime()});
    chat.appendChild(node);
    node.querySelector('.inner').innerHTML = m.html || esc(m.text||m.reason||'');
    scrollBottom(); return;
  }
  if (m.type==='score_roast'){
    const node = scoreRoastNode({...m,time:m.time||nowTime()});
    chat.appendChild(node);
    node.querySelector('.inner').innerHTML = m.html || esc(m.text||'');
    scrollBottom(); return;
  }
  if (m.type==='debate'){
    const node = debateNode({...m,time:m.time||nowTime()});
    chat.appendChild(node);
    node.querySelector('.inner').innerHTML = m.html || esc(m.text||'');
    scrollBottom(); return;
  }
  if (m.type==='principle_review'){
    const node = principleReviewNode({...m,time:m.time||nowTime()});
    chat.appendChild(node);
    node.querySelector('.inner').innerHTML = m.html || esc(m.text||'');
    scrollBottom(); return;
  }
  if (m.type==='done'){ doneHandled=true; addSys('讨论结束 · 各专家段落级改写建议见上方卡片'); renderDoneActions(); scrollBottom(); setBusy(false); attachAdoptToAll(); return; }
  if (m.type==='learn_done'){ addSys('爆款学习完成'); setBusy(false); return; }
  if (m.type==='review_done'){ addSys('复盘分析完成'); setBusy(false); return; }
  if (m.type==='retention_done'){ addSys('📉 留存分析完成'); setBusy(false); return; }
  if (m.type==='debate_done'){ addSys('🔔 黑榜讨论完成'); setBusy(false); return; }
  if (m.type==='teardown_done'){ addSys('🧨 爆款拆解完成'); setBusy(false); return; }
  if (m.type==='score_done'){ addSys('评分完成'); setBusy(false); return; }
  if (m.type==='comment_done'){ addSys('💬 评论迭代完成'); setBusy(false); return; }
}

let heatmapData = null;
let heatmapSelectedIdx = -1;

function renderHeatmap(data){
  const old=document.querySelector('.heatmap-overlay'); if(old) old.remove();
  heatmapData = data;
  heatmapSelectedIdx = -1;
  const segs = data.segments || [];
  const maxM = Math.max(1, ...segs.map(s=>s.mentions));

  // 左侧：原稿热力标注
  const annotated = segs.map((s,i)=>{
    const lvl = s.mentions===0 ? 0 : Math.min(5, Math.ceil(s.mentions / maxM * 5));
    const badge = s.mentions>0 ? '<span class="hm-badge">'+s.mentions+'</span>' : '';
    return '<span class="hm-seg lvl'+lvl+'" data-idx="'+i+'">'+esc(s.text)+badge+'</span>';
  }).join('');

  // 右侧：默认空或选第一条有争议的
  const firstHot = segs.findIndex(s=>s.mentions>0);

  // 底部 mini 排行
  const hotspots = (data.hotspots||[]).slice(0,8);
  const rankingHtml = hotspots.length ? hotspots.map((h,i)=>{
    const colors=['#ffd60a','#ff9f0a','#ff9500','#ff6b22','#ff453a','#e02d2d','#c71e1e','#a80f0f'];
    return '<div class="r-item" data-idx="'+(h.index != null ? h.index : segs.indexOf(h))+'">'+
      '<span class="r-no" style="background:'+(colors[i]||'#999')+'">'+(i+1)+'</span>'+
      '<span class="r-text" title="'+esc(h.text)+'">'+esc(h.text)+'</span>'+
      '<span class="r-meta">'+h.mentions+'人</span></div>';
  }).join('') : '<div style="color:var(--c-text-mute);font-size:12px;padding:8px 0">暂无争议数据</div>';

  const overlay = document.createElement('div');
  overlay.className='heatmap-overlay';
  overlay.innerHTML =
    '<div class="heatmap-box">'+
      '<div class="heatmap-head"><h3><span class="ico" style="width:16px;height:16px;color:#ff9500"><svg><use href="#ic-fire"/></svg></span> 争议热力 · 句子级决议中心</h3>'+
        '<span style="font-size:12px;color:var(--c-text-sub)">'+(data.total_refs||0)+' 处改写建议 · '+(data.total_segments||0)+' 个句子</span>'+
        '<div class="spacer"></div>'+
        '<button class="score-btn" id="hmScoreBtn"><span class="ico" style="width:13px;height:13px"><svg><use href="#ic-star"/></svg></span> 终稿评分</button>'+
        '<button class="close" id="hmCloseBtn"><span class="ico"><svg><use href="#ic-x"/></svg></span></button></div>'+
      '<div class="heatmap-body">'+
        '<div class="hm-left">'+
          '<div class="heatmap-legend">'+
            '<span><span class="swatch" style="background:#ffd60a"></span>1人</span>'+
            '<span><span class="swatch" style="background:#ff9f0a"></span>2-3人</span>'+
            '<span><span class="swatch" style="background:#ff453a"></span>4-5人</span>'+
            '<span><span class="swatch" style="background:#c71e1e"></span>6+人</span>'+
            '<span style="margin-left:auto;color:var(--c-text-mute)">点击句子查看专家建议</span>'+
          '</div>'+
          '<div class="hm-script">'+annotated+'</div>'+
          '<div class="hm-ranking-mini"><h4>争议排行 TOP'+hotspots.length+'</h4>'+rankingHtml+'</div>'+
        '</div>'+
        '<div class="hm-right" id="hmRight">'+renderHeatmapRightEmpty()+'</div>'+
      '</div>'+
    '</div>';
  overlay.addEventListener('click', e=>{ if(e.target===overlay) overlay.remove(); });
  document.body.appendChild(overlay);

  // 事件绑定
  overlay.querySelectorAll('.hm-seg').forEach(el=>{
    el.addEventListener('click', ()=>{
      const idx = parseInt(el.dataset.idx,10);
      selectHeatmapSegment(idx);
    });
  });
  overlay.querySelectorAll('.hm-ranking-mini .r-item').forEach(el=>{
    el.addEventListener('click', ()=>{
      const idx = parseInt(el.dataset.idx,10);
      selectHeatmapSegment(idx);
    });
  });
  $('hmCloseBtn').addEventListener('click', ()=>overlay.remove());
  $('hmScoreBtn').addEventListener('click', scoreFromHeatmap);

  if (firstHot>=0) selectHeatmapSegment(firstHot);
}

function renderHeatmapRightEmpty(){
  return '<div class="hm-empty">点击左侧原稿中的任意句子<br>查看专家建议、采纳改写、发表评论或手动编辑</div>';
}

function selectHeatmapSegment(idx){
  if (!heatmapData) return;
  const segs = heatmapData.segments || [];
  const seg = segs[idx]; if (!seg) return;
  heatmapSelectedIdx = idx;
  document.querySelectorAll('.hm-seg.active').forEach(el=>el.classList.remove('active'));
  const active = document.querySelector('.hm-seg[data-idx="'+idx+'"]');
  if (active){ active.classList.add('active'); active.scrollIntoView({behavior:'smooth', block:'nearest'}); }
  $('hmRight').innerHTML = renderHeatmapRight(seg);
  bindHeatmapRightEvents(seg);
}

function renderHeatmapRight(seg){
  const suggestions = seg.suggestions || [];
  const sugHtml = suggestions.length ? suggestions.map((s,i)=>{
    const color = colorOf(s.agent) || '#999';
    return '<div class="hm-sug" data-sug-idx="'+i+'">'+
      '<div class="hm-sug-head"><span class="avatar" style="background:'+color+'">'+esc(s.agent[0])+'</span><span class="name">'+esc(s.agent)+'</span><span class="title">'+esc(titleOf(s.agent))+'</span></div>'+
      '<div class="hm-sug-row"><b>改写：</b>'+esc(s.rewritten)+'</div>'+
      '<div class="hm-sug-row"><b>理由：</b>'+esc(s.reason||'（未说明）')+'</div>'+
      '<div class="hm-sug-actions">'+
        '<button class="hm-adopt" data-act="adopt"><span class="ico" style="width:13px;height:13px"><svg><use href="#ic-thumb"/></svg></span> 采纳</button>'+
        '<button class="hm-comment" data-act="comment"><span class="ico" style="width:13px;height:13px"><svg><use href="#ic-comment"/></svg></span> 评论</button>'+
      '</div>'+
    '</div>';
  }).join('') : '<div style="color:var(--c-text-mute);font-size:13px;padding:10px 0">该句子暂无人给出改写建议。</div>';

  return '<div class="hm-panel">'+
    '<div class="hm-sec-title"><span class="ico" style="width:13px;height:13px"><svg><use href="#ic-pin"/></svg></span> 当前句子 <span class="hm-hint">可直接编辑</span></div>'+
    '<textarea class="hm-current" id="hmCurrentText">'+esc(seg.text)+'</textarea>'+
    '<div class="hm-actions">'+
      '<button class="hm-save" id="hmSaveBtn">保存为终稿</button>'+
      '<button class="hm-reset" id="hmResetBtn">恢复原文</button>'+
    '</div>'+
    '<div class="hm-sec-title">专家建议 ('+suggestions.length+')'+
      '<button class="hm-comment-all" id="hmCommentAllBtn"><span class="ico" style="width:13px;height:13px"><svg><use href="#ic-comment"/></svg></span> 都不满意？评论所有专家</button>'+
    '</div>'+
    sugHtml+
  '</div>';
}

function bindHeatmapRightEvents(seg){
  const textarea = $('hmCurrentText');
  $('hmResetBtn').addEventListener('click', ()=>{ textarea.value = seg.text; showToast('已恢复原文'); });
  $('hmSaveBtn').addEventListener('click', ()=> saveHeatmapEdit(seg.text, textarea.value.trim()));

  const commentAllBtn = $('hmCommentAllBtn');
  if (commentAllBtn) commentAllBtn.addEventListener('click', ()=> commentAllFromHeatmap(seg.text));

  document.querySelectorAll('.hm-sug').forEach(card=>{
    const i = parseInt(card.dataset.sugIdx,10);
    const s = (seg.suggestions||[])[i]; if (!s) return;
    card.querySelector('[data-act=adopt]').addEventListener('click', ()=>{
      $('hmCurrentText').value = s.rewritten;
      adoptFromHeatmap(seg.text, s.rewritten, s.agent);
    });
    card.querySelector('[data-act=comment]').addEventListener('click', ()=>{
      commentFromHeatmap(s.agent, seg.text, s.rewritten, s.reason);
    });
  });
}

async function saveHeatmapEdit(original, edited){
  if (!currentSid){ showToast('会话未就绪'); return; }
  if (!edited){ showToast('编辑内容不能为空'); return; }
  try{
    // 先移除同一原文的旧采纳（如果有）
    const previewRes = await post('/api/merge_preview', {sid:currentSid});
    const merges = (previewRes.ok && previewRes.merges) ? previewRes.merges : [];
    const oldIdx = merges.findIndex(m => (m.original||'').trim() === original.trim());
    if (oldIdx >= 0){
      const rm = await post('/api/merge_remove', {sid:currentSid, idx:oldIdx});
      if (rm.ok) updateMergePanel(rm.preview, rm.merges);
    }
    // 再保存用户编辑
    const r = await post('/api/adopt_para', {sid:currentSid, original, rewritten:edited, agent_name:'我'});
    if (r.ok){
      updateMergePanel(r.preview, r.merges);
      showToast('已保存你的编辑');
    } else showToast(r.error||'保存失败');
  }catch(e){ showToast('保存失败：'+e); }
}

let worksFilter = 'all';
const worksSelected = new Set();
async function loadWorks(){
  const v=$('view-works');
  v.innerHTML = skelList(3);
  try{
    const d = await fetch('/api/works').then(r=>r.json());
    if (!d.ok) throw new Error(d.error||'加载失败');
    const all = d.works||[];
    const counts = {};
    all.forEach(w=>{ counts[w.status] = (counts[w.status]||0)+1; });
    const chips = ['all','draft','discussing','to_adopt','published','reviewed','archived']
      .map(s => {
        const n = s==='all' ? all.length : (counts[s]||0);
        return '<button class="chip' + (worksFilter===s?' active':'') + '" data-f="' + s + '">' + (s==='all'?'全部':(STATUS_LABELS[s]||s)) + '<span class="chip-n">' + n + '</span></button>';
      }).join('');
    const list = worksFilter==='all' ? all : all.filter(w=>w.status===worksFilter);
    // 清理已删除作品的勾选
    const validIds = new Set(all.map(w=>w.id));
    [...worksSelected].forEach(id=>{ if (!validIds.has(id)) worksSelected.delete(id); });
    if (!list.length) worksSelected.clear();
    const selCount = worksSelected.size;
    const WORK_PAGE = 24;   // 虚拟列表：初始渲染数量，滚动到底继续追加
    const emptyHtml =
      (worksFilter==='all'
        ? emptyState('📝','还没有作品','开始你的第一篇口播创作，让专家团队帮你打磨成爆款。',
            '<button onclick="newWorkFlow()"><span class="ico" style="width:13px;height:13px"><svg><use href="#ic-plus"/></svg></span> 新建文稿</button><button class="ghost" onclick="switchView(\'rewrite\')"><span class="ico" style="width:13px;height:13px"><svg><use href="#ic-scissors"/></svg></span> 去洗稿工坊</button>')
        : emptyState('🗂️','该状态下没有作品','切换上方的状态筛选，或去创作一篇新文稿。',
            '<button class="ghost" onclick="switchView(\'chat\')"><span class="ico" style="width:13px;height:13px"><svg><use href="#ic-chat"/></svg></span> 去专家群聊</button>'));
    const cards = list.length ? list.slice(0, WORK_PAGE).map(w=>workCard(w)).join('') : emptyHtml;
    v.innerHTML =
      '<div class="chips" id="workChips">' + chips + '</div>' +
      '<div class="works-toolbar">' +
        '<label class="work-check-all"><input type="checkbox" id="workCheckAll"' + (list.length && selCount===list.length ? ' checked' : '') + '> 全选</label>' +
        '<span class="sel-info" id="selInfo">' + (selCount ? '已选 ' + selCount + ' 个作品' : '勾选作品可批量操作') + '</span>' +
        (selCount ? '<button class="batch-btn" id="btnBatchArchive"><span class="ico" style="width:13px;height:13px"><svg><use href="#ic-archive"/></svg></span> 批量归档</button>' : '') +
        '<button class="batch-btn" id="btnExportWorks" title="导出全部作品"><span class="ico" style="width:13px;height:13px"><svg><use href="#ic-download"/></svg></span> 导出</button>' +
      '</div>' +
      '<div class="work-grid" id="workGrid">' + cards + '</div>' +
      (list.length > WORK_PAGE ? '<div class="work-sentinel" id="workSentinel"></div>' : '');
    // 虚拟列表：滚动到底部继续渲染剩余卡片（只渲染可视区，避免全量渲染卡顿）
    let renderedCount = Math.min(WORK_PAGE, list.length);
    const grid = $('workGrid');
    const sentinel = $('workSentinel');
    if (sentinel && grid){
      const io = new IntersectionObserver(entries=>{
        if (!entries[0].isIntersecting) return;
        const next = list.slice(renderedCount, renderedCount + WORK_PAGE);
        if (!next.length){ io.disconnect(); sentinel.remove(); return; }
        renderedCount += next.length;
        grid.insertAdjacentHTML('beforeend', next.map(w=>workCard(w)).join(''));
        bindWorkCards(grid);
        if (renderedCount >= list.length){ io.disconnect(); sentinel.remove(); }
      }, { rootMargin:'300px' });
      io.observe(sentinel);
    }
    bindWorkCards(grid);
    const checkAll = $('workCheckAll');
    if (checkAll) checkAll.addEventListener('change', ()=>{
      if (checkAll.checked) list.forEach(w=>worksSelected.add(w.id));
      else list.forEach(w=>worksSelected.delete(w.id));
      loadWorks();
    });
    const btnBatch = $('btnBatchArchive');
    if (btnBatch) btnBatch.addEventListener('click', async ()=>{
      if (!worksSelected.size) return;
      const ok = await confirmDanger('批量归档', '将把选中的 ' + worksSelected.size + ' 个作品归档（可随时恢复），确定吗？', '批量归档');
      if (!ok) return;
      const r = await post('/api/works/batch', { action:'archive', ids:[...worksSelected] });
      showToast(r.ok ? '已归档 ' + r.done + ' 个作品' : ('⚠ ' + (r.error||'失败')));
      if (r.ok){ worksSelected.clear(); loadWorks(); }
    });
    const btnExportWorks = $('btnExportWorks');
    if (btnExportWorks) btnExportWorks.addEventListener('click', async ()=>{
      const fmt = await confirmSelect('导出作品库', '选择导出格式', [{label:'Markdown 报告', value:'md'}, {label:'JSON 原始数据', value:'json'}]);
      if (!fmt) return;
      const r = await post('/api/export/works', {format: fmt});
      if (r.ok) downloadText(r.filename, r.content, fmt==='json'?'application/json':'text/markdown');
      else showToast('⚠ ' + (r.error||'导出失败'));
    });
    v.querySelectorAll('.chip').forEach(c=>c.addEventListener('click', ()=>{ worksFilter=c.dataset.f; loadWorks(); }));
  }catch(e){ v.innerHTML='<div class="empty">作品库加载失败：'+esc(e.message)+'</div>'; }
}
function bindWorkCards(container){
  if (!container) return;
  container.querySelectorAll('.work-card').forEach(c=>c.addEventListener('click', e=>{
    if (e.target.closest('.wsel') || e.target.closest('button')) return;
    openWorkDetail(c.dataset.wid);
  }));
  container.querySelectorAll('.wsel input').forEach(cb=>cb.addEventListener('change', ()=>{
    const wid = cb.dataset.wid;
    if (cb.checked) worksSelected.add(wid); else worksSelected.delete(wid);
    loadWorks();
  }));
  container.querySelectorAll('[data-act]').forEach(b=>b.addEventListener('click', async e=>{
    e.stopPropagation();
    const wid=b.dataset.wid, act=b.dataset.act;
    if (act==='discuss'){ continueDiscussion(wid); }
    else if (act==='rediscuss'){ rediscuss(wid); }
    else if (act==='data'){ enterMetrics(wid); }
    else if (act==='archive'){ archiveWork(wid); }
    else if (act==='restore'){ restoreWork(wid); }
    else if (act==='delete'){ deleteWork(wid); }
  }));
}
function workCard(w){
  const m=w.metrics||{};
  const meta = [
    m.plays!=null?'播放 <b>'+fmtNum(m.plays)+'</b>':'',
    m.completion!=null?'完播 <b>'+m.completion+'%</b>':'',
    (w.adoptions||[]).length?'采纳 <b>'+(w.adoptions||[]).filter(a=>!a.revoked).length+'</b>':'',
    (w.scores&&w.scores.length)?'评分 <b>'+avgScore(w.scores)+'</b>':''
  ].filter(Boolean).join('　') || '尚无效果数据';
  const acts = '<button class="go" data-act="discuss" data-wid="'+w.id+'" title="恢复上次讨论现场">继续讨论</button>' +
    '<button data-act="rediscuss" data-wid="'+w.id+'" title="用当前作品初稿重新发起一轮完整讨论">重新讨论</button>' +
    (w.status!=='archived' ? '<button data-act="data" data-wid="'+w.id+'">录入数据</button><button data-act="archive" data-wid="'+w.id+'">归档</button>'
                            : '<button data-act="restore" data-wid="'+w.id+'">恢复</button>') +
    '<button class="danger" data-act="delete" data-wid="'+w.id+'" title="永久删除这个作品">删除</button>';
  return '<div class="work-card" data-wid="'+w.id+'">' +
    '<div class="wsel"><input type="checkbox" data-wid="'+w.id+'"' + (worksSelected.has(w.id)?' checked':'') + '><span class="cb-lbl">选择</span></div>' +
    '<div class="wtop"><span class="wtitle">'+esc(w.title||'未命名')+'</span><span class="badge-st st-'+esc(w.status)+'">'+esc(STATUS_LABELS[w.status]||w.status)+'</span></div>' +
    '<div class="wsum">'+esc((w.final||w.draft||'').slice(0,90))+'…</div>' +
    '<div class="wmeta">'+meta+'</div>' +
    '<div class="wmeta muted">'+esc((w.created_at||'').slice(0,16))+'</div>' +
    '<div class="wacts">'+acts+'</div></div>';
}
function avgScore(scores){
  if (!scores || !scores.length) return '—';
  const last = scores[scores.length-1]?.scores || [];
  const vals = last.map(s=>s.score).filter(s=>s!=null);
  if (!vals.length) return '—';
  return (vals.reduce((a,b)=>a+b,0)/vals.length).toFixed(1);
}
async function continueDiscussion(wid){
  // 「继续讨论」= 恢复上次讨论现场（只看/接着操作），绝不重新跑一遍讨论
  let work = null;
  try{ const d = await fetch('/api/works/'+wid).then(r=>r.json()); if (d.ok) work = d.work; }catch(_){}
  const sid = work && work.session_id;
  if (sid){
    try{
      const sd = await fetch('/api/session/'+sid).then(r=>r.json());
      if (sd.ok){
        await restoreSession(sd);
        switchView('chat');
        return;
      }
    }catch(_){}
  }
  // 没有可恢复的讨论记录：提示改用「重新讨论」（不会自动重跑）
  showToast('⚠ 这个作品还没有可恢复的讨论记录，请点「重新讨论」发起新一轮');
}
async function rediscuss(wid){
  // 「重新讨论」= 用当前作品已保存的初稿重新发起一轮完整讨论（初稿已自动带上，无需再输入）
  let work = null;
  try{ const d = await fetch('/api/works/'+wid).then(r=>r.json()); if (d.ok) work = d.work; }catch(_){}
  const prefill = work ? ((work.draft || work.final || '').trim()) : '';
  if (!prefill){ showToast('⚠ 这个作品没有初稿内容，无法重新讨论'); return; }
  const ok = await openModal({
    title:'重新讨论',
    sub:'将用当前作品已保存的初稿重新发起一轮完整讨论（生成新的讨论记录，旧记录仍会保留在本地）。',
    fields:[], okText:'重新讨论'
  });
  if (!ok) return;
  const d = await post('/api/start', { script:prefill, work_id:wid, title:'' });
  if (!d.ok){ showToast('⚠ '+(d.error||'失败')); return; }
  bindSession(d.sid, d.work_id, d.work_title);
  switchView('chat');
  startDiscussionLocal(prefill);
}
async function restoreSession(sd){
  // 恢复一个已存在的会话现场：清空聊天区、渲染历史、按需重连 SSE
  if (es){ try{ es.close(); }catch(_){ } es = null; }
  chat.innerHTML = '';
  renderedSeqs.clear();
  doneHandled = false; ignoreDone = false;
  resetMergePanel();
  currentSid = sd.sid || currentSid;
  if (sd.work_id){ currentWorkId = sd.work_id; }
  if (sd.members && sd.members.length){ members = sd.members; renderMembers(); }
  for (const m of (sd.history||[])){
    if (m.seq) renderedSeqs.add(m.seq);
    if (m.type === 'typing') continue;
    renderStatic(m);
  }
  refreshChatWorkChip();
  try{ localStorage.setItem('wb_sid', currentSid); localStorage.setItem('wb_work_id', currentWorkId||''); }catch(_){}
  if (sd.interrupted){
    addSys('⚠ 上次讨论进行中被中断（应用关闭），已恢复到此。可点「重新讨论」发起新一轮。');
  }
  // live=false（从磁盘重建）或已结束 → 只渲染历史，不重连 SSE；live=true 且未结束 → 继续直播
  if (sd.live && !sd.finished){
    setBusy(true);
    es = new EventSource('/api/stream/'+currentSid);
    es.onmessage = e=>{ let m; try{ m=JSON.parse(e.data); }catch(_){ return; } handle(m); };
    es.onerror = ()=>{};
  } else {
    setBusy(false);
    loadExistingMerges();
    if (!doneHandled){
      // 中断恢复（无 done 事件）时也补上动作入口，保证评分/复盘/留存等操作可用
      renderDoneActions();
      attachAdoptToAll();
    }
  }
}

      const metrics = {};

      if (!Object.keys(metrics).length) { showToast('⚠ 请至少填写一项指标'); return; }
      const okBtn = box.querySelector('[data-act=ok]');
      okBtn.disabled = true; okBtn.textContent = '保存中…';
      try {
        const d = await post('/api/manual_metrics', { wid, metrics });
        close();
        if (!d.ok) { showToast('⚠ ' + (d.error || '保存失败')); return; }
        showToast('✅ 已保存 ' + Object.keys(metrics).length + ' 项指标');
        loadWorks();
      } catch (e) {
        okBtn.disabled = false; okBtn.textContent = '保存';
        showToast('⚠ 保存失败: ' + e.message);
      }
    }
  });
}
async function pickFile(kind){
  // 桌面端：原生文件对话框（pywebview js_api）
  try {
    if (window.pywebview && window.pywebview.api && window.pywebview.api.pick_file) {
      const p = await window.pywebview.api.pick_file(kind);
      return p || null;
    }
  } catch (e) { console.warn('原生文件对话框失败', e); }
  // 浏览器降级：隐藏 <input type=file>（浏览器内只能拿到文件名，无法解析，故提示）
  return await new Promise(resolve => {
    const inp = document.createElement('input');
    inp.type = 'file';
    inp.accept = kind === 'txt' ? '.txt' : '.xlsx,.xls';
    inp.onchange = () => { resolve(inp.files[0] ? (inp.files[0].path || inp.files[0].name) : null); };
    inp.click();
  });
}

function fmtScore(s){ return (s===null||s===undefined) ? '未给分' : Number(s).toFixed(1); }

async function workQuickAction(action, w){
  // 从作品详情页直接发起：⭐ 评分 / 📊 复盘 / 📉 留存分析
  const sid = w.session_id;
  if (sid && sid !== currentSid){
    try{
      const sd = await fetch('/api/session/'+sid).then(r=>r.json());
      if (sd.ok){ await restoreSession(sd); }
    }catch(_){}
  }
  if (!currentSid){ showToast('⚠ 这个作品还没有讨论会话，请先点「继续讨论」或「重新讨论」'); return; }
  currentWorkId = w.id;
  currentWorkTitle = w.title || '';
  switchView('chat');
  if (action === 'score'){
    const f = await openModal({ title:'⭐ 终稿评分', sub:'把最终发布的口播终稿贴进来，专家团队会匿名打分并给理由', fields:[{name:'content', label:'终稿', type:'textarea', rows:6, placeholder: w.final || '贴入终稿内容…'}], okText:'发送' });
    if (f && f.content) startScore(f.content);
  } else if (action === 'review'){
    const f = await openModal({ title:'📊 效果复盘', sub:'贴实际数据：播放量、完播率、点赞、评论、转化、发布时间等', fields:[{name:'content', label:'数据', type:'textarea', rows:6, placeholder:'例如：播放量 12.5w，完播率 8.6%，点赞 3200…'}], okText:'发送' });
    if (f && f.content) startReview(f.content);
  } else if (action === 'retention'){
    await startRetention();
  }
}
function renderMetrics(m){
  const rows=[
    ['播放量',m.plays],['完播率',m.completion!=null?m.completion+'%':null],
    ['2秒跳出率',m['2秒跳出率']!=null?m['2秒跳出率']+'%':null],
    ['5秒完播率',m['5秒完播率']!=null?m['5秒完播率']+'%':null],
    ['平均播放时长',m['平均播放时长']!=null?m['平均播放时长']+'秒':null],
    ['平均播放占比',m['平均播放占比']!=null?m['平均播放占比']+'%':null],
    ['点赞',m.likes],['评论',m.comments],['分享',m.shares],['收藏',m.saves||m.saved],
    ['涨粉量',m.followers!=null?m.followers:null],['涨粉率',m.followers_rate!=null?m.followers_rate+'%':null]
  ];
  return rows.filter(r=>r[1]!=null).map(r=>r[0]+'：<b>'+r[1]+'</b>').join('　') || '（暂无数据）';
}

    {name:'cta_positions',label:'促动按钮位置',type:'text',value:t.cta_positions||'',placeholder:'结尾CTA+评论互动钩子'},
    {name:'variation_rules',label:'变奏规则',type:'text',value:t.variation_rules||'',placeholder:'什么情况怎么改'},

  ];

    let r;
    if(tid){
      r=await fetch('/api/skeletons/'+tid,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}).then(r=>r.json());

      r=await post('/api/skeletons',body);
    }

async function applyPendingAction(index, action){
  const r = await post('/api/principles/apply', { index, action });
  if (r.ok){
    showToast(action==='apply' ? (r.result==='removed'?'已废除旧原则':'已替换旧原则') : '已忽略');
  } else {
    showToast('⚠ '+(r.error||'操作失败'));
  }
  loadStats();
}
async function openPrincipleEditor(index=null, text='', kind='suggest'){
  const isEdit = index !== null;
  const res = await openModal({
    title: '原则修订',
    sub: isEdit ? '修改后会更新原则的日期' : '新增一条原则，保存后立即对所有专家生效',
    okText: '保存',
    fields: [
      {name:'text', label:'原则内容', type:'textarea', rows:4, value:text, placeholder:'例如：开头 3 秒必须给出明确痛点'},
      {name:'kind', label:'类型', type:'radio', value:kind, options:[{value:'suggest',label:'建议性'},{value:'forbid',label:'禁止性'}]}
    ]
  });
  if (!res) return;
  const k = (res.kind || 'suggest').trim();
  if (k !== 'suggest' && k !== 'forbid') { showToast('请选择类型'); return; }
  await savePrinciple(isEdit ? index : null, res.text, k);
}
async function savePrinciple(index, text, kind){
  if (!text || !text.trim()) { showToast('原则内容不能为空'); return; }
  let r;
  if (index === null) {
    r = await post('/api/insights/principles', {text, kind});
  } else {
    r = await fetch('/api/insights/principles/'+index, {method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify({text, kind})}).then(x=>x.json());
  }
  if (r.ok){ showToast(index===null?'已新增原则':'已保存'); loadStats(); }
  else showToast('⚠ '+(r.error||'保存失败'));
}
async function deletePrinciple(index){
  const p = currentPrinciples[index];
  if (!p) return;
  const ok = await confirmDanger('删除原则？', '确定删除：'+p.text.substring(0,60)+(p.text.length>60?'...':''), '删除');
  if (!ok) return;
  const r = await fetch('/api/insights/principles/'+index, {method:'DELETE'}).then(x=>x.json());
  if (r.ok){ showToast('已删除'); loadStats(); }
  else showToast('⚠ '+(r.error||'删除失败'));
}
function mdText(t){
  // 极简 markdown：加粗 + 换行
  return esc(t||'（暂无）').replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\n/g,'<br>');
}
async function pickWorkForSession(){
  // 有活跃会话直接用；没有则从作品库选一篇发起讨论，返回可用 sid
  if (currentSid) return currentSid;
  let ws = [];
  try {
    const d = await fetch('/api/works').then(r=>r.json());
    ws = (d.works || []).filter(w => w.draft);
  } catch(_){}
  if (!ws.length) { showToast('当前没有活跃会话，也没有可讨论的作品。请先新建文稿发起讨论'); switchView('chat'); return null; }
  const f = await openModal({
    title: '📁 选择要讨论的作品',
    sub: '当前没有活跃会话。从作品库选一篇作品，将用它的初稿发起新的讨论，再进行' + '后续操作。',
    fields: [{ name:'wid', label:'作品', type:'radio', options: ws.slice(0,8).map(w=>({label:w.title||w.id, value:w.id})), value: ws[0].id }],
    okText: '发起讨论并继续'
  });
  if (!f || !f.wid) return null;
  const w = ws.find(x=>x.id===f.wid);
  if (!w) return null;
  const r = await post('/api/start', { script:w.draft, title:w.title });
  if (!r.ok) { showToast('⚠ ' + (r.error||'发起讨论失败')); return null; }
  bindSession(r.sid, r.work_id, r.work_title);
  switchView('chat');
  startDiscussionLocal(w.draft);
  return r.sid;
}
async function leaderboardDebate(mode){
  const sid = await pickWorkForSession();
  if (!sid) return;
  const label = mode==='top' ? '榜单 top1（建议性原则）' : '榜单垫底（禁止性原则）';
  const ok = await confirmDanger('发起'+label+'讨论？','全员（专家+骨架师+数据专员）会讨论这些作品数据特别'+ (mode==='top'?'好':'差') +'的原因，投票后提炼成'+(mode==='top'?'建议性':'禁止性')+'原则。','开始讨论');
  if (!ok) return;
  addSys('📊 已发起'+label+'讨论，回到群聊查看…');
  switchView('chat');
  setBusy(true);
  post('/api/leaderboard_debate', { sid, mode }).then(d=>{
    if (!d.ok){ addSys('⚠ '+(d.error||'榜单讨论失败')); setBusy(false); return; }
    openStream();
  }).catch(err=>{ addSys('⚠ 榜单讨论失败: '+err.message); setBusy(false); });
}
async function principleReview(){
  const sid = await pickWorkForSession();
  if (!sid) return;
  const f = await openModal({
    title:'🔍 原则审视',
    sub:'哪篇文案打破了已有原则？（例如遵守了建议性原则却扑街、或违反了禁止性原则却爆了）贴入你的说明，全员会分析是原则错了还是别的原因，产出报告给你。',
    fields:[{name:'note', label:'打破原则的情况说明', type:'textarea', rows:5, placeholder:'例如：第3条建议说开头要抛钩子，但我照做了反而掉留存，是不是这条原则错了？'}],
    okText:'发起审视'
  });
  if (!f) return;
  addSys('🔍 已发起原则审视，回到群聊查看分析报告…');
  switchView('chat');
  setBusy(true);
  post('/api/principle_review', { sid, note:(f.note||'').trim() }).then(d=>{
    if (!d.ok){ addSys('⚠ '+(d.error||'原则审视失败')); setBusy(false); return; }
    openStream();
  }).catch(err=>{ addSys('⚠ 原则审视失败: '+err.message); setBusy(false); });
}

      '<div class="learn-tabs">'+tabs+'</div>'+panels+'</div>';
    $('learnTeardownBtn').addEventListener('click', ()=> startViralTeardown());
    $('learnManualBtn').addEventListener('click', openManualLesson);
    $('learnExportBtn').addEventListener('click', async ()=>{
      const d = await fetch('/api/export/lessons').then(r=>r.json()).catch(e=>({ok:false, error:'网络错误：'+e.message}));
      if (d.ok) downloadText(d.filename, d.content, 'text/markdown');
      else showToast('⚠ ' + (d.error || '导出失败'));
    });
    v.querySelectorAll('.chip').forEach(c=>c.addEventListener('click', ()=>{
      const i=c.dataset.i;
      v.querySelectorAll('.chip').forEach(x=>x.classList.toggle('active', x===c));
      v.querySelectorAll('.learn-pane').forEach(p=>p.classList.toggle('hidden', p.dataset.p!==i));
    }));
  }catch(e){ v.innerHTML='<div class="empty">加载失败：'+esc(e.message)+'</div>'; }

async function openManualLesson(){
  const f = await openModal({
    title:'手动新增学习条目',
    sub:'把你自己总结的文案经验直接补充到某位专家的档案里（下次讨论会自动注入该专家的提示词）。提供「原文摘录+原文」时会做逐字校验，防止抄错。',
    fields:[
      {name:'agent', label:'专家', type:'radio', options:(window.__MEMBERS||[]).map(m=>({label:m.name, value:m.name}))},
      {name:'point', label:'知识点', type:'textarea', rows:3, placeholder:'例如：口播前 3 秒必须抛出具体数字或反常识结论，否则跳出率会明显上升'},
      {name:'apply', label:'应用方法（可选）', type:'textarea', rows:2, placeholder:'例如：写开头时先列 3 个具体数字候选，选冲击力最强的'},
      {name:'quote', label:'原文摘录（可选）', type:'textarea', rows:2, placeholder:'如果这段经验来自某篇爆款，贴出原文句子'},
      {name:'source', label:'原文出处（可选）', type:'textarea', rows:2, placeholder:'贴出包含上面摘录的原文全文，用于校验'},
    ],
    okText:'保存到档案'
  });
  if (!f) return;
  const agent = (window.__MEMBERS||[]).find(m=>m.name===f.agent);
  const d = await post('/api/learnings/manual', {
    agent_id: agent ? agent.id : f.agent,
    point: f.point || '', apply: f.apply || '', quote: f.quote || '', source: f.source || '',
  });
  if (!d.ok){ showToast('⚠ '+(d.error||'保存失败')); return; }
  showToast('✅ 已写入 ' + f.agent + ' 的学习档案');
  loadLearnings();
}

async function openApiSettings(){

  mask.className = 'modal-mask'; mask.id = 'apiSetMask';
  mask.innerHTML =
    '<div class="modal-box" style="max-width:660px;max-height:82vh;overflow:auto">' +
      '<div class="modal-title"><span class="ico"><svg><use href="#ic-key"/></svg></span> API 集中设置</div>' +

      '<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap"><b><span class="ico" style="width:14px;height:14px"><svg><use href="#ic-mic"/></svg></span> 语音转文字（硅基流动）</b>' +
        st(!!asr.has_key, asr.has_key ? '已配置（' + esc(asr.key_masked) + '）' : '未配置') + '</div>' +
      '<div class="muted" style="font-size:12px;margin:6px 0">无字幕视频自动转逐字稿（SenseVoice，免费）。注册 <b>siliconflow.cn</b> → 控制台创建 API Key。</div>' +

        '<button class="btn-primary" data-apisave="asr" style="padding:5px 12px"><span class="ico" style="width:13px;height:13px"><svg><use href="#ic-download"/></svg></span> 保存</button>' +
      '</div>' +
      '<div class="muted" data-apiresult="asr" style="font-size:12px;margin-top:6px"></div>' +
    '</div>' +
    /* --- TTS --- */
    '<div class="set-card" style="border:1px solid var(--c-border);border-radius:10px;padding:12px;background:var(--c-card)">' +
      '<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap"><b><span class="ico" style="width:14px;height:14px"><svg><use href="#ic-speaker"/></svg></span> 配音（IndexTTS）</b>' +
        st(!!tts.has_token, tts.has_token ? '已配置（' + esc(tts.token_masked) + '）' : '未配置') + '</div>' +
      '<div class="muted" style="font-size:12px;margin:6px 0">IndexTTS-2.5 音色克隆。浏览器已登录 modelscope.cn 时可一键自动获取，无需手动找令牌。</div>' +
      /* --- 推理后端选择（默认 auto：自动判断，能本地就跑本地，否则回退在线） --- */
      '<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:8px 0">' +
        '<span class="muted" style="font-size:12px">推理后端：</span>' +
        '<select id="apiTtsBackend" style="flex:1;min-width:220px">' +
          '<option value="auto"' + ((tts.backend || 'auto') === 'auto' ? ' selected' : '') + '>⚙️ 自动（推荐：本地已装则本地，否则在线）</option>' +
          '<option value="modelscope"' + (tts.backend === 'modelscope' ? ' selected' : '') + '>🌐 在线（ModelScope 云端，需 Token）</option>' +
          '<option value="local"' + (tts.backend === 'local' ? ' selected' : '') + '>💻 本地（IndexTTS 本机显卡推理，免 Token）</option>' +
        '</select>' +
      '</div>' +
      '<div id="apiGpuInfo" style="font-size:12px;margin:2px 0 8px"></div>' +
      '<div class="mon-add">' +
        '<input id="apiTtsToken" type="password" placeholder="' + (tts.has_token ? '更换 Token（留空 = 保持不变）' : '粘贴 SDK Token（ms- 开头）') + '" style="flex:1" />' +
        '<button class="btn-primary" id="apiTtsFetch" style="padding:5px 12px;background:#af52de"><span class="ico" style="width:13px;height:13px"><svg><use href="#ic-spark"/></svg></span> 自动获取</button>' +
        '<button class="btn-primary" data-apitest="tts" style="padding:5px 12px"><span class="ico" style="width:13px;height:13px"><svg><use href="#ic-bolt"/></svg></span> 测试</button>' +
        '<button class="btn-primary" data-apisave="tts" style="padding:5px 12px"><span class="ico" style="width:13px;height:13px"><svg><use href="#ic-download"/></svg></span> 保存</button>' +
      '</div>' +
      '<div class="muted" data-apiresult="tts" style="font-size:12px;margin-top:6px"></div>' +
    '</div>';
  const setResult = (kind, html) => { const el = body.querySelector('[data-apiresult="' + kind + '"]'); if (el) el.innerHTML = html; };
  // 加载本机 GPU 信息（判断能否跑本地 IndexTTS）
  const gpuEl = $('apiGpuInfo');
  if (gpuEl) {
    try {
      const g = await fetch('/api/system/gpu').then(r => r.json());
      const gp = g.gpu || {};
      if (gp.name) {
        let gpuHtml = '🖥️ 本机显卡：<b>' + esc(gp.name) + '</b> · ' + gp.vram_gb + 'GB 显存（可用 ' + gp.vram_free_gb + 'GB）· 驱动 ' + esc(gp.driver) +
          (gp.compute_cap ? ' · 计算能力 ' + esc(gp.compute_cap) : '');
        if (gp.compute_cap && parseFloat(gp.compute_cap) >= 9.0) {
          gpuHtml += tts.local_ready
            ? '<br>✅ <b>本地 IndexTTS 已安装</b>，自动模式下将优先本地推理（免费、免排队）'
            : '<br>⚙️ 显卡支持本地 IndexTTS（RTX 50系），但尚未安装本地环境——<b>自动模式下会先走在线</b>，装好本地后自动切换';
        } else {
          gpuHtml += '<br>⚠️ 显卡较老，本地推理可能较慢';
        }
        gpuEl.innerHTML = gpuHtml;
      } else {
        gpuEl.innerHTML = '<span class="muted">⚠️ 未检测到 NVIDIA 显卡，本地 IndexTTS 将回退到 CPU 推理（较慢），建议在线模式。</span>';
      }
    } catch (e) { gpuEl.innerHTML = ''; }
  }
  // 保存
  body.querySelectorAll('[data-apisave]').forEach(btn => btn.addEventListener('click', async () => {
    const kind = btn.dataset.apisave;
    btn.disabled = true;
    let r;
    if (kind === 'llm') {
      r = await post('/api/settings/llm', { base_url: $('apiLlmUrl').value.trim(), api_key: $('apiLlmKey').value.trim(), model: $('apiLlmModel').value.trim() });
      if (r.ok) $('apiLlmKey').value = '';
    } else if (kind === 'asr') {
      const key = $('apiAsrKey').value.trim();
      if (!key) { showToast('请先粘贴 API Key'); btn.disabled = false; return; }
      r = await post('/api/settings/asr', { api_key: key });
    } else {
      const backend = $('apiTtsBackend') ? $('apiTtsBackend').value : 'modelscope';
      const token = $('apiTtsToken').value.trim();
      // 本地后端不强制要 Token；在线后端才需要
      if (backend === 'modelscope' && !token) { showToast('在线后端请先粘贴 Token，或改选「本地推理」'); btn.disabled = false; return; }
      r = await post('/api/settings/tts', { token, backend });
      if (r.ok) $('apiTtsToken').value = '';
    }
    btn.disabled = false;
    if (r.ok) { showToast('✅ 已保存'); await apiSetRender(); }
    else setResult(kind, '<span style="color:#ff3b30">❌ ' + esc(r.error || '保存失败') + '</span>');
  }));
  // 测试
  body.querySelectorAll('[data-apitest]').forEach(btn => btn.addEventListener('click', async () => {
    const kind = btn.dataset.apitest;
    btn.disabled = true;
    setResult(kind, '⏳ 连接测试中…');
    const r = await post('/api/settings/test', { kind });
    btn.disabled = false;
    setResult(kind, r.ok
      ? '<span style="color:#34c759">✅ 连接成功' + (r.model ? '（' + esc(r.model) + '）' : '') + (r.endpoints ? '，可用接口 ' + r.endpoints.length + ' 个' : '') + '</span>'
      : '<span style="color:#ff3b30">❌ ' + esc(r.error || '连接失败') + '</span>');
  }));
  // 自动获取 ModelScope Token
  $('apiTtsFetch').addEventListener('click', async () => {
    const btn = $('apiTtsFetch');
    btn.disabled = true;
    setResult('tts', '⏳ 正在从浏览器登录态读取 ModelScope 令牌…');
    const r = await post('/api/settings/fetch_modelscope_token', {});
    if (r.ok && r.token) {
      const s = await post('/api/settings/tts', { token: r.token });
      if (s.ok) {
        setResult('tts', '<span style="color:#34c759">✅ 已自动获取并保存（' + esc(r.name || 'default') + '）</span>');
        showToast('✅ Token 已自动获取并保存');
        await apiSetRender();
      } else setResult('tts', '<span style="color:#ff3b30">❌ 获取成功但保存失败：' + esc(s.error || '') + '</span>');
    } else {
      setResult('tts', '<span style="color:#ff3b30">❌ ' + esc(r.error || '未获取到令牌，请先在 Chrome/Edge 登录 modelscope.cn') + '</span>');
    }
    btn.disabled = false;
  });
}

      return;
    }
    $('monAccList').innerHTML = list.map(a => {
      // 昵称：优先抓取到的真实昵称，其次备注名，再其次抖音号
      const name = a.nickname || a.note || a.douyin_id || '未命名账号';

      const subParts = [];

      if (a.douyin_id) subParts.push('抖音号 ' + esc(a.douyin_id));
      const sub = subParts.length ? subParts.join(' · ') : esc(a.home_url || '');
      // 距上次抓取更新 X 条视频
      let newHint = '';
      if (a.new_count == null) {
        newHint = '<span class="mon-newtag" style="background:var(--c-bg-soft);color:var(--c-text-mute)">尚未抓取</span>';
      } else if (a.new_count === 0) {
        newHint = '<span class="mon-newtag" style="background:var(--c-bg-soft);color:var(--c-text-mute)">距上次无新增</span>';
      } else {
        newHint = '<span class="mon-newtag">🆕 距上次更新 ' + a.new_count + ' 条视频</span>';
      }
      const last = a.last_fetched_at ? '<span class="muted" style="font-size:11px;margin-left:6px">' + esc(a.last_fetched_at.slice(5, 16)) + '</span>' : '';
      const homeUrl = esc(a.home_url || '');

async function monPollStatus() {
  if (monitorPollTimer) clearInterval(monitorPollTimer);
  monitorPollTimer = setInterval(async () => {
    try {
      const d = await fetch('/api/monitor/status').then(r => r.json());
      const s = d.state || {};
      const p = s.progress || {};
      const pct = p.total ? Math.round(p.done / p.total * 100) : 0;
      $('monProgressBar').style.width = pct + '%';
      $('monProgressText').textContent = s.running
        ? ('抓取中 ' + p.done + '/' + p.total + (p.current ? ' · 正在处理「' + p.current + '」' : ''))
        : (pct === 100 ? '抓取完成' : (s.last_error ? '⚠ ' + s.last_error : ''));
      if (!s.running) {
        clearInterval(monitorPollTimer); monitorPollTimer = null;
        $('monFetch').disabled = false;
        if (!s.last_error) { await monLoadReport(); await monLoadAccounts(); }
      }
    } catch (_) {}
  }, 1200);
}

// ---- 选题潜力打分（四基因规则，纯前端，不调LLM）----
// 四基因：情绪钩子 / 信息差 / 身份标签 / 行动触发。每条视频标题命中几个基因 + 数据加权 -> 1-10 分。
const TOPIC_GENES = {
  emotion: { label:'情绪', words:['哭','扎心','太准','慌了','惊','后悔','不敢','突然','万万没想到','绝了','救命','太真实','破防','看哭了','心酸','崩溃','激动','泪目','击中','上头','天呐','我天','惊了','泪','难受','揪心','心慌','紧张','兴奋','炸了','爆了','火','不敢看','别再','一定要看','千万别','后悔没','太晚知道','早点知道'] },
  info:    { label:'信息差', words:['八字','命理','五行','星座','属相','农历','时辰','贵人','小人','桃花','财运','姻缘','缘分','前世','今生','流年','大运','命格','日主','身强','身弱','从格','财库','官杀','比劫','伤官','食神','正印','偏印','七杀','财星','官星','印星','偏财','正财','合婚','和合','旺夫','克夫','克妻','刑','冲','合','穿','墓','库','大运交接','岁运','紫微','面相','手相','风水','太岁','犯太岁','本命年','生肖','桃花运','烂桃花','正缘','偏缘','断缘','绝缘','看手','算命','测字','塔罗','占卜'] },
  identity:{ label:'身份标签', words:['命理师','算过','看懂','这三种人','这类人','那种命','你是','天生','注定','你是哪种','命里','一生','天生富贵','天生穷','晚婚','早婚','一辈子','这一生','有福之人','无福','女人命','男人命','女生','男生','姐妹','兄弟','属X','生来','自带','别人','你身边','你身边那个','你家','你对象','你老公','你老婆'] },
  action:  { label:'行动触发', words:['评论区','扣字','想知道','评论区见','收藏','转发','截图','找我','私信','教你','看完','关注','点赞','领取','回复','扣1','扣2','扣3','想知道结果','告诉我','帮你','测测','试一试','照着做','照做','照着','试试','学会','上手','第一步','第一步就','照着这个','直接','照这个'] }
};
function scoreTopic(desc, digg, comment) {
  const t = (desc || '') + '';
  const hit = [];
  for (const k in TOPIC_GENES) {
    const g = TOPIC_GENES[k];
    const n = g.words.filter(w => t.indexOf(w) >= 0).length;
    if (n > 0) hit.push({ key:k, label:g.label, n });
  }
  // 基因得分：命中 1 个 +3，2 个 +5，3 个 +7，4 个 +8（鼓励聚焦不鼓励堆砌）
  let score = 0;
  const gCount = hit.length;
  if (gCount >= 1) score += 3;
  if (gCount >= 2) score += 2;
  if (gCount >= 3) score += 2;
  if (gCount >= 4) score += 1;
  // 数据加权
  digg = Number(digg) || 0; comment = Number(comment) || 0;
  if (digg >= 100000) score += 2;
  else if (digg >= 50000) score += 1;
  if (digg > 0 && comment / digg >= 0.02) score += 1;   // 评论互动率高，更可能触发行动
  score = Math.max(1, Math.min(10, score));
  const labels = hit.map(h => h.label).slice(0, 2).join('·');
  const grade = score >= 8 ? 'high' : score >= 5 ? 'mid' : 'low';
  return { score, labels, grade, gCount };
}
// 潜力分徽章 HTML（评分 + 命中基因标签，tooltip 说明）
function topicScoreBadge(v) {
  const s = scoreTopic(v.desc, v.digg_count, v.comment_count);
  const color = s.grade === 'high' ? '#e23a3a' : s.grade === 'mid' ? '#f5a623' : '#b0b0b0';
  const geneTip = s.labels ? ('命中基因：' + s.labels) : '未命中明显爆款基因（可能偏干货/小众）';
  return '<span class="topic-score" title="' + esc(geneTip + ' · ' + s.score + '分，基于标题四基因+互动数据估算，仅作选题参考') + '" style="display:inline-flex;align-items:center;gap:4px;cursor:help">' +
    '<span style="background:' + color + ';color:#fff;border-radius:6px;padding:2px 7px;font-weight:700;font-size:12px;min-width:22px;text-align:center">' + s.score + '</span>' +
    (s.labels ? '<span class="muted" style="font-size:11px;color:' + color + '">' + esc(s.labels) + '</span>' : '') +
    '</span>';
}

async function monGenRadar() {
  const btn = $('radarGen'), tip = $('radarTip'), out = $('radarOut');
  if (!btn || !tip || !out) return;
  const old = btn.textContent;
  btn.disabled = true; btn.textContent = '⏳ 正在分析…';
  tip.textContent = '';
  try {
    const r = await post('/api/radar/generate', {});
    if (!r.ok) { tip.textContent = '⚠ ' + (r.error || '生成失败'); return; }
    // 展示报告（Markdown -> 简易 HTML）
    out.innerHTML = renderRadarMd(r.report);
    tip.textContent = r.fallback ? '（LLM 未启用，已输出原始数据兜底，可手动判断）' : '✅ 已生成 · 落盘 ' + (r.path || '');
  } catch (e) {
    tip.textContent = '⚠ 生成失败：' + e.message;
  } finally {
    btn.disabled = false; btn.textContent = old;
  }
}
// 读取最近一份选题雷达，进入页面即展示

// 简易 Markdown -> HTML（处理标题/粗体/列表，足够展示选题雷达）
function renderRadarMd(md) {
  if (!md) return '<div class="empty">暂无内容</div>';
  const lines = String(md).split('\n');
  let h = '';
  for (const raw of lines) {
    const line = raw.replace(/\r/g, '');
    if (/^#{1,4}\s/.test(line)) {
      const lv = line.match(/^#+/)[0].length;
      const txt = esc(line.replace(/^#+\s*/, ''));
      h += '<div style="font-weight:700;font-size:' + (lv === 1 ? 15 : 13.5) + 'px;color:#ff9500;margin:10px 0 6px">' + txt + '</div>';
    } else if (/^\s*[-*]\s+/.test(line)) {
      h += '<div style="padding-left:14px;font-size:13px;line-height:1.7;color:var(--c-text)">• ' + esc(line.replace(/^\s*[-*]\s+/, '')) + '</div>';
    } else if (/^\s*\d+\.\s+/.test(line)) {
      h += '<div style="padding-left:14px;font-size:13px;line-height:1.7;color:var(--c-text)">' + esc(line.replace(/^\s*(\d+\.)\s*/, '$1 ')) + '</div>';
    } else if (/^\s*\|/.test(line)) {
      // 表格行简化成纯文本
      h += '<div style="font-size:12.5px;color:var(--c-text-mute);line-height:1.6">' + esc(line.split('|').filter(Boolean).join(' | ').trim()) + '</div>';
    } else if (line.trim()) {
      h += '<div style="font-size:13px;line-height:1.7;color:var(--c-text)">' + esc(line) + '</div>';
    } else {
      h += '<div style="height:6px"></div>';
    }
  }
  return '<div class="radar-body" style="background:var(--c-bg-soft);border:1px solid var(--c-border);border-radius:10px;padding:12px 14px">' + h + '</div>';
}

  (async () => {

      area.value = desc;
      sub.textContent = '⚠ 获取文案失败：' + e.message + ' · 已回退显示标题/简介';
    }
  })();

/* ================= 自动监控（对标监控·持续盯号） ================= */
let autoPollTimer = null;

function deltaHtml(label, val) {
  // val: null(无对比)/0(持平)/正(涨)/负(跌)；中国习惯：涨红跌绿
  if (val === null || val === undefined) return '<span class="delta-none">-</span>';
  if (val > 0) return '<span class="delta-up">▲' + fmtNum(val) + '</span>';
  if (val < 0) return '<span class="delta-down">▼' + fmtNum(Math.abs(val)) + '</span>';
  return '<span class="delta-none">持平</span>';
}

/* 自动监控区块：在 monitor 页内渲染「自动轮询控制 + 数据提醒 + 相邻对比报告」，
   账号列表复用对标监控的同一份账号（不再单独维护）。 */
async function monLoadAutoMonitor() {
  const box = $('monAutoBox');
  if (!box) return;
  box.innerHTML =
    '<div class="card" style="margin-bottom:14px">' +
      '<div class="card-title">⚡ 自动监控（持续盯号）</div>' +

        '<button class="btn-primary" id="autoStart" style="background:#0a84ff">▶ 开始自动监控</button>' +
        '<button class="btn-primary" id="autoStop" style="background:#ff3b30;display:none">■ 停止</button>' +
        '<span class="muted" id="autoStatusText" style="font-size:12px;color:var(--c-text-mute);align-self:center">未启动</span>' +
      '</div>' +
      '<div class="muted" style="font-size:12px;color:var(--c-text-mute);margin-top:8px">基于上方「监控账号」列表，系统每 <b>5 分钟</b> 自动轮询一次所有账号的视频数据，逐视频与上一次对比：🆕 = 新视频，▲红 = 上涨，▼绿 = 下跌。数据异常（暴涨/新视频/涨粉）会实时提醒并在导航显示未读红点。需本机浏览器已登录抖音（自动读取 cookie）。</div>' +
    '</div>' +
    '<div id="autoAlertBox"></div>' +

  $('autoStop').addEventListener('click', autoStop);

  await autoLoadAlerts();
  await autoLoadReport();

async function autoLoadStatus() {
  try {
    const d = await fetch('/api/monitor/poll/status').then(r => r.json());
    const s = d.state || {};
    const startBtn = $('autoStart'), stopBtn = $('autoStop'), txt = $('autoStatusText');
    if (!startBtn || !stopBtn || !txt) return;
    if (s.running) {
      startBtn.style.display = 'none';
      stopBtn.style.display = '';
      const iv = Math.round((s.interval || 300) / 60) || 5;
      const cnt = s.poll_count || 0;
      const last = s.last_poll_at ? new Date(s.last_poll_at * 1000).toLocaleTimeString('zh-CN', { hour12: false }) : '—';
      txt.textContent = '监控中 · 每 ' + iv + ' 分钟一轮 · 已轮询 ' + cnt + ' 轮 · 上次 ' + last;
      startAutoPoll();
    } else {
      startBtn.style.display = '';
      stopBtn.style.display = 'none';
      txt.textContent = '未启动';
    }
  } catch (_) {}
}

function startAutoPoll() {
  if (autoPollTimer) clearInterval(autoPollTimer);
  autoPollTimer = setInterval(async () => {
    // 定期刷新状态 + 报告 + 提醒（前端轮询，间隔 15s，用于捕捉后端 5 分钟轮询的完成）
    await autoLoadStatus();
    await autoLoadReport();
    await autoLoadAlerts();
  }, 15000);
}

async function autoStart() {
  const r = await post('/api/monitor/poll/start', {});
  if (!r.ok) { showToast('⚠ ' + (r.error || '无法启动')); return; }
  showToast('自动监控已启动，每 ' + Math.round(r.interval / 60) + ' 分钟轮询一次');
  $('autoStart').style.display = 'none';
  $('autoStop').style.display = '';
  await autoLoadStatus();
}

async function autoStop() {
  await post('/api/monitor/poll/stop', {});
  showToast('已停止自动监控');
  $('autoStart').style.display = '';
  $('autoStop').style.display = 'none';
  $('autoStatusText').textContent = '未启动';
  if (autoPollTimer) { clearInterval(autoPollTimer); autoPollTimer = null; }
}

async function autoLoadAlerts() {
  const box = $('autoAlertBox');
  if (!box) return;
  try {
    const d = await fetch('/api/monitor/alerts').then(r => r.json());
    const alerts = d.alerts || [];
    const unread = d.unread || 0;
    // 更新导航徽标
    const badge = $('monitorNavBadge');
    if (badge) {
      badge.textContent = unread > 99 ? '99+' : unread;
      badge.style.display = unread > 0 ? '' : 'none';
    }
    if (!alerts.length) {
      box.innerHTML = '';
      return;
    }
    // 只展示最近 30 条，未读排前面
    const sorted = alerts.slice().sort((a, b) => {
      if (a.read !== b.read) return a.read ? 1 : -1;
      return (b.time || '').localeCompare(a.time || '');
    }).slice(0, 30);
    const html = '<div class="card mine-alert-card" style="margin-bottom:14px">' +
      '<div class="mine-alert-head">' +
        '<span class="card-title" style="margin:0">🔔 数据变化提醒' +
          (unread ? ' <span class="mine-alert-badge">' + unread + ' 条未读</span>' : '') +
        '</span>' +
        (unread ? '<button class="btn-text" id="autoMarkRead" style="font-size:12px;color:var(--primary)">全部标已读</button>' : '') +
      '</div>' +
      '<div class="mine-alert-list">' +
        sorted.map(a => {
          const cls = 'mine-alert-item' + (a.read ? ' read' : '') + ' lv-' + (a.level || 'info');
          const icon = a.type === 'spike' ? '🔥' : a.type === 'new_video' ? '🆕' : a.type === 'follower' ? '👥' : '⭐';
          const t = esc(a.time || '').slice(5, 16);
          return '<div class="' + cls + '">' +
            '<div class="mine-alert-icon">' + icon + '</div>' +
            '<div class="mine-alert-body">' +
              '<div class="mine-alert-title">' + esc(a.title || '') +
                '<span class="mine-alert-acct">' + esc(a.account || '') + '</span>' +
                (a.read ? '' : '<span class="mine-dot"></span>') +
              '</div>' +
              '<div class="mine-alert-detail">' + esc(a.detail || '') + '</div>' +
              '<div class="mine-alert-time">' + t + '</div>' +
            '</div>' +
          '</div>';
        }).join('') +
      '</div></div>';
    box.innerHTML = html;
    const mk = $('autoMarkRead');
    if (mk) mk.addEventListener('click', autoMarkAlertsRead);
  } catch (e) {
    box.innerHTML = '';
  }
}

async function autoMarkAlertsRead() {
  try {
    await post('/api/monitor/alerts/read', {});
    await autoLoadAlerts();
  } catch (_) {}
}

async function autoLoadReport() {
  const box = $('autoReport');
  if (!box) return;
  try {
    const d = await fetch('/api/monitor/poll/report').then(r => r.json());
    const rp = d.report;
    if (!rp || !(rp.accounts || []).length) {
      box.innerHTML = '<div class="card"><div class="empty">还没有自动轮询数据，点「▶ 开始自动监控」，系统会每 5 分钟自动抓取并对比增量</div></div>';

/* 合成提示音：用 Web Audio API 合成，无需外部音频文件。
   type: 'ok'=成功（叮咚上扬） / 'err'=失败（低沉短促两声） */
function ttsPlaySound(type) {
  try {
    if (!_sndCtx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      _sndCtx = new AC();
    }
    const ctx = _sndCtx;
    if (ctx.state === 'suspended') ctx.resume();
    const t0 = ctx.currentTime;
    const tone = (freq, start, dur, gain, type) => {
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.type = type || 'sine';
      o.frequency.setValueAtTime(freq, t0 + start);
      g.gain.setValueAtTime(0.0001, t0 + start);
      g.gain.exponentialRampToValueAtTime(gain, t0 + start + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + start + dur);
      o.connect(g); g.connect(ctx.destination);
      o.start(t0 + start); o.stop(t0 + start + dur + 0.05);
    };
    if (type === 'err') {
      tone(320, 0, 0.18, 0.22, 'square');
      tone(220, 0.18, 0.28, 0.22, 'square');
    } else {
      tone(880, 0, 0.12, 0.20, 'sine');
      tone(1320, 0.12, 0.20, 0.20, 'sine');
    }
  } catch (e) { /* 提示音失败不影响主流程 */ }
}

  // 求测者经历·抽拉式档案：hover 把手滑出；点遮罩/✕/Esc/再点把手 对称滑回（对标成熟抽屉三要素）
  (function () {
    const wrap = $('ttsProfileWrap');
    if (wrap) {
      const panel = $('ttsProfilePanel');
      const mask = $('ttsProfileMask');
      const handle = $('ttsProfileHandle');
      const closeBtn = $('ttsProfileCloseBtn');
      const open = () => { panel.classList.add('open'); mask.classList.add('open'); wrap.classList.add('is-open'); };
      const close = () => { panel.classList.remove('open'); mask.classList.remove('open'); wrap.classList.remove('is-open'); };
      const isOpen = () => panel.classList.contains('open');
      // 把手「点击才弹出」（不再悬停弹出，避免鼠标路过就误触弹开）
      const hoverCancel = () => {};
      // 拖动结束后的「抑制点击」处理：阻止拖动松手误触发 open/close
      const _suppress = (e) => { e.stopPropagation(); e.preventDefault(); };
      // 收起：点遮罩 / 点 ✕ / 点把手再次切换 / Esc
      mask.addEventListener('click', close);
      closeBtn.addEventListener('click', close);
      handle.addEventListener('click', () => { if (handle.classList.contains('dragging')) return; isOpen() ? close() : open(); });
      document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && isOpen()) close(); });

      /* 把手可垂直拖动：按住上下拖动到顺手的位置，松开后记住（localStorage 持久化） */
      (function () {
        const wrapEl = $('ttsProfileWrap');
        if (!wrapEl) return;
        const KEY = 'tts_profile_handle_top';
        // 恢复上次拖动的位置（若有）
        try {
          const saved = parseFloat(localStorage.getItem(KEY));
          if (!isNaN(saved) && saved >= 0 && saved <= window.innerHeight - wrapEl.offsetHeight) {
            wrapEl.style.top = saved + 'px';
          }
        } catch (e) {}
        let dragging = false, startY = 0, startTop = 0, moved = false;
        handle.addEventListener('pointerdown', (e) => {
          dragging = true;
          moved = false;
          startY = e.clientY;
          startTop = wrapEl.getBoundingClientRect().top;
          handle.classList.add('dragging');
          handle.setPointerCapture(e.pointerId);
          hoverCancel();
          e.preventDefault();
        });
        handle.addEventListener('pointermove', (e) => {
          if (!dragging) return;
          const dy = e.clientY - startY;
          if (Math.abs(dy) > 3) moved = true;   // 移动超过 3px 视为「拖动」，抑制点击
          let top = startTop + dy;
          const maxTop = Math.max(0, window.innerHeight - wrapEl.offsetHeight - 8);
          top = Math.min(Math.max(0, top), maxTop);
          wrapEl.style.top = top + 'px';
        });
        const endDrag = (e) => {
          if (!dragging) return;
          dragging = false;
          handle.classList.remove('dragging');
          try { handle.releasePointerCapture(e.pointerId); } catch (err) {}
          if (moved) {
            // 拖动过：抑制紧随的 click（避免松手误开抽屉）
            handle.addEventListener('click', _suppress, { once:true, capture:true });
          }
          try {
            localStorage.setItem(KEY, String(wrapEl.getBoundingClientRect().top));
          } catch (err) {}
        };
        handle.addEventListener('pointerup', endDrag);
        handle.addEventListener('pointercancel', endDrag);
      })();
    }
  })();
  // 绑定事件
  // 对话界面「转音频用音色」下拉框 + 上传按钮
  const _cvSel = $('ttsChatVoiceSel');
  if (_cvSel) _cvSel.addEventListener('change', () => {
    _chatVoiceId = _cvSel.value;
    try {
      localStorage.setItem('tts_selected_voice', _chatVoiceId || '');
      // 手动改选音色后，下一次打开应重新让用户选择；只有未完成任务才恢复锁定音色。
      const locked = localStorage.getItem('tts_generation_voice_lock') || '';
      if (locked && locked !== _chatVoiceId) localStorage.removeItem('tts_generation_voice_incomplete');
    } catch (e) {}
  });
  const _cvEdit = $('ttsChatVoiceEdit');
  if (_cvEdit) _cvEdit.addEventListener('click', ttsEditSelectedPreset);
  const _cvDedup = $('ttsChatVoiceDedup');
  if (_cvDedup) _cvDedup.addEventListener('click', ttsCleanupSelectedDuplicates);
  const _cvAdd = $('ttsChatVoiceAdd');
  if (_cvAdd) _cvAdd.addEventListener('click', () => $('ttsChatVoiceFile').click());
  // 对话界面「🔑 Token」按钮：点击打开 API 设置，并根据 token 状态显示颜色
  const _cvToken = $('ttsChatTokenBtn');
  if (_cvToken) _cvToken.addEventListener('click', openApiSettings);
  ttsRefreshTokenBtn();
  const _cvFile = $('ttsChatVoiceFile');
  if (_cvFile) _cvFile.addEventListener('change', async e => {
    const f = e.target.files[0];
    if (!f) return;
    await ttsUploadVoiceFile(f);
    e.target.value = '';
  });
  // 音色栏支持拖拽上传：把音频文件直接拖到音色栏即可克隆保存
  const _cvVoiceBar = document.querySelector('.tts-chat-voice');
  if (_cvVoiceBar) ttsBindDropZone(_cvVoiceBar);
  // 聊天窗口也支持拖拽上传（拖到对话区任意位置即可）
  const _cvChatBody = $('agentChatBox');
  if (_cvChatBody) ttsBindDropZone(_cvChatBody);
  $('extractBtn').addEventListener('click', ttsExtractLink);
  $('extractLoadBtn').addEventListener('click', ttsLoadLatestExtract);
  $('extractTextBtn').addEventListener('click', () => $('extractTextFile').click());
  $('extractTextFile').addEventListener('change', ttsExtractTextFile);
  var _asrToggle = $('asrToggle');
  if (_asrToggle) _asrToggle.addEventListener('click', () => $('asrCollapse').classList.toggle('collapsed'));
  $('asrTranscribeBtn').addEventListener('click', ttsAsrTranscribe);
  $('visitorReextractBtn').addEventListener('click', ttsReextractVisitorProfile);
  const _speakerOpenBtn = $('speakerOpenBtn');
  if (_speakerOpenBtn) _speakerOpenBtn.addEventListener('click', ttsOpenSpeakerDialog);
  const _speakerResegmentBtn = $('speakerResegmentBtn');
  if (_speakerResegmentBtn) _speakerResegmentBtn.addEventListener('click', ttsResegmentCurrent);
  $('visitorSaveBtn').addEventListener('click', ttsSaveVisitorProfile);
  $('wlAddBtn').addEventListener('click', wlAddAccount);
  $('wlCrawlBtn').addEventListener('click', wlCrawlAll);
  $('wlDelShortBtn').addEventListener('click', wlDeleteShort);
  $('wlHomeUrl').addEventListener('keydown', e => { if (e.key === 'Enter') wlAddAccount(); });
  $('chatSendBtn').addEventListener('click', ttsSendChatMessage);
  $('chatInput').addEventListener('keydown', e => { if (e.key === 'Enter') ttsSendChatMessage(); });
  $('chatInput').addEventListener('input', ttsUpdateCharCount);
  $('chatBatchBtn').addEventListener('click', ttsBatchCommentAudio);
  const _genAllBtn = $('ttsGenAllBtn');
  if (_genAllBtn) _genAllBtn.addEventListener('click', ttsGenAllAudio);
  const _queueBtn = $('ttsQueueBtn');
  if (_queueBtn) _queueBtn.addEventListener('click', () => ttsToggleQueue());
  const _queueClose = $('ttsQueueClose');
  if (_queueClose) _queueClose.addEventListener('click', () => ttsToggleQueue(false));
  const _queueHandle = $('ttsQueueHandle');
  if (_queueHandle) _queueHandle.addEventListener('click', () => ttsToggleQueue(true));
  const _queueMask = $('ttsQueueMask');
  if (_queueMask) _queueMask.addEventListener('click', () => ttsToggleQueue(false));
  // 语音队列把手与经历档案一致：可点击开合、可上下拖动、位置持久化。
  (function () {
    const handle = $('ttsQueueHandle');
    if (!handle) return;
    const KEY = 'tts_queue_handle_top';
    try {
      const saved = parseFloat(localStorage.getItem(KEY));
      if (!isNaN(saved)) handle.style.top = Math.max(0, Math.min(window.innerHeight - 70, saved)) + 'px';
    } catch (e) {}
    let dragging = false, moved = false, startY = 0, startTop = 0;
    const suppressClick = (e) => { e.stopPropagation(); e.preventDefault(); };
    handle.addEventListener('pointerdown', (e) => {
      dragging = true; moved = false; startY = e.clientY;
      startTop = handle.getBoundingClientRect().top;
      handle.classList.add('dragging');
      try { handle.setPointerCapture(e.pointerId); } catch (err) {}
      e.preventDefault();
    });
    handle.addEventListener('pointermove', (e) => {
      if (!dragging) return;
      const dy = e.clientY - startY;
      if (Math.abs(dy) > 3) moved = true;
      const maxTop = Math.max(0, window.innerHeight - handle.offsetHeight - 8);
      handle.style.top = Math.max(0, Math.min(maxTop, startTop + dy)) + 'px';
    });
    const endDrag = (e) => {
      if (!dragging) return;
      dragging = false; handle.classList.remove('dragging');
      try { handle.releasePointerCapture(e.pointerId); } catch (err) {}
      if (moved) handle.addEventListener('click', suppressClick, { once:true, capture:true });
      try { localStorage.setItem(KEY, String(handle.getBoundingClientRect().top)); } catch (err) {}
    };
    handle.addEventListener('pointerup', endDrag);
    handle.addEventListener('pointercancel', endDrag);
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && $('ttsQueuePanel') && $('ttsQueuePanel').classList.contains('open')) ttsToggleQueue(false);
    });
  })();
  const _qRunTab = $('ttsQTabRunning');
  const _qFailTab = $('ttsQTabFailed');
  if (_qRunTab) _qRunTab.addEventListener('click', () => { _ttsQueueTab = 'running'; ttsRenderQueue(); });
  if (_qFailTab) _qFailTab.addEventListener('click', () => { _ttsQueueTab = 'failed'; ttsRenderQueue(); });
  $('chatAddBtn').addEventListener('click', ttsInsertMessage);
  const _restartBtn = $('ttsRestartBtn');
  if (_restartBtn) _restartBtn.addEventListener('click', ttsRestartChat);
  const _endBtn = $('ttsEndBtn');
  if (_endBtn) _endBtn.addEventListener('click', ttsEndChat);
  await ttsLoadPresets();
  await ttsLoadAsrSettings();
  ttsRestoreRunning();
  ttsRenderQueue();
  ttsRunPendingStep();
  ttsRenderFlowSteps();
}

var _asrPollTimer = null;

async function ttsAsrTranscribe() {
  const url = $('extractUrl').value.trim();
  if (!url) { showToast('请先在上方输入抖音分享链接'); return; }
  const btn = $('asrTranscribeBtn');
  btn.disabled = true;
  $('asrProgressWrap').style.display = 'block';
  $('asrProgressBar').style.width = '0%';
  $('asrStatus').innerHTML = '<span style="color:var(--primary)">⏳ 正在准备转录…</span>';
  try {
    const d = await fetch('/api/extract/asr/transcribe', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ url }) }).then(r => r.json());
    if (!d.ok) {
      $('asrProgressWrap').style.display = 'none';
      $('asrStatus').innerHTML = '<span style="color:#ff3b30">❌ ' + esc(d.error || '转录失败') + '</span>';
      btn.disabled = false;
      return;
    }
    ttsAsrPollStatus();
  } catch (e) {
    $('asrProgressWrap').style.display = 'none';
    $('asrStatus').innerHTML = '<span style="color:#ff3b30">❌ ' + esc(e.message) + '</span>';
    btn.disabled = false;
  }
}

async function ttsAsrPollStatus() {
  if (_asrPollTimer) clearInterval(_asrPollTimer);
  _asrPollTimer = setInterval(async () => {
    let s;
    try {
      const d = await fetch('/api/extract/asr/status').then(r => r.json());
      s = d.state || {};
    } catch (_) { return; }

    // 进度条：下载阶段按字节百分比；其他阶段走「无限/满条」示意
    const p = s.progress || {};
    let pct = 0, barOn = true;
    if (s.stage === 'download' && p.total) {
      pct = Math.min(100, Math.round(p.done / p.total * 100));
    } else if (s.stage === 'transcribe') {
      // 转写阶段时长不可预知，给一条缓慢流动的满条提示「处理中」
      pct = Math.max(3, parseInt($('asrProgressBar').style.width || '0'));
      pct = Math.min(90, pct + 2);
    } else if (!s.running && s.stage === 'done') {
      pct = 100;
    } else if (s.stage === 'error') {
      barOn = false;
    }
    if (barOn) {
      $('asrProgressWrap').style.display = 'block';
      $('asrProgressBar').style.width = pct + '%';
    } else {
      $('asrProgressWrap').style.display = 'none';
    }

    // 阶段文字
    const t = s.stage_text || '';
    if (s.stage === 'download' && p.total) {
      $('asrStatus').innerHTML = '<span style="color:var(--primary)">⏳ ' + esc(t) + ' ' +
        Math.round(p.done / 1024 / 1024 * 10) / 10 + ' / ' +
        Math.round(p.total / 1024 / 1024 * 10) / 10 + ' MB</span>';
    } else if (s.running) {
      $('asrStatus').innerHTML = '<span style="color:var(--primary)">⏳ ' + esc(t || '处理中…') + '</span>';
    }

    if (!s.running) {
      clearInterval(_asrPollTimer); _asrPollTimer = null;
      $('asrTranscribeBtn').disabled = false;
      if (s.last_error) {
        $('asrProgressWrap').style.display = 'none';
        $('asrStatus').innerHTML = '<span style="color:#ff3b30">❌ ' + esc(s.last_error) + '</span>';
        return;
      }
      const d = s.result;
      if (!d) {
        $('asrProgressWrap').style.display = 'none';
        $('asrStatus').innerHTML = '<span style="color:#ff3b30">❌ 转录结果为空</span>';
        return;
      }
      $('asrProgressBar').style.width = '100%';
      $('asrProgressWrap').style.display = 'none';
      $('asrStatus').innerHTML = '<span style="color:#34c759">✅ 转录完成，共 ' + (d.segments || []).length + ' 句' +
        (d.audio_size_mb ? '（音频 ' + d.audio_size_mb + 'MB）' : '') + '。识别可能有错，请逐句检查修改。</span>';
      _extractData = d;
      $('extractStatus').innerHTML = '<span style="color:#34c759">✅ 已用语音转文字结果替换（' + (d.segments || []).length + ' 句）</span>';
      if (d.video_info) {
        const vi = d.video_info;
        $('extractVideoInfo').innerHTML =
          '<div style="padding:8px 12px;border:1px solid var(--c-border);border-radius:8px;background:var(--c-card);font-size:13px">' +
              '<b>' + esc(vi.nickname || '未知') + '</b> · ' + esc(vi.desc || '') +
              (vi.duration ? ' · ⏱ ' + Math.round(vi.duration / 1000 / 60) + ' 分钟' : '') +
          '</div>';
      }
      $('visitorProfileBox').innerHTML = '';
      ttsRenderSegments(d.segments, d.extract_id);
      ttsUpdateSpeakerOptions(d.segments);
      ttsRenderVisitorProfile(d.visitor_profile);
      // 转录完成 → 自动折叠「语音转文字」卡片，让焦点回到下方分段结果
      var ac = $('asrCollapse'); if (ac) ac.classList.add('collapsed');
      showToast('转录完成');
      ttsAutoFlowAfterExtract(d.segments);
    }
  }, 1200);
}

// 刷新对话界面「🔑 Token」按钮的显示状态（有 token=绿✅，无 token=红⚠）
// 上传一个音色文件：上传参考音频 → 起名 → 保存为预设 → 自动选中
async function ttsUploadVoiceFile(f) {
  if (!f) return;
  const fd = new FormData();
  fd.append('file', f);
  try {
    const up = await fetch('/api/tts/upload', { method: 'POST', body: fd }).then(r => r.json());
    if (!up.ok) { showToast('⚠ ' + (up.error || '上传失败')); return; }
    const name = prompt('给这个音色起个名字：', (f.name || '音色').replace(/\.[^.]+$/, ''));
    if (name === null) return;
    const nm = (name || '').trim();
    if (!nm) { showToast('请填写音色名称'); return; }
    const sv = await fetch('/api/tts/presets', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: nm, ref_path: up.path }) }).then(r => r.json());
    if (!sv.ok) { showToast('⚠ ' + (sv.error || '保存失败')); return; }
    showToast(sv.duplicate ? '✅ 参考音频已存在，已复用原音色' : '✅ 音色「' + nm + '」已保存并选中');
    await ttsLoadPresets();
    const csel2 = $('ttsChatVoiceSel');
    if (csel2 && csel2.options.length) {
      csel2.value = (sv.preset && sv.preset.id) ? sv.preset.id : csel2.options[csel2.options.length - 1].value;
      _chatVoiceId = csel2.value;
    }
  } catch (err) { showToast('⚠ 上传失败：' + err.message); }
}

// 给元素绑定拖拽上传：把音频文件拖进去即可克隆保存音色
function ttsBindDropZone(el) {
  if (!el) return;
  el.addEventListener('dragover', e => {
    e.preventDefault();
    el.style.outline = '2px dashed var(--c-accent, #af52de)';
    el.style.outlineOffset = '-4px';
  });
  el.addEventListener('dragleave', () => {
    el.style.outline = 'none';
  });
  el.addEventListener('drop', async e => {
    e.preventDefault();
    el.style.outline = 'none';
    const files = e.dataTransfer && e.dataTransfer.files;
    if (!files || !files.length) return;
    const f = files[0];
    const ext = (f.name.split('.').pop() || '').toLowerCase();
    const okExt = ['wav','mp3','flac','ogg','m4a','aac','opus','webm'];
    if (okExt.indexOf(ext) < 0) { showToast('⚠ 请拖入音频文件（wav/mp3/flac/m4a 等）'); return; }
    await ttsUploadVoiceFile(f);
  });
}

async function ttsLoadPresets() {
  try {
    const d = await fetch('/api/tts/presets').then(r => r.json());
    const ps = d.presets || [];
    // 同步对话界面的「转音频用音色」下拉框（主入口）
    const csel = $('ttsChatVoiceSel');
    if (csel) {
      let resume = '', incomplete = false;
      try {
        incomplete = localStorage.getItem('tts_generation_voice_incomplete') === '1';
        resume = incomplete ? (localStorage.getItem('tts_generation_voice_lock') || '') : '';
      } catch (e) {}
      const cur = incomplete ? (_chatVoiceId || resume) : '';
      csel.innerHTML = (ps.length ? '<option value="">请选择音色</option>' : '') +
        (ps.length
          ? ps.map(p => '<option value="' + p.id + '">' + esc(p.name) + (p.duplicate_of ? ' · 重复参考音频' : '') + '</option>').join('')
          : '<option value="">（暂无音色，点上传音色）</option>');
      if (cur && ps.some(p => p.id === cur)) { csel.value = cur; _chatVoiceId = cur; }
      else { csel.value = ''; _chatVoiceId = ''; }
    }
  } catch (e) {}
  ttsRefreshGuideBar();
}

async function ttsEditSelectedPreset() {
  const sel = $('ttsChatVoiceSel');
  const id = _chatVoiceId || (sel && sel.value);
  if (!id) { showToast('请先选择一个音色'); return; }
  let presets = [];
  try { presets = ((await fetch('/api/tts/presets').then(r => r.json())) || {}).presets || []; } catch (e) {}
  const p = presets.find(x => x.id === id);
  if (!p) { showToast('音色不存在或已删除'); await ttsLoadPresets(); return; }
  const f = await openModal({
