<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>靓仔文案工作台</title>
<style>
:root {
  --primary:#0a84ff;
  --primary-dark:#0071e3;
  --primary-bg:#eaf4ff;
  /* 语义色（暗黑模式在此覆盖） */
  --c-bg:#f5f5f7;        /* 页面背景（Apple 官网灰） */
  --c-card:#ffffff;      /* 卡片/顶栏/面板背景 */
  --c-bg-soft:#f0f0f2;   /* 次级背景/悬停 */
  --c-border:#e3e3e8;    /* 边框/分隔线 */
  --c-text:#1d1d1f;      /* 主文字 */
  --c-text-sub:#6e6e73;  /* 次级文字 */
  --c-text-mute:#9b9ba3; /* 弱化文字 */
  --c-input:#ffffff;     /* 输入框背景 */
  --c-hover:#eaeaec;     /* 行悬停背景 */
  /* macOS 风格阴影 */
  --shadow-card:0 1px 2px rgba(0,0,0,.04), 0 4px 16px rgba(0,0,0,.06);
  --shadow-float:0 8px 40px rgba(0,0,0,.16);
  /* 统一遮罩 + 缓动（成熟设计系统：快/中/慢 三档 + 固定曲线） */
  --overlay:rgba(0,0,0,.42);                       /* 全站统一遮罩色 */
  --ease-fast:cubic-bezier(.2,.8,.2,1);            /* 150ms 快（开关、hover） */
  --ease-mid:cubic-bezier(.32,.72,0,1);            /* 250ms 中（抽屉、面板） */
  --ease-slow:cubic-bezier(.25,.1,.25,1);          /* 350ms 慢（大范围位移） */
}
html[data-theme="dark"] {
  --overlay:rgba(0,0,0,.6);
}
html[data-theme="dark"] {
  --c-bg:#000000;
  --c-card:#1c1c1e;
  --c-bg-soft:#2c2c2e;
  --c-border:#38383a;
  --c-text:#f5f5f7;
  --c-text-sub:#a1a1a6;
  --c-text-mute:#6e6e73;
  --c-input:#2c2c2e;
  --c-hover:#2c2c2e;
  --primary:#0a84ff;
  --primary-dark:#3395ff;
  --primary-bg:#0a2a4a;
  --shadow-card:0 1px 2px rgba(0,0,0,.5), 0 4px 16px rgba(0,0,0,.4);
  --shadow-float:0 8px 40px rgba(0,0,0,.6);
}
/* 暗黑模式：语义浅底色降饱和 */
html[data-theme="dark"] .top-status.busy,
html[data-theme="dark"] .badge.busy,
html[data-theme="dark"] .df-del,
html[data-theme="dark"] .df-tag.del,
html[data-theme="dark"] .wr-ev-tag.rep,
html[data-theme="dark"] .works-toolbar .batch-btn.danger:hover,
html[data-theme="dark"] .drawer .dbtns .danger:hover,
html[data-theme="dark"] .rw-item .rw-ops button.del:hover { background:#3a1f24; color:#ff7a8a; border-color:#5a2a33; }
html[data-theme="dark"] .tl-ico.adopt,
html[data-theme="dark"] .ctxbar,
html[data-theme="dark"] .st-to_adopt,
html[data-theme="dark"] .drawer .adopt-item,
html[data-theme="dark"] .ver-item .ver-hd .v-tag.adopt,
html[data-theme="dark"] .final.learn,
html[data-theme="dark"] .learn-item,
html[data-theme="dark"] .lb-hint,
html[data-theme="dark"] .card-script { background:#332b18; border-color:#5a4a22; color:#d4b46a; }
html[data-theme="dark"] .learn-hero { background:linear-gradient(135deg,#2a2417,#2b2816); border-color:#5a4a22; }
html[data-theme="dark"] .ver-item .ver-hd .v-tag.adopt,
html[data-theme="dark"] .st-to_adopt { color:#e0b96a; }
html[data-theme="dark"] .sec-title::after,
html[data-theme="dark"] .mon-progress { background:var(--c-bg-soft); }
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; background:var(--c-bg); color:var(--c-text); font-size:14px; }
.hidden { display:none !important; }
button { font-family:inherit; cursor:pointer; }
input,textarea { font-family:inherit; outline:none; }
/* 键盘焦点可见性：所有可交互元素在 Tab 导航时显示清晰焦点环（成熟产品无障碍标配） */
:focus-visible { outline:2px solid var(--primary); outline-offset:2px; border-radius:6px; }
button:focus:not(:focus-visible), [role="button"]:focus:not(:focus-visible) { outline:none; }
input:not([type]),input[type=text],input[type=search],input[type=url],input[type=password],input[type=email],input[type=number],textarea {
  border:1px solid #c8ccd1;
  border-radius:8px;
  padding:8px 10px;
  background:var(--c-input);
  color:var(--c-text);
  font-size:14px;
  transition:border-color .2s, box-shadow .2s, background .2s;
}
input:not([type]):hover,input[type=text]:hover,input[type=search]:hover,input[type=url]:hover,input[type=password]:hover,input[type=email]:hover,input[type=number]:hover,textarea:hover {
  border-color:#a8afb6;
}
input:not([type]):focus,input[type=text]:focus,input[type=search]:focus,input[type=url]:focus,input[type=password]:focus,input[type=email]:focus,input[type=number]:focus,textarea:focus {
  border-color:var(--primary);
  box-shadow:0 0 0 4px rgba(10,132,255,.15);
  background:var(--c-input);
}
::placeholder { color:var(--c-text-mute); opacity:.9; }

/* ---------- 顶栏 ---------- */
.topbar { height:56px; background:var(--c-card); background:color-mix(in srgb, var(--c-card) 82%, transparent); backdrop-filter:saturate(180%) blur(20px); -webkit-backdrop-filter:saturate(180%) blur(20px); border-bottom:1px solid var(--c-border); display:flex; align-items:center; gap:16px; padding:0 20px; position:sticky; top:0; z-index:50; }
.brand { display:flex; align-items:center; gap:10px; font-size:16px; font-weight:600; color:var(--c-text); letter-spacing:-.01em; }
.brand .logo { width:30px; height:30px; border-radius:8px; background:linear-gradient(135deg,#0a84ff,#5ac8fa); color:#fff; display:flex; align-items:center; justify-content:center; font-size:16px; box-shadow:0 2px 6px rgba(10,132,255,.35); }
.brand .sub { font-size:11px; font-weight:400; color:var(--c-text-mute); margin-top:2px; }
.top-status { margin-left:auto; display:flex; align-items:center; gap:6px; font-size:12px; color:var(--primary); background:var(--primary-bg); border-radius:999px; padding:4px 12px; }
.top-status.busy { color:#ff453a; background:#ffeceb; }
.top-status .dot { width:7px; height:7px; border-radius:50%; background:currentColor; }
.btn-primary { background:var(--primary); color:#fff; border:none; border-radius:10px; padding:8px 18px; font-size:13px; font-weight:500; box-shadow:0 1px 3px rgba(10,132,255,.35); transition:background .15s, transform .05s; }
.btn-primary:hover { background:var(--primary-dark); }
.btn-primary:active { transform:scale(.98); }
.btn-primary:disabled { background:#c7c7cc; box-shadow:none; cursor:not-allowed; }
.btn-ghost { background:var(--c-card); color:var(--c-text); border:1px solid var(--c-border); border-radius:10px; padding:7px 15px; font-size:13px; transition:background .15s; }
.btn-ghost:hover { background:var(--c-bg-soft); }

/* ---------- 顶栏搜索 ---------- */
.top-search { position:relative; margin-left:auto; }
.top-search input { width:210px; border:1px solid var(--c-border); background:var(--c-bg-soft); border-radius:999px; padding:7px 14px; font-size:13px; outline:none; transition:width .2s, background .2s; }
.top-search input:focus { width:260px; background:var(--c-input); border-color:var(--primary); }
.search-panel { position:absolute; top:calc(100% + 8px); right:0; width:340px; max-height:420px; overflow-y:auto; background:var(--c-card); border:1px solid var(--c-border); border-radius:12px; box-shadow:var(--shadow-float); z-index:120; padding:8px; }
.search-panel .sp-hint { font-size:11px; color:var(--c-text-mute); padding:8px 10px; }
.search-panel .sp-item { display:flex; align-items:center; gap:8px; padding:9px 10px; border-radius:8px; cursor:pointer; }
.search-panel .sp-item:hover { background:var(--c-bg-soft); }
.search-panel .sp-item .sp-type { flex:none; font-size:10px; padding:2px 8px; border-radius:999px; background:var(--c-bg-soft); color:var(--c-text-sub); }
.search-panel .sp-item .sp-title { flex:1; min-width:0; font-size:13px; color:var(--c-text); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.search-panel .sp-item .sp-meta { flex:none; font-size:11px; color:var(--c-text-mute); }

/* ---------- 顶栏通知铃铛 ---------- */
.bell-wrap { position:relative; }
.bell-btn { position:relative; width:36px; height:36px; border:none; background:var(--c-bg-soft); border-radius:50%; font-size:16px; cursor:pointer; display:flex; align-items:center; justify-content:center; }
.bell-btn:hover { background:var(--c-hover); }
.theme-btn { width:36px; height:36px; border:1px solid var(--c-border); background:var(--c-card); border-radius:50%; font-size:16px; cursor:pointer; display:flex; align-items:center; justify-content:center; color:var(--c-text-sub); }
.theme-btn:hover { background:var(--c-hover); color:var(--c-text); }
.bell-dot { position:absolute; top:4px; right:4px; width:9px; height:9px; border-radius:50%; background:#ff3b30; border:2px solid #fff; }
.bell-panel { position:absolute; top:calc(100% + 8px); right:0; width:330px; max-height:440px; overflow-y:auto; background:var(--c-card); border:1px solid var(--c-border); border-radius:12px; box-shadow:var(--shadow-float); z-index:120; padding:8px; }
.bell-panel .bp-hd { display:flex; align-items:center; gap:8px; padding:8px 10px 10px; border-bottom:1px solid var(--c-border); font-size:13px; font-weight:600; }
.bell-panel .bp-hd .spacer { flex:1; }
.bell-panel .bp-hd button { border:none; background:transparent; color:var(--primary); font-size:12px; cursor:pointer; }
.bell-panel .bp-hd button:hover { text-decoration:underline; }
.bell-panel .bp-item { display:flex; gap:10px; padding:10px; border-bottom:1px dashed var(--c-border); cursor:pointer; align-items:flex-start; }
.bell-panel .bp-item:last-child { border-bottom:none; }
.bell-panel .bp-item:hover { background:var(--c-bg-soft); }
.bell-panel .bp-item .bp-ico { flex:none; width:26px; height:26px; border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:13px; background:var(--c-bg-soft); }
.bell-panel .bp-item.unread .bp-ico { background:var(--primary-bg); }
.bell-panel .bp-item.unread .bp-title { color:var(--primary); }
.bell-panel .bp-item .bp-main { flex:1; min-width:0; }
.bell-panel .bp-item .bp-title { font-size:13px; color:var(--c-text); font-weight:500; }
.bell-panel .bp-item .bp-body { font-size:12px; color:var(--c-text-mute); margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.bell-panel .bp-item .bp-time { font-size:10px; color:var(--c-text-mute); margin-top:3px; }
.bell-panel .bp-empty { text-align:center; color:var(--c-text-mute); font-size:12px; padding:26px 0; }

/* ---------- 布局 ---------- */
.body { display:flex; height:calc(100vh - 56px); }
.nav { width:184px; flex:none; background:var(--c-card); border-right:1px solid var(--c-border); padding:12px 10px 16px; display:flex; flex-direction:column; gap:2px; overflow-y:auto; }

/* ---------- 导航分组 ---------- */
.nav-group { font-size:10.5px; color:var(--c-text-mute); font-weight:600; letter-spacing:.06em; padding:12px 14px 4px; text-transform:uppercase; }
.nav-group:first-child { padding-top:2px; }
.nav-item { display:flex; align-items:center; gap:10px; border:none; background:transparent; border-radius:12px; padding:10px 14px; font-size:14px; color:var(--c-text-sub); text-align:left; transition:background .15s; }
.nav-item:hover { background:var(--c-bg-soft); }
.nav-item.active { background:var(--primary-bg); color:var(--primary); font-weight:600; }
/* 两条主线高亮：品牌渐变胶囊，一眼区分主线入口 */
.nav-item.nav-main { position:relative; font-weight:600; color:var(--c-text); }
.nav-item.nav-main .ico { width:20px; height:20px; color:var(--primary); }
.nav-item.nav-tts .ico { color:#af52de; }
.nav-item.nav-main:hover { background:var(--primary-bg); }
.nav-item.nav-rw.active { background:linear-gradient(135deg,var(--primary),#5ac8fa); color:#fff; box-shadow:0 4px 12px rgba(10,132,255,.35); }
.nav-item.nav-tts.active { background:linear-gradient(135deg,#af52de,#5ac8fa); color:#fff; box-shadow:0 4px 12px rgba(175,82,222,.35); }
.nav-item.nav-main.active .ico { color:#fff; }
.nav-item.nav-main.active .nav-kbd { color:rgba(255,255,255,.7); }
.main { flex:1; overflow-y:auto; padding:22px 26px 40px; }
.view { max-width:1080px; margin:0 auto; }

/* ---------- 通用卡片 ---------- */
.card { background:var(--c-card); border-radius:16px; padding:20px; box-shadow:var(--shadow-card); }
.card-title { font-size:15px; font-weight:600; margin-bottom:14px; display:flex; align-items:center; gap:8px; letter-spacing:-.01em; }
.muted { color:var(--c-text-mute); font-size:12px; }
.gray-bg { background:var(--c-bg-soft); }

/* ---------- 工作台首页 ---------- */
/* 两条主线流水线门面 */
.line-grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:20px; }
.line-card { border-radius:20px; padding:22px; position:relative; overflow:hidden; box-shadow:var(--shadow-card); border:1px solid var(--c-border); cursor:default; }
.line-card.rw { background:linear-gradient(150deg,#f0f7ff 0%,#ffffff 45%,#eaf4ff 100%); border-color:#d6e8fb; }
.line-card.tts { background:linear-gradient(150deg,#f6f0ff 0%,#ffffff 45%,#eef4ff 100%); border-color:#e3d9fb; }
.line-card .lc-top { display:flex; align-items:center; gap:12px; margin-bottom:6px; }
.line-card .lc-ico { width:44px; height:44px; border-radius:14px; display:flex; align-items:center; justify-content:center; color:#fff; font-size:20px; flex:none; box-shadow:0 4px 12px rgba(0,0,0,.14); }
.line-card.rw .lc-ico { background:linear-gradient(135deg,#0a84ff,#5ac8fa); }
.line-card.tts .lc-ico { background:linear-gradient(135deg,#af52de,#5ac8fa); }
.line-card .lc-title { font-size:18px; font-weight:700; letter-spacing:-.01em; color:var(--c-text); }
.line-card .lc-sub { font-size:12px; color:var(--c-text-sub); margin-top:2px; line-height:1.6; }
.line-card .lc-steps { display:flex; flex-direction:column; gap:8px; margin-top:16px; }
.line-step { display:flex; align-items:center; gap:10px; background:var(--c-card); border:1px solid var(--c-border); border-radius:12px; padding:10px 12px; transition:transform .15s var(--ease-fast), box-shadow .15s, border-color .15s; cursor:pointer; }
.line-step:hover { transform:translateX(3px); border-color:var(--primary); box-shadow:var(--shadow-card); }
.line-step .ls-num { width:22px; height:22px; border-radius:50%; background:var(--c-bg-soft); color:var(--c-text-sub); font-size:11px; font-weight:700; display:flex; align-items:center; justify-content:center; flex:none; }
.line-step .ls-ico { width:18px; height:18px; color:var(--c-text-sub); flex:none; }
.line-step .ls-t { font-size:13px; font-weight:600; color:var(--c-text); flex:none; }
.line-step .ls-d { font-size:11.5px; color:var(--c-text-mute); flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.line-step .ls-go { font-size:11px; color:var(--primary); flex:none; opacity:0; transition:opacity .15s; }
.line-step:hover .ls-go { opacity:1; }
.line-card .lc-cta { display:inline-flex; align-items:center; gap:8px; margin-top:16px; background:var(--primary); color:#fff; border:none; border-radius:11px; padding:10px 20px; font-size:14px; font-weight:600; box-shadow:0 2px 10px rgba(10,132,255,.3); transition:background .15s, transform .05s; cursor:pointer; }
.line-card .lc-cta:hover { background:var(--primary-dark); }
.line-card .lc-cta:active { transform:scale(.98); }
.line-card.tts .lc-cta { background:linear-gradient(135deg,#af52de,#7b5cf0); box-shadow:0 2px 10px rgba(123,92,240,.32); }
.line-card.tts .lc-cta:hover { filter:brightness(1.06); }
@media (max-width:900px) { .line-grid { grid-template-columns:1fr; } }
.sop-card { background:linear-gradient(135deg,#f5f9ff 0%,#ffffff 55%,#eef7ff 100%); border:1px solid #dce8f8; border-radius:18px; padding:20px 22px; margin-bottom:20px; box-shadow:var(--shadow-card); }
.sop-head { font-size:17px; font-weight:700; color:var(--c-text); letter-spacing:-.01em; }
.sop-sub { font-size:12px; color:#6e6e73; margin-top:4px; line-height:1.6; }
.sop-steps { display:grid; grid-template-columns:repeat(5,1fr); gap:12px; margin-top:18px; }
.sop-step { background:var(--c-card); border:1px solid var(--c-border); border-radius:14px; padding:15px; position:relative; box-shadow:var(--shadow-card); }
.sop-step::after { content:'→'; position:absolute; right:-11px; top:36px; color:#c7d4e4; font-size:16px; z-index:1; pointer-events:none; }
.sop-step:last-child::after { content:''; }
.sop-num { width:24px; height:24px; border-radius:50%; background:var(--primary); color:#fff; font-size:12px; font-weight:600; display:flex; align-items:center; justify-content:center; }
.sop-title { font-size:13px; font-weight:600; color:var(--c-text); margin-top:9px; }
.sop-desc { font-size:11px; color:var(--c-text-mute); margin-top:3px; line-height:1.55; min-height:32px; }
.sop-cta { margin-top:10px; font-size:12px; padding:5px 12px; border:1px solid var(--primary); color:var(--primary); background:var(--c-card); border-radius:9px; cursor:pointer; transition:background .15s; }
.sop-cta:hover { background:var(--primary-bg); }
.stat-grid { display:grid; grid-template-columns:repeat(5,1fr); gap:14px; margin-bottom:20px; }
.stat-card { background:var(--c-card); border-radius:16px; padding:18px; box-shadow:var(--shadow-card); }
.stat-card .num { font-size:28px; font-weight:700; color:var(--c-text); letter-spacing:-.02em; }
.stat-card .label { font-size:12px; color:var(--c-text-sub); margin-top:5px; }
.stat-card .num.green { color:#34c759; } .stat-card .num.blue { color:var(--primary); }
.stat-card .num.orange { color:#ff9500; } .stat-card .num.purple { color:#af52de; }
.stat-card .num.red { color:#ff453a; }
.home-grid { display:grid; grid-template-columns:1.6fr 1fr; gap:16px; }
.panel { background:var(--c-card); border-radius:16px; padding:18px; box-shadow:var(--shadow-card); }
.tl-item { display:flex; gap:10px; padding:9px 0; border-bottom:1px dashed var(--c-border); align-items:flex-start; }
.tl-item:last-child { border-bottom:none; }
.tl-ico { width:26px; height:26px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:13px; flex:none; }
.tl-ico.create { background:var(--primary-bg); } .tl-ico.adopt { background:#fdf6e3; }
.tl-ico.review { background:#f0f7ff; } .tl-ico.archive { background:var(--c-bg-soft); }
.tl-main { flex:1; min-width:0; }
.tl-title { font-size:13px; color:var(--c-text); }
.tl-detail { font-size:12px; color:var(--c-text-mute); margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.tl-time { font-size:11px; color:var(--c-text-mute); flex:none; }
.empty { text-align:center; color:var(--c-text-mute); padding:30px 0; font-size:13px; }
.expert-row { display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px dashed var(--c-border); }
.expert-row:last-child { border-bottom:none; }
.expert-row .avatar { width:28px; height:28px; border-radius:50%; color:#fff; font-size:13px; font-weight:600; display:flex; align-items:center; justify-content:center; flex:none; }
.expert-row .ename { font-size:13px; font-weight:600; }
.expert-row .einfo { font-size:11px; color:var(--c-text-mute); }
.expert-row .right { margin-left:auto; text-align:right; }
.insight-item { padding:8px 10px; border-bottom:1px dashed var(--c-border); font-size:13px; line-height:1.6; }
.insight-item:last-child { border-bottom:none; }
.insight-item .ih { color:var(--c-text); }
.insight-item .muted { font-size:11px; color:var(--c-text-mute); }
.insight-item .badge-st { font-size:11px; padding:1px 6px; border-radius:3px; margin-top:4px; display:inline-block; }

.pr-meta { display:flex; gap:8px; align-items:center; margin-top:4px; font-size:11px; color:var(--c-text-mute); }
.pr-hits { background:var(--primary-bg); color:var(--primary); border-radius:999px; padding:1px 8px; }
.pr-ver { background:var(--c-bg-soft); border-radius:999px; padding:1px 8px; color:var(--c-text-sub); }
.pr-date { color:var(--c-text-mute); }
.pr-stale-tip { color:#ff9500; font-size:11px; }
.insight-item.principle.stale .ih { color:var(--c-text-sub); }
.insight-item.principle { background:#fffbeb; border-left:3px solid #ff9500; border-radius:4px; margin-bottom:4px; padding:6px 10px; display:flex; align-items:center; gap:8px; font-size:12px; line-height:1.4; }
.insight-item.principle .ih { flex:1; min-width:0; word-break:break-word; color:var(--c-text); }

.adopt-icon { float:right; margin-left:8px; font-size:13px; color:var(--c-text-mute); cursor:pointer; border:none; background:transparent; padding:0; line-height:1; }

.toolbar { display:flex; gap:6px; padding:8px 12px; background:var(--c-bg-soft); border-top:1px solid var(--c-border); overflow-x:auto; }

/* ---------- 版本对比 ---------- */

/* ---------- 弹窗 ---------- */

.mon-table th { text-align:left; color:var(--c-text-mute); font-weight:500; padding:6px 8px; border-bottom:1px solid var(--c-border); font-size:12px; white-space:nowrap; }

/* ---------- 监控账号抽屉 ---------- */

.mon-drawer { position:fixed; top:0; right:0; bottom:0; width:min(420px, 92vw); background:var(--c-bg); border-left:1px solid var(--c-border); box-shadow:-8px 0 30px rgba(0,0,0,.18); z-index:2001; transform:translateX(100%); transition:transform .28s cubic-bezier(.4,0,.2,1); display:flex; flex-direction:column; }

/* ---------- 我的账号 ---------- */

/* ---------- 我的账号 · 提醒面板 ---------- */
.nav-badge { display:inline-block; min-width:16px; height:16px; line-height:16px; text-align:center; background:#ff3b30; color:#fff; font-size:10px; border-radius:8px; padding:0 4px; margin-left:4px; vertical-align:1px; font-weight:700; }

.mine-alert-badge { display:inline-block; background:#ff3b30; color:#fff; font-size:11px; border-radius:8px; padding:1px 8px; font-weight:600; margin-left:6px; vertical-align:1px; }
.mine-alert-list { display:flex; flex-direction:column; gap:6px; max-height:360px; overflow-y:auto; }
.mine-alert-item { display:flex; gap:10px; padding:8px 10px; border-radius:8px; border:1px solid var(--c-border); background:var(--c-card); transition:opacity .15s; }
.mine-alert-item.read { opacity:.55; }
.mine-alert-item.lv-hot { border-left:3px solid #ff3b30; }
.mine-alert-item.lv-info { border-left:3px solid #007aff; }
.mine-alert-icon { font-size:18px; flex:none; line-height:1.4; }
.mine-alert-body { flex:1; min-width:0; }
.mine-alert-title { font-weight:600; font-size:13px; display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
.mine-alert-acct { font-size:11px; color:var(--c-text-mute); font-weight:400; }
.mine-alert-detail { font-size:12px; color:var(--c-text-sub); margin-top:2px; line-height:1.4; word-break:break-all; }
.mine-alert-time { font-size:11px; color:var(--c-text-mute); margin-top:2px; }
.mine-dot { width:7px; height:7px; border-radius:50%; background:#ff3b30; flex:none; }
/* ---------- 配音工坊 ---------- */
.tts-controls { display:flex; gap:16px; flex-wrap:wrap; align-items:center; }
.tts-controls label { font-size:13px; display:flex; gap:6px; align-items:center; }

/* 左侧：微信聊天 */
.tts-chat { flex:1; display:flex; flex-direction:column; min-width:0; }
.tts-chat-hd { height:56px; flex:none; display:flex; align-items:center; gap:10px; padding:0 16px; background:var(--c-card); border-bottom:1px solid var(--c-border); }
.tts-chat-hd .tc-avatar { width:38px; height:38px; border-radius:8px; background:var(--c-bg-soft); display:flex; align-items:center; justify-content:center; font-size:20px; flex:none; }

.tts-chat-hd .tc-badge { font-size:10px; padding:1px 7px; border-radius:999px; background:#ecfdf5; color:#059669; }

.tts-chat-body { flex:1; overflow-y:auto; padding:16px 20px; background:var(--c-bg); }
.tts-queue { position:fixed; top:0; right:0; bottom:0; z-index:63; width:min(360px,92vw); display:flex; flex-direction:column; background:var(--c-card); border-left:1px solid var(--c-border); min-width:0; box-shadow:-8px 0 30px rgba(0,0,0,.16); transform:translateX(102%); transition:transform .26s cubic-bezier(.32,.72,0,1); }
.tts-queue.open { transform:translateX(0); }
.tts-queue-handle { position:fixed; top:58%; right:0; z-index:62; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:7px; padding:10px 7px; background:#5e5ce6; color:#fff; border-radius:10px 0 0 10px; box-shadow:-3px 0 12px rgba(0,0,0,.18); cursor:pointer; font-size:13px; font-weight:600; line-height:1; white-space:nowrap; }
.tts-queue-handle .tts-qh-txt { writing-mode:vertical-rl; text-orientation:upright; letter-spacing:.1em; }
.tts-queue.open ~ .tts-queue-handle { opacity:0; pointer-events:none; }
.tts-queue-mask { position:fixed; inset:0; z-index:61; background:var(--overlay); opacity:0; pointer-events:none; transition:opacity .22s ease; }
.tts-queue-mask.open { opacity:1; pointer-events:auto; }
.tts-queue-handle.dragging { cursor:grabbing; background:#4e4cc7; }
.tts-queue-hd { flex:none; display:flex; align-items:center; justify-content:space-between; gap:8px; padding:12px 14px; border-bottom:1px solid var(--c-border); }
.tts-queue-title { font-size:14px; font-weight:700; color:var(--c-text); }
.tts-queue-count { font-size:11px; color:var(--c-text-mute); font-weight:400; }
.tts-queue-controls { flex:none; padding:10px 10px 8px; border-bottom:1px solid var(--c-border); background:var(--c-bg-soft); }
.tts-queue-guide { margin-bottom:8px; padding:7px 8px; border:1px solid #ffb800; border-radius:6px; background:#fff8e6; color:#7a5b00; font-size:11px; line-height:1.4; }
.tts-queue-guide button { border:0; border-radius:5px; padding:3px 7px; margin-left:5px; background:#ff9500; color:#fff; cursor:pointer; font-size:11px; }
.tts-q-control-row { display:flex; align-items:center; gap:5px; margin-bottom:7px; font-size:12px; color:var(--c-text-sub); }
.tts-q-control-row:last-child { margin-bottom:0; }
.tts-q-control-row select { flex:1; min-width:0; border:1px solid var(--c-border); border-radius:6px; padding:5px 7px; background:var(--c-input); color:var(--c-text); font-size:12px; }
.tts-q-icon { display:inline-flex; align-items:center; justify-content:center; width:27px; height:27px; padding:5px; border:1px solid var(--c-border); border-radius:5px; background:var(--c-card); color:var(--c-text-sub); cursor:pointer; }
.tts-q-icon svg, .tts-q-action svg { width:14px; height:14px; fill:currentColor; }
.tts-q-action { display:inline-flex; align-items:center; gap:4px; border:1px solid var(--c-border); border-radius:6px; padding:5px 7px; background:var(--c-card); color:var(--c-text-sub); cursor:pointer; font-size:11px; white-space:nowrap; }
.tts-q-action:hover, .tts-q-icon:hover { color:var(--c-accent,#af52de); border-color:var(--c-accent,#af52de); }
.tts-q-action:disabled { opacity:.45; cursor:not-allowed; }
.tts-queue-tabs { display:flex; flex:none; border-bottom:1px solid var(--c-border); }
.tts-q-tab { flex:1; padding:9px 6px; border:0; background:transparent; color:var(--c-text-mute); font-size:12px; cursor:pointer; border-bottom:2px solid transparent; }
.tts-q-tab.active { color:var(--c-accent,#af52de); border-bottom-color:var(--c-accent,#af52de); font-weight:600; }
.tts-q-tab span { font-size:10px; margin-left:3px; }
.tts-queue-list { flex:1; overflow-y:auto; padding:8px; }
.tts-queue-empty { padding:24px 12px; text-align:center; color:var(--c-text-mute); font-size:12px; }
.tts-q-item { display:flex; gap:8px; align-items:flex-start; padding:9px 8px; border-bottom:1px solid var(--c-border); }
.tts-q-item:last-child { border-bottom:0; }
.tts-q-main { flex:1; min-width:0; }
.tts-q-text { color:var(--c-text); font-size:12px; line-height:1.45; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.tts-q-meta { margin-top:4px; display:flex; gap:6px; align-items:center; flex-wrap:wrap; font-size:11px; color:var(--c-text-mute); }

.tts-q-status.running { color:#af52de; }.tts-q-status.done { color:#16a34a; }.tts-q-status.failed { color:#ff3b30; }.tts-q-status.waiting { color:#d97706; }
.tts-q-actions { display:flex; gap:4px; margin-top:6px; }
.tts-q-actions button { border:1px solid var(--c-border); background:var(--c-bg-soft); color:var(--c-text-sub); border-radius:5px; padding:3px 6px; font-size:11px; cursor:pointer; }
.tts-q-actions button:hover { color:var(--c-accent,#af52de); border-color:var(--c-accent,#af52de); }
.tts-q-audio { display:block; width:100%; height:30px; margin-top:6px; }
.wc-row.tts-q-highlight { outline:2px solid var(--c-accent,#af52de); outline-offset:4px; transition:outline .15s; }
@media (max-width:860px) { .tts-queue { width:min(340px,92vw); } }

.tts-chat-voice { flex:none; display:flex; gap:8px; align-items:center; padding:8px 16px; background:var(--c-card); border-bottom:1px solid var(--c-border); }
.tts-chat-voice select { border:1px solid var(--c-border); border-radius:8px; padding:5px 8px; font-size:13px; background:var(--c-input); color:var(--c-text); }

/* 统一引导条（缺音色/Token 时提示） */
.tts-guide { flex:none; }
.tts-chat > .tts-guide { display:none !important; }

/* 「一键生成全部」按钮脉冲高亮：有缺失语音条时引导用户走主出口 */
@keyframes genAllPulse { 0%,100% { box-shadow:0 0 0 0 rgba(52,199,89,.55); } 50% { box-shadow:0 0 0 7px rgba(52,199,89,0); } }
.tts-genall-hint { animation:genAllPulse 1.6s ease-out infinite; }
.tts-genall-badge { display:inline-flex; align-items:center; justify-content:center; min-width:18px; height:18px; padding:0 5px; border-radius:9px; background:#ff3b30; color:#fff; font-size:11px; font-weight:700; margin-left:6px; }

/* 微信气泡 */
.wc-row { display:flex; gap:10px; margin-bottom:18px; align-items:flex-start; position:relative; }
/* 句间插入点：hover 该条消息时在行底部居中浮现「＋」，点击在该句之后新增一条 */
.wc-insert-hook { position:absolute; left:50%; bottom:-13px; transform:translateX(-50%); width:22px; height:22px; border-radius:50%; border:1px solid var(--c-border); background:var(--c-card); color:var(--c-text-sub); cursor:pointer; display:flex; align-items:center; justify-content:center; opacity:0; transition:opacity .12s; z-index:3; padding:0; box-shadow:0 1px 4px rgba(0,0,0,.12); }
.wc-row:hover .wc-insert-hook { opacity:1; }
.wc-insert-hook:hover { color:var(--c-accent,#af52de); border-color:var(--c-accent,#af52de); background:var(--c-bg-soft); }
.wc-row.me { flex-direction:row-reverse; }
.wc-ava { width:38px; height:38px; border-radius:6px; flex:none; display:flex; align-items:center; justify-content:center; font-size:18px; }
.wc-va.agent { background:rgba(139,92,246,.15); }
.wc-va.me { background:rgba(7,193,96,.15); }
.wc-col { max-width:78%; min-width:0; display:flex; flex-direction:column; gap:4px; }
.wc-row.me .wc-col { align-items:flex-end; }
/* 气泡横向 + 音频操作按钮在气泡右侧（竖排） */
.wc-main { display:flex; flex-direction:row; gap:6px; align-items:center; width:100%; }
.wc-row.me .wc-main { flex-direction:row-reverse; }
.wc-main .wc-bub { flex:1 1 auto; min-width:0; }
.wc-va-ops { display:flex; flex-direction:column; gap:4px; align-items:flex-start; flex:none; opacity:0; visibility:hidden; pointer-events:none; transition:opacity .14s ease, visibility .14s ease; }
.wc-row:hover .wc-va-ops, .wc-row:focus-within .wc-va-ops { opacity:1; visibility:visible; pointer-events:auto; }
.wc-bub { padding:9px 14px; border-radius:6px; font-size:14px; line-height:1.55; position:relative; word-break:break-word; white-space:pre-wrap; box-shadow:0 1px 1px rgba(0,0,0,.04); }
.wc-row.agent .wc-bub { background:var(--c-card); border:1px solid var(--c-border); }
.wc-row.agent .wc-bub::after { content:''; position:absolute; left:-6px; top:13px; border:6px solid transparent; border-right-color:var(--c-card); }
.wc-row.agent .wc-bub::before { content:''; position:absolute; left:-7px; top:12px; border:7px solid transparent; border-right-color:var(--c-border); }
.wc-row.me .wc-bub { background:#95EC69; color:#1a1a1a; }
html[data-theme="dark"] .wc-row.me .wc-bub { background:#2b5e3a; color:#e6e8eb; }
.wc-row.me .wc-bub::after { content:''; position:absolute; right:-6px; top:13px; border:6px solid transparent; border-left-color:#95EC69; }
html[data-theme="dark"] .wc-row.me .wc-bub::after { border-left-color:#2b5e3a; }
/* 气泡可点击直接编辑 */
.wc-bub { cursor:text; }
.wc-bub .wc-edit-hint { position:absolute; top:6px; right:8px; opacity:0; transition:opacity .12s; color:var(--c-text-sub); pointer-events:none; }
.wc-bub:hover .wc-edit-hint { opacity:.75; }
.wc-bub.editing { outline:1.5px solid var(--c-accent,#af52de); outline-offset:1px; background:var(--c-bg-soft); cursor:text; }
.wc-row.me .wc-bub.editing { background:#8ee37a; }
html[data-theme="dark"] .wc-row.me .wc-bub.editing { background:#2f6b45; }
.wc-bub.editing::before, .wc-bub.editing::after { opacity:0; }
.wc-edit-bar { display:flex; align-items:center; gap:4px; margin-top:6px; }
.wc-edit-bar .wc-op { font-size:11px; padding:2px 8px; }

.wc-ops { display:flex; gap:4px; flex-direction:row; align-items:center; flex-wrap:wrap; flex:none; opacity:0; visibility:hidden; pointer-events:none; transition:opacity .14s ease, visibility .14s ease; }
.wc-row:hover .wc-ops, .wc-row:focus-within .wc-ops { opacity:1; visibility:visible; pointer-events:auto; }
.wc-op { font-size:11px; padding:3px 9px; border-radius:6px; border:1px solid var(--c-border); background:var(--c-card); color:var(--c-text-sub); cursor:pointer; white-space:nowrap; }
.wc-op:hover { background:var(--c-bg-soft); color:var(--c-text); }
.wc-op.wc-op-main { border-color:var(--c-accent, #af52de); color:var(--c-accent, #af52de); font-weight:600; }
.wc-audio { display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin-top:2px; }
@keyframes wcspin { to { transform:rotate(360deg); } }
/* 配音合成进度条（2 分钟自动放弃，按已等待秒数推进） */
.wc-gen-progress { flex-basis:100%; height:5px; background:var(--c-bg-soft); border-radius:3px; overflow:hidden; margin-top:2px; }
.wc-gen-progress .wc-gen-fill { height:100%; background:var(--c-accent, #af52de); width:0; border-radius:3px; transition:width .4s ease; }
/* 微信语音条 */
.wc-voice { display:inline-flex; align-items:center; gap:8px; padding:7px 12px; border-radius:6px; background:#95EC69; color:#1a1a1a; cursor:pointer; user-select:none; position:relative; }
html[data-theme="dark"] .wc-voice { background:#2b5e3a; color:#e6e8eb; }
.wc-voice::after { content:''; position:absolute; left:-6px; top:12px; border:6px solid transparent; border-right-color:#95EC69; }
html[data-theme="dark"] .wc-voice::after { border-right-color:#2b5e3a; }
.wc-voice .wc-voice-ico { width:16px; height:16px; flex:none; display:flex; align-items:center; justify-content:center; }
.wc-voice .wc-voice-bar { display:flex; align-items:center; gap:2px; height:20px; }
.wc-voice .wc-voice-bar i { width:3px; background:currentColor; border-radius:1px; opacity:.7; }
.wc-voice .wc-voice-dur { font-size:12px; font-weight:600; }
.wc-voice .wc-voice-dl { color:currentColor; opacity:.55; text-decoration:none; margin-left:2px; }
.wc-voice .wc-voice-dl:hover { opacity:1; }
.wc-voice.playing .wc-voice-bar i { animation:wcbar 0.9s ease-in-out infinite; }
@keyframes wcbar { 0%,100% { transform:scaleY(0.4); } 50% { transform:scaleY(1); } }
.wc-time { text-align:center; font-size:11px; color:var(--c-text-mute); margin:16px 0; }
.wc-divider { text-align:center; font-size:11px; color:var(--c-text-mute); margin:8px 0; }

.wc-empty { display:flex; flex-direction:column; align-items:center; justify-content:center; height:100%; gap:14px; }
.wc-empty .wc-emoji { font-size:52px; opacity:.35; }
.wc-empty .wc-title { font-size:15px; color:var(--c-text-sub); font-weight:600; }
.wc-empty .wc-hint { font-size:13px; color:var(--c-text-mute); text-align:center; line-height:1.6; max-width:280px; }
.wc-empty .wc-steps { display:flex; gap:8px; margin-top:4px; }
.wc-empty .wc-step { font-size:12px; padding:5px 12px; border-radius:999px; background:var(--c-bg-soft); color:var(--c-text-sub); }

.tts-chat-input { flex:none; display:flex; gap:8px; align-items:center; padding:10px 16px; background:var(--c-card); border-top:1px solid var(--c-border); }
.tts-chat-input input { flex:1; border:1px solid var(--c-border); border-radius:8px; padding:9px 14px; font-size:14px; background:var(--c-input); color:var(--c-text); }
.tts-chat-input input:disabled { opacity:.5; }
.tts-chat-count { flex:none; display:flex; gap:10px; align-items:center; padding:4px 16px 8px; background:var(--c-card); font-size:12px; color:var(--c-text-sub); }
.tts-chat-count .tts-count-num { color:var(--c-accent,#af52de); font-weight:600; }

/* 右侧：工具抽屉（弹窗式，默认隐藏，点「工具」按钮从右滑出） */
.tts-drawer-mask { position:fixed; inset:0; background:var(--overlay); z-index:60; opacity:0; pointer-events:none; transition:opacity .22s ease; }
.tts-drawer-mask.open { opacity:1; pointer-events:auto; }
.tts-side { position:fixed; top:0; right:0; bottom:0; width:min(420px,92vw); z-index:61; display:flex; flex-direction:column; background:var(--c-card); border-left:1px solid var(--c-border); box-shadow:-8px 0 30px rgba(0,0,0,.15); transform:translateX(100%); transition:transform .25s ease; }
.tts-side.open { transform:translateX(0); }
.tts-side-hd { flex:none; display:flex; align-items:center; justify-content:space-between; padding:12px 14px; border-bottom:1px solid var(--c-border); }
.tts-side-title { font-size:14px; font-weight:700; color:var(--c-text); }
.tts-side-close { border:none; background:var(--c-bg-soft); color:var(--c-text-sub); width:26px; height:26px; border-radius:6px; cursor:pointer; font-size:14px; line-height:1; }
.tts-side-close:hover { background:var(--c-border); color:var(--c-text); }

/* 求测者经历·抽拉式档案（hover 把手滑出 / 点遮罩·✕·Esc·再点把手 对称滑回，对标成熟抽屉三要素） */
.tts-profile-mask { position:fixed; inset:0; background:var(--overlay); z-index:62; opacity:0; pointer-events:none; transition:opacity .22s ease; }
.tts-profile-mask.open { opacity:1; pointer-events:auto; }
.tts-profile-wrap { position:fixed; top:66vh; right:0; z-index:64; display:flex; align-items:stretch; user-select:none; }
.tts-profile-handle { flex:none; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; padding:10px 7px; background:linear-gradient(180deg,#ff9500,#ff9500); color:#fff; cursor:grab; border-radius:10px 0 0 10px; box-shadow:-3px 0 12px rgba(0,0,0,.18); font-size:13px; font-weight:600; letter-spacing:0; line-height:1; white-space:nowrap; transition:opacity .18s ease; touch-action:none; }
.tts-profile-handle .ph-txt { writing-mode:vertical-rl; text-orientation:upright; letter-spacing:0.12em; }
.tts-profile-handle.dragging { cursor:grabbing; background:linear-gradient(180deg,#ff9500,#e88600); }
.tts-profile-handle .ph-ico { display:flex; align-items:center; font-size:15px; line-height:1; }
/* 面板固定在右侧，靠 transform 滑入/滑出（与 .tts-side 工具抽屉同模型，动画对称丝滑） */
.tts-profile-panel { position:fixed; top:0; right:0; bottom:0; height:100vh; width:min(420px,92vw); overflow:hidden; background:var(--c-card); border-left:1px solid var(--c-border); box-shadow:-8px 0 30px rgba(0,0,0,.15); transform:translateX(102%); transition:transform .26s cubic-bezier(.32,.72,0,1); display:flex; flex-direction:column; z-index:63; }
.tts-profile-panel.open { transform:translateX(0); }
/* 打开时把手淡出（面板自身有 ✕ 关闭锚点），收起后把手重新浮现 */
.tts-profile-wrap.is-open .tts-profile-handle { opacity:0; pointer-events:none; }
.tts-profile-body { flex:1; overflow-y:auto; padding:14px; }
.tts-profile-panel-inner { display:flex; flex-direction:column; height:100%; }
.tts-tabs { display:flex; border-bottom:1px solid var(--c-border); flex:none; }
.tts-tab { flex:1; padding:11px 0; border:none; background:transparent; font-size:13px; color:var(--c-text-mute); border-bottom:2px solid transparent; cursor:pointer; transition:all .15s; }
.tts-tab:hover { color:var(--c-text-sub); }
.tts-tab.active { color:var(--primary); border-bottom-color:var(--primary); font-weight:600; }
.tts-pane { display:none; overflow-y:auto; flex:1; padding:14px; }
.tts-pane.active { display:block; }

/* 侧栏内的折叠区块 */
.tts-sec { margin-bottom:16px; }
.tts-sec-hd { font-size:13px; font-weight:600; color:var(--c-text); margin-bottom:8px; display:flex; align-items:center; gap:6px; }
.tts-sec-desc { font-size:12px; color:var(--c-text-mute); margin-bottom:8px; line-height:1.45; }
.tts-sec-hd .tts-sec-toggle { margin-left:auto; font-size:11px; color:var(--c-text-mute); cursor:pointer; font-weight:400; }
.tts-collapse-body { overflow:hidden; }
.tts-collapse.collapsed .tts-collapse-body { display:none; }
.tts-collapse .tts-sec-hd { cursor:pointer; user-select:none; }
.tts-collapse.collapsed .tts-sec-toggle::before { content:'▶ '; }
.tts-collapse:not(.collapsed) .tts-sec-toggle::before { content:'▼ '; }

/* 对话气泡式发言人编辑（复刻微信 PC 端） */
.tts-seg-wrap { display:flex; margin-bottom:12px; align-items:flex-start; position:relative; }
.tts-seg-wrap.is-b { justify-content:flex-start; }
.tts-seg-wrap.is-a { justify-content:flex-end; }
.tts-seg-bubble { position:relative; max-width:72%; display:flex; flex-direction:column; padding:9px 13px; border-radius:6px; font-size:14px; line-height:1.55; word-break:break-word; box-shadow:0 1px 2px rgba(0,0,0,.03); }
/* 微信 PC 亮色：对方白底、自己微信绿 */
.tts-seg-wrap.is-b .tts-seg-bubble { background:#ffffff; border:1px solid #e5e5ea; border-top-left-radius:3px; }
.tts-seg-wrap.is-a .tts-seg-bubble { background:#95ec69; border:1px solid #8ade5c; border-top-right-radius:3px; text-align:left; color:#1d1d1f; }
/* 气泡尖角（靠头像一侧） */
.tts-seg-wrap.is-b .tts-seg-bubble::after { content:''; position:absolute; top:9px; left:-5px; width:0; height:0; border-top:5px solid transparent; border-bottom:5px solid transparent; border-right:6px solid #ffffff; }
.tts-seg-wrap.is-a .tts-seg-bubble::after { content:''; position:absolute; top:9px; right:-5px; width:0; height:0; border-top:5px solid transparent; border-bottom:5px solid transparent; border-left:6px solid #95ec69; }
.tts-seg-wrap .seg-speaker-tag { display:none; }
.seg-avatar { width:34px; height:34px; border-radius:4px; flex:none; display:flex; align-items:center; justify-content:center; font-size:19px; margin-top:0; }
.seg-avatar-b { background:#e9e9ec; margin-right:9px; }
.seg-avatar-a { background:#a9e75f; margin-left:9px; }
.tts-seg-bubble [contenteditable] { outline:none; min-height:20px; border-radius:3px; padding:0; }
.tts-seg-bubble [contenteditable]:hover { background:rgba(0,0,0,0.03); }
.tts-seg-bubble [contenteditable]:focus { background:rgba(0,0,0,0.05); }
/* 操作按钮：默认隐藏，鼠标悬停气泡时浮现在气泡上方 */
.tts-seg-ops { display:flex; gap:3px; position:absolute; top:-24px; opacity:0; visibility:hidden; transition:opacity .12s, visibility .12s; pointer-events:none; z-index:3; }
.tts-seg-wrap.is-b .tts-seg-ops { left:0; }
.tts-seg-wrap.is-a .tts-seg-ops { right:0; }
.tts-seg-wrap:hover .tts-seg-ops { opacity:1; visibility:visible; pointer-events:auto; }
.tts-seg-ops button { font-size:11px; padding:2px 8px; border-radius:4px; border:1px solid var(--c-border); background:var(--c-card); color:var(--c-text-sub); cursor:pointer; box-shadow:0 2px 8px rgba(0,0,0,.12); white-space:nowrap; }
.tts-seg-ops button:hover { color:var(--c-text); border-color:var(--c-text-sub); }
.tts-seg-ops button.seg-switch-a { color:#0a84ff; border-color:#8ec5ff; }
.tts-seg-ops button.seg-switch-b { color:#0a84ff; border-color:#8ec5ff; }
.tts-seg-ops button.seg-del { color:#ff3b30; border-color:#ffb3ab; }

/* 微信暗黑模式：对方深灰、自己深绿 */
html[data-theme="dark"] .tts-seg-wrap.is-b .tts-seg-bubble { background:#2c2c2e; border:1px solid #3a3a3c; color:#e8e8ea; }
html[data-theme="dark"] .tts-seg-wrap.is-a .tts-seg-bubble { background:#3c5c33; border:1px solid #4a6f3e; color:#eef5ea; }
html[data-theme="dark"] .tts-seg-wrap.is-b .tts-seg-bubble::after { border-right-color:#2c2c2e; }
html[data-theme="dark"] .tts-seg-wrap.is-a .tts-seg-bubble::after { border-left-color:#3c5c33; }
html[data-theme="dark"] .seg-avatar-b { background:#2c2c2e; }
html[data-theme="dark"] .seg-avatar-a { background:#3c5c33; }

/* 微信 PC 端风格对话编辑弹窗 */
.spk-dialog { background:var(--c-card); width:min(94%,760px); height:min(86vh,760px); border-radius:14px; display:flex; flex-direction:column; overflow:hidden; box-shadow:0 16px 60px rgba(0,0,0,.28); animation:pop .16s ease; }
.spk-hd { display:flex; align-items:center; justify-content:space-between; padding:14px 18px; border-bottom:1px solid var(--c-border); flex:none; }
.spk-title { font-size:16px; font-weight:700; }
.spk-close { border:none; background:none; font-size:20px; color:var(--c-text-sub); cursor:pointer; padding:2px 8px; border-radius:6px; }
.spk-close:hover { background:var(--c-bg-soft); color:var(--c-text); }
.spk-sub { padding:10px 18px; font-size:12.5px; color:var(--c-text-sub); border-bottom:1px solid var(--c-border); line-height:1.6; flex:none; background:var(--c-bg-soft); }
.spk-body { flex:1; overflow-y:auto; padding:18px; background:var(--c-bg); }
.spk-ft { padding:12px 18px; border-top:1px solid var(--c-border); display:flex; flex:none; background:var(--c-card); }

/* 紧凑型求测者经历 */
.tts-vp-compact { padding:10px; border:1px solid var(--c-border); border-radius:8px; background:var(--c-bg-soft); }
.tts-vp-compact .vp-row { margin-bottom:6px; }
.tts-vp-compact .vp-label { font-size:11px; font-weight:600; color:var(--c-text-sub); margin-bottom:2px; }
.tts-vp-compact .vp-value { font-size:13px; color:var(--c-text); }
.tts-vp-compact .vp-list { font-size:13px; color:var(--c-text); padding-left:14px; margin:0; }
.tts-vp-compact .vp-list li { margin-bottom:2px; }

/* 经历时间线：一年一行 */
.vp-tl { display:flex; flex-direction:column; gap:0; }
.vp-tl-row { display:flex; align-items:flex-start; gap:8px; padding:5px 0; position:relative; }
.vp-tl-row:not(:last-child)::before { content:''; position:absolute; left:45px; top:20px; bottom:-8px; width:2px; background:var(--c-border); }
.vp-tl-year { flex:0 0 44px; text-align:right; font-size:12px; font-weight:700; color:var(--primary); line-height:1.6; }
.vp-tl-dot { flex:none; width:8px; height:8px; border-radius:50%; background:var(--primary); margin-top:6px; position:relative; z-index:1; }
.vp-tl-body { flex:1; min-width:0; display:flex; align-items:flex-start; gap:4px; }
.vp-tl-text { flex:1; min-width:0; font-size:13px; color:var(--c-text); line-height:1.5; padding:2px 6px; border-radius:4px; min-height:20px; border:1px solid transparent; }
.vp-tl-text:hover { border-color:var(--c-border); }
.vp-tl-text:focus { outline:none; border-color:var(--primary); background:var(--c-card); }
.vp-tl-del { flex:none; font-size:12px; color:var(--c-text-mute); border:none; background:transparent; cursor:pointer; padding:1px 4px; opacity:0; transition:opacity .12s; }
.vp-tl-row:hover .vp-tl-del { opacity:1; }
.vp-tl-del:hover { color:#ff3b30; }

/* ---------- 洗稿工坊 ---------- */
.rw-head { display:flex; align-items:center; gap:12px; margin-bottom:14px; flex-wrap:wrap; }
.rw-head .t { font-size:18px; font-weight:700; }
.rw-head .sub { color:var(--c-text-mute); font-size:12px; }
/* 爆款素材库面板 */
.rw-mat { background:var(--c-card); border:1px solid var(--c-border); border-radius:12px; padding:12px 14px; margin-bottom:14px; }
.rw-mat-hd { display:flex; align-items:center; gap:8px; font-size:13px; font-weight:600; cursor:pointer; user-select:none; }
.rw-mat-hd .cnt { font-size:11px; color:var(--c-text-mute); font-weight:400; }
.rw-mat-hd .chev { margin-left:auto; color:var(--c-text-mute); transition:transform .2s; }
.rw-mat-hd .chev.open { transform:rotate(180deg); }
.rw-mat-bd { display:none; margin-top:10px; }
.rw-mat.open .rw-mat-bd { display:block; }
.rw-mat-list { display:flex; flex-direction:column; gap:8px; max-height:320px; overflow-y:auto; }
.rw-mat-item { display:flex; align-items:center; gap:10px; padding:10px 12px; border:1px solid var(--c-border); border-radius:10px; background:var(--c-bg-soft); }
.rw-mat-item .desc { flex:1; font-size:12px; color:var(--c-text); line-height:1.5; overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
.rw-mat-item .metrics { font-size:11px; color:var(--c-text-mute); white-space:nowrap; flex:none; }
.rw-mat-item .go { flex:none; font-size:11px; border-radius:6px; padding:4px 12px; border:1px solid var(--primary); background:var(--primary-bg); color:var(--primary); cursor:pointer; }
.rw-mat-item .go:hover { background:var(--primary); color:#fff; }
.rw-grid { display:grid; grid-template-columns:300px 1fr; gap:14px; align-items:start; }
.rw-list { display:flex; flex-direction:column; gap:10px; max-height:calc(100vh - 220px); overflow-y:auto; }
.rw-item { background:var(--c-card); border-radius:10px; padding:12px 14px; border:1px solid var(--c-border); cursor:pointer; }
.rw-item:hover { border-color:var(--primary); }
.rw-item.active { border-color:var(--primary); background:#f0fbf4; }
.rw-item .t { font-weight:600; font-size:13px; margin-bottom:4px; display:flex; align-items:center; gap:6px; }
.rw-item .meta { font-size:11px; color:var(--c-text-mute); display:flex; gap:8px; flex-wrap:wrap; }
.rw-item .rw-ops { display:flex; gap:6px; margin-top:8px; opacity:0; transition:opacity .15s; }
.rw-item:hover .rw-ops { opacity:1; }
.rw-item .rw-ops button { font-size:11px; border-radius:6px; padding:3px 9px; border:1px solid var(--c-border); background:var(--c-card); color:var(--c-text-sub); }
.rw-item .rw-ops button:hover { background:var(--primary-bg); color:var(--primary); border-color:var(--primary); }
.rw-item .rw-ops button.del:hover { background:#ffebea; color:#ff3b30; border-color:#ff3b30; }
/* 胜率曲线弹窗 */
.df-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:10px 0; }
.df-col { border:1px solid #eef0f3; border-radius:10px; overflow:hidden; }
.df-col-hd { background:var(--c-bg-soft); font-size:12px; font-weight:600; padding:8px 12px; border-bottom:1px solid #eef0f3; }
.df-body { max-height:46vh; overflow:auto; padding:8px 12px; font-size:13px; line-height:1.8; }
.df-same { padding:2px 0; color:var(--c-text); }
.df-add { background:#dff5e7; color:#0e6b37; padding:2px 6px; border-radius:4px; margin:2px 0; }
.df-del { background:#ffebea; color:#b91c1c; text-decoration:line-through; padding:2px 6px; border-radius:4px; margin:2px 0; }
.df-tag { display:inline-block; font-size:11px; border-radius:999px; padding:2px 10px; margin-right:6px; }
.df-tag.del { background:#ffebea; color:#b91c1c; }
.df-tag.add { background:var(--primary-bg); color:var(--primary); }
.df-tag.same { background:var(--c-bg-soft); color:var(--c-text-sub); }
.wr-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:10px; }
.wr-card { border:1px solid #eef0f3; border-radius:10px; padding:10px 12px; background:var(--c-bg-soft); }
.wr-card .wr-hd { display:flex; align-items:center; gap:8px; flex-wrap:wrap; font-size:12px; }
.wr-card .wr-cur { font-size:11px; color:var(--c-text-sub); background:var(--c-card); border:1px solid var(--c-border); border-radius:999px; padding:1px 8px; }
.wr-card .wr-rate { margin-left:auto; font-size:11px; color:var(--c-text-sub); }
.wr-card .wr-empty { font-size:12px; color:var(--c-text-mute); padding:18px 4px; text-align:center; }
.wr-bars { display:flex; align-items:flex-end; gap:5px; height:64px; margin-top:10px; }
.wr-bar { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%; gap:2px; }
.wr-bv { width:100%; min-width:8px; border-radius:4px 4px 0 0; background:#d8e2ea; }
.wr-bv.w { background:var(--primary); }
.wr-bv.l { background:#f2b8c0; }
.wr-bt { font-size:9px; color:var(--c-text-mute); }
.wr-legend { font-size:10px; color:var(--c-text-mute); margin-top:6px; text-align:center; }
.wr-evlist { display:flex; flex-direction:column; gap:6px; margin-top:8px; max-height:220px; overflow:auto; }
.wr-ev { font-size:12px; color:var(--c-text-sub); background:var(--c-bg-soft); border-radius:8px; padding:6px 10px; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.wr-ev .muted { margin-left:auto; }
.wr-ev-tag { font-size:10px; border-radius:4px; padding:1px 6px; flex:none; }
.wr-ev-tag.keep { background:var(--primary-bg); color:var(--primary); }
.wr-ev-tag.rep { background:#ffebea; color:#ff3b30; }

.badge { font-size:10px; padding:2px 8px; border-radius:999px; background:#eef; color:#55a; }
.badge.ok { background:var(--primary-bg); color:var(--primary); }
.badge.warn { background:#fdf3e7; color:#ff9500; }
.badge.busy { background:#ffebea; color:#ff3b30; }
.rw-detail { background:var(--c-card); border-radius:12px; padding:16px 18px; box-shadow:0 1px 3px rgba(0,0,0,.05); }
.rw-orig { background:var(--c-bg-soft); border:1px dashed var(--c-border); border-radius:10px; padding:12px 14px; font-size:13px; line-height:1.8; white-space:pre-wrap; max-height:220px; overflow-y:auto; }
.rw-metrics { display:flex; gap:10px; flex-wrap:wrap; margin:10px 0; }
.rw-metric { background:var(--c-bg-soft); border-radius:8px; padding:6px 12px; font-size:12px; }
.rw-metric b { color:var(--primary); font-size:14px; margin-left:4px; }
.rw-stream { display:flex; flex-direction:column; gap:10px; margin-top:14px; }
.rw-msg { border:1px solid var(--c-border); border-left:4px solid #ccc; border-radius:10px; padding:10px 14px; font-size:13px; line-height:1.75; }
.rw-msg.phase { border-left-color:var(--primary); background:#f0fbf4; font-weight:600; color:#0a7a3d; }
.rw-msg.skeleton { border-left-color:#b45309; background:#fdf8f0; }
.rw-msg.analysis { border-left-color:#007aff; }
.rw-msg.part { border-left-color:#af52de; background:#faf7fd; }
.rw-msg.review { border-left-color:#af52de; background:#f5effb; }
.rw-msg.record { border-left-color:#0e7490; background:#f0fbfd; }
.rw-msg.evaluate { border-left-color:#ff3b30; background:#fdf2f5; }
.rw-msg .h { font-weight:600; margin-bottom:4px; display:flex; align-items:center; gap:8px; }
.rw-msg .h .tag { font-size:10px; padding:1px 8px; border-radius:999px; background:var(--c-bg-soft); color:var(--c-text-sub); font-weight:400; }
.rw-msg .txt { white-space:pre-wrap; }
.rw-msg .ts { font-size:10px; color:var(--c-text-mute); margin-left:auto; }
.rw-typing { color:var(--c-text-mute); font-size:12px; padding:4px 2px; }
.rw-parts { display:flex; flex-direction:column; gap:12px; margin-top:14px; }
.rw-fulltext { margin-top:0; padding:24px 28px; background:var(--c-card); border:1px solid var(--c-border); border-radius:12px; min-height:280px; flex:1; font-size:16px; line-height:2; color:var(--c-text); overflow-y:auto; }
.rw-para { position:relative; margin:0; padding:0; }
.rw-s-line { position:relative; display:inline; padding:0; border-radius:0; cursor:text; }
.rw-s-line:hover { text-decoration:underline; text-decoration-thickness:2px; text-decoration-color:var(--c-text-sub); text-underline-offset:4px; }
.rw-s-line strong { font-weight:700; color:var(--c-text); background:linear-gradient(transparent 60%, rgba(255, 193, 7, .35) 60%); }
.rw-s-line .rw-s-act { position:absolute; right:-24px; top:-4px; opacity:0; transition:opacity .12s; z-index:2; }
.rw-s-line:hover .rw-s-act { opacity:1; }
.rw-s-line .rw-s-act button { font-size:11px; border-radius:6px; padding:2px 7px; border:1px solid var(--c-border); background:var(--c-card); color:var(--c-text-sub); cursor:pointer; box-shadow:0 1px 3px rgba(0,0,0,.08); }
.rw-s-line .rw-s-act button:hover { background:var(--primary-bg); color:var(--primary); border-color:var(--primary); }
.rw-s-line.rw-s-pending { opacity:.7; background:rgba(255,193,7,.12); outline:1px dashed #f59e0b; outline-offset:1px; }
.rw-hd-row { display:flex; align-items:center; gap:10px; margin-bottom:8px; }
.rw-hd-left { display:flex; align-items:center; gap:10px; min-width:0; }
.rw-hd-summary { display:flex; align-items:center; gap:10px; margin-bottom:10px; flex-wrap:wrap; }
.rw-hd-summary .rw-hd-title { font-size:16px; font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:60%; }
.rw-hd-toggle { font-size:12px; padding:4px 10px; border-radius:8px; margin-left:auto; }
.rw-hd-detail { background:var(--c-bg-soft); border:1px solid var(--c-border); border-radius:12px; padding:12px 14px; margin-bottom:12px; }

/* ---------- SF Symbols 风格图标库 ---------- */
.ico { width:18px; height:18px; flex:none; display:inline-block; vertical-align:-4px; }
.ico svg { width:100%; height:100%; display:block; }
.nav-item .ico { width:18px; height:18px; }
.btn-ico { width:16px; height:16px; display:inline-block; vertical-align:-3px; margin-right:4px; }
.btn-ico svg { width:100%; height:100%; display:block; }

/* ---------- 无障碍：尊重系统「减少动态效果」 ---------- */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration:.001s !important; animation-iteration-count:1 !important; transition-duration:.001s !important; }
}

/* ---------- 退出动画（与进入动画对称） ---------- */
@keyframes popOut { from { transform:scale(1); opacity:1; } to { transform:scale(.96); opacity:0; } }
@keyframes slideOutRight { from { transform:translateX(0); opacity:1; } to { transform:translateX(60px); opacity:0; } }
@keyframes fadeOut { from { opacity:1; } to { opacity:0; } }
.modal-mask.closing { animation:fadeOut .15s var(--ease-fast) forwards; }
.modal-mask.closing .modal-box { animation:popOut .15s var(--ease-fast) forwards; }
.drawer.closing { animation:slideOutRight .18s var(--ease-mid) forwards; }
.drawer-mask.closing { animation:fadeOut .18s var(--ease-mid) forwards; }

/* ---------- 骨架屏 ---------- */
.skel { position:relative; overflow:hidden; background:var(--c-bg-soft); border-radius:8px; }
.skel::after { content:''; position:absolute; inset:0; transform:translateX(-100%);
  background:linear-gradient(90deg, transparent, rgba(255,255,255,.45), transparent);
  animation:skelShimmer 1.4s infinite; }
html[data-theme="dark"] .skel::after { background:linear-gradient(90deg, transparent, rgba(255,255,255,.08), transparent); }
@keyframes skelShimmer { 100% { transform:translateX(100%); } }
.skel-line { height:12px; margin:8px 0; border-radius:6px; }
.skel-line.w60 { width:60%; } .skel-line.w40 { width:40%; } .skel-line.w80 { width:80%; }
.skel-card { padding:16px; }
.skel-card .skel-title { height:16px; width:55%; border-radius:6px; margin-bottom:14px; }

/* ---------- 命令面板 ⌘K ---------- */
.cmd-mask { position:fixed; inset:0; background:var(--overlay); z-index:200; display:flex; align-items:flex-start; justify-content:center; padding-top:12vh; animation:fadeIn .18s var(--ease-fast); }
.cmd-mask.closing { animation:fadeOut .15s var(--ease-fast) forwards; }
@keyframes fadeIn { from { opacity:0; } to { opacity:1; } }
.cmd-panel { width:min(92%,560px); background:var(--c-card); border-radius:16px; box-shadow:var(--shadow-float); overflow:hidden; animation:pop .16s ease; }
.cmd-input { display:flex; align-items:center; gap:10px; padding:14px 16px; border-bottom:1px solid var(--c-border); }
.cmd-input .ico { width:18px; height:18px; color:var(--c-text-mute); }
.cmd-input input { flex:1; border:none; background:transparent; font-size:15px; color:var(--c-text); outline:none; }
.cmd-list { max-height:52vh; overflow-y:auto; padding:6px; }
.cmd-group { font-size:11px; color:var(--c-text-mute); padding:8px 10px 4px; letter-spacing:.5px; }
.cmd-item { display:flex; align-items:center; gap:12px; padding:10px 12px; border-radius:10px; cursor:pointer; font-size:14px; color:var(--c-text); }
.cmd-item .ico { width:17px; height:17px; color:var(--c-text-sub); flex:none; }
.cmd-item .ci-label { flex:1; }
.cmd-item .ci-hint { font-size:12px; color:var(--c-text-mute); }
.cmd-item.sel { background:var(--primary-bg); color:var(--primary); }
.cmd-item.sel .ico { color:var(--primary); }
.cmd-empty { text-align:center; color:var(--c-text-mute); font-size:13px; padding:26px 0; }

/* ---------- 空状态插画 ---------- */
.empty-state { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; padding:48px 20px; text-align:center; }
.empty-state .es-emoji { font-size:44px; opacity:.4; line-height:1; }
.empty-state .es-title { font-size:15px; color:var(--c-text-sub); font-weight:600; }
.empty-state .es-hint { font-size:13px; color:var(--c-text-mute); line-height:1.7; max-width:340px; }

/* ---------- 快捷键提示 kbd ---------- */
kbd { display:inline-block; padding:2px 6px; border-radius:5px; border:1px solid var(--c-border); border-bottom-width:2px; background:var(--c-bg-soft); font-family:inherit; font-size:11px; color:var(--c-text-sub); line-height:1.4; }
.nav-item .nav-kbd { margin-left:auto; font-size:11px; color:var(--c-text-mute); opacity:0; transition:opacity .15s var(--ease-fast); }
.nav-item:hover .nav-kbd { opacity:1; }

/* ---------- 作品库虚拟列表 sentinel ---------- */
.work-sentinel { height:1px; }
/* ---------- Focused workspace theme: quiet, dense, deliberate ---------- */

/* ---------- 首次引导气泡（Onboarding） ---------- */
.ob-mask { position:fixed; inset:0; background:var(--overlay); z-index:900; }
.ob-card { position:fixed; z-index:901; width:280px; background:var(--c-card); border:1px solid var(--c-border); border-radius:12px; box-shadow:var(--shadow-float); padding:14px 16px 12px; }

.ob-card .ob-arrow.up { bottom:100%; left:50%; transform:translateX(-50%); border-bottom-color:var(--c-card); filter:drop-shadow(0 -1px 0 var(--c-border)); }
.ob-card .ob-arrow.down { top:100%; left:50%; transform:translateX(-50%); border-top-color:var(--c-card); filter:drop-shadow(0 1px 0 var(--c-border)); }
.ob-card .ob-arrow.left { right:100%; top:50%; transform:translateY(-50%); border-right-color:var(--c-card); filter:drop-shadow(1px 0 0 var(--c-border)); }
.ob-card .ob-arrow.right { left:100%; top:50%; transform:translateY(-50%); border-left-color:var(--c-card); filter:drop-shadow(-1px 0 0 var(--c-border)); }
.ob-card .ob-btns { display:flex; align-items:center; justify-content:flex-end; gap:8px; margin-top:12px; }

.ob-highlight { position:relative; z-index:902; }
/* ---------- 配音工坊四步流水线进度条 ---------- */
.tts-flow { display:flex; align-items:center; gap:6px; padding:8px 12px; border:1px solid var(--c-border); border-radius:8px; background:var(--c-bg-soft); margin-bottom:8px; flex-wrap:wrap; }

.tts-flow .tf-step.done .tf-num { background:#34c759; color:#fff; border-color:#34c759; }
.tts-flow .tf-step.active .tf-num { background:var(--primary); color:#fff; border-color:var(--primary); }
.tts-flow .tf-step.active { color:var(--c-text); font-weight:500; }
.tts-flow .tf-sep { flex:0 0 12px; height:2px; background:var(--c-border); border-radius:1px; }

.tts-flow .tf-go:hover { text-decoration:underline; }

<script>
'use strict';
/* 全局兜底：拦截未处理的请求失败（散落裸 fetch 的保险），统一提示避免静默白屏 */
window.addEventListener('unhandledrejection', function(ev){
  var _err = ev && ev.reason;
  var _msg = (_err && (_err.message || _err.error)) || '';
  if (/fetch|network|网络|failed to fetch/i.test(_msg)) {
    try { showToast('⚠ 网络请求失败，请重试'); } catch(_e){}
  }
  if (ev.preventDefault) ev.preventDefault();
});
/* ================= 全局状态 ================= */
const $ = id => document.getElementById(id);
let currentView = 'home';
let currentSid = null;
let currentWorkId = null;
let currentWorkTitle = '';
let members = [];
let busy = false;
let adoptMode = false;
let es = null;
let doneHandled = false;
let ignoreDone = false;
let skeletonFilter = { q:'', scene:'全部', type:'全部' };
const renderedSeqs = new Set();
/* 视图白名单：新增视图只需在此加一项（switchView / 深链 / 快捷键共用） */
const VIEWS = ['home','chat','rewrite','works','tts','monitor','skeleton','stats','learn','settings'];

const AVATAR_COLORS = { '阿沁':'#E8576A','老周':'#3B82F6','阿爆':'#F59E0B','小黄':'#10B981','爆哥':'#8B5CF6','阿证':'#0D9488','阿骨':'#B45309','阿导':'#E11D48','阿记':'#64748B','阿数':'#0E7490','阿审':'#7C3AED' };
const DEFAULT_COLOR = '#94A3B8';
const RECORDER_NAME = '阿记';
const STATUS_LABELS = { draft:'草稿', discussing:'讨论中', to_adopt:'待采纳', published:'已发布', reviewed:'已复盘', archived:'已归档' };

function esc(s){ const d=document.createElement('div'); d.textContent=s==null?'':s; return d.innerHTML; }
function friendlyError(value){
  const raw = String(value == null ? '' : value);
  const lower = raw.toLowerCase();
  if (/(?:_ssl\.c|ssl|handshake|timed out|timeout|connection reset|connection aborted|eof)/.test(lower)) {
    return '连接 AI 服务超时，已自动重试。请检查网络或代理后再试。';
  }
  if (/(?:api key|authentication|unauthorized|401|invalid api)/.test(lower)) {
    return 'AI 服务鉴权失败，请在 API 设置中检查密钥和模型配置。';
  }
  return raw || '操作失败，请稍后重试';
}
function downloadText(filename, text, mime='text/plain'){
  const blob = new Blob([text], {type:mime});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(url); a.remove(); }, 200);
}
function colorOf(n){ return AVATAR_COLORS[n] || DEFAULT_COLOR; }
function titleOf(n){
  if (!members || !members.length) return '';
  const m = members.find(x=>x.name===n);
  return m ? (m.title||'') : '';
}
function nowTime(){ const d=new Date(); return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
function sleep(ms){ return new Promise(r=>setTimeout(r,ms)); }
async function safeJson(r){
  const data = await r.json().catch(()=>({ok:false, error:'服务响应异常'}));
  if (!r.ok && data.ok !== false) data.ok = false;
  if (!r.ok && !data.error) data.error = '请求失败（HTTP ' + r.status + '）';
  return data;
}
async function post(url, body){
  const ctl = new AbortController();
  const timer = setTimeout(()=>ctl.abort(), 120000);
  try {
    const res = await fetch(url, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body||{}), signal:ctl.signal});
    return await safeJson(res);
  } catch (e) {
    return {ok:false, error:e.name === 'AbortError' ? '请求超时，请检查网络或稍后重试' : '网络错误：'+e.message};
  } finally { clearTimeout(timer); }
}

/* ================= 通用退出动画：播放完再移除（与进入动画对称） ================= */
function animateRemove(el, closeClass, delayMs){
  if (!el) return;
  el.classList.add(closeClass);
  setTimeout(()=>{ el.remove(); }, delayMs);
}

const CMD_VIEWS = [
  { v:'home', label:'工作台', hint:'总览', icon:'#ic-home' },
  { v:'rewrite', label:'洗稿工坊', hint:'创作', icon:'#ic-scissors' },
  { v:'tts', label:'配音工坊', hint:'创作', icon:'#ic-mic' },
  { v:'chat', label:'专家群聊', hint:'创作', icon:'#ic-chat' },
  { v:'works', label:'作品库', hint:'创作', icon:'#ic-folder' },
  { v:'monitor', label:'对标监控', hint:'创作', icon:'#ic-radar' },
  { v:'skeleton', label:'骨架库', hint:'学习与数据', icon:'#ic-grid' },
  { v:'stats', label:'数据复盘', hint:'学习与数据', icon:'#ic-chart' },
  { v:'learn', label:'学习档案', hint:'学习与数据', icon:'#ic-brain' },
  { v:'settings', label:'设置', hint:'系统', icon:'#ic-gear' },
];
const CMD_ACTIONS = [
  { key:'newWork', label:'新建文稿', run:()=>newWorkFlow(), hint:'创作', icon:'#ic-plus' },
  { key:'newRewrite', label:'新建洗稿', run:()=>{ switchView('rewrite'); newRewrite(); }, hint:'创作', icon:'#ic-scissors' },
  { key:'toggleTheme', label:'切换 亮色/暗色 主题', run:()=>toggleTheme(), hint:'系统', icon:'#ic-moon' },
];
let cmdOpen = false, cmdSel = 0, cmdItems = [];
function openCmd(){
  if (cmdOpen) return;
  cmdOpen = true; cmdSel = 0;
  const mask = document.createElement('div');
  mask.className = 'cmd-mask'; mask.id = 'cmdMask';
  mask.innerHTML = '<div class="cmd-panel">' +
    '<div class="cmd-input"><span class="ico"><svg><use href="#ic-search"/></svg></span><input id="cmdInput" placeholder="搜索视图或命令…（↑↓ 选择，Enter 执行，Esc 关闭）"></div>' +
    '<div class="cmd-list" id="cmdList"></div></div>';
  document.body.appendChild(mask);
  const inp = $('cmdInput');
  setTimeout(()=>inp.focus(), 30);
  renderCmd('');
  inp.addEventListener('input', ()=>{ renderCmd(inp.value); });
  inp.addEventListener('keydown', e=>{
    if (e.key === 'ArrowDown'){ e.preventDefault(); cmdSel = Math.min(cmdSel+1, cmdItems.length-1); paintCmd(); }
    else if (e.key === 'ArrowUp'){ e.preventDefault(); cmdSel = Math.max(cmdSel-1, 0); paintCmd(); }
    else if (e.key === 'Enter'){ e.preventDefault(); const it = cmdItems[cmdSel]; if (it){ closeCmd(); it.run(); } }
    else if (e.key === 'Escape'){ closeCmd(); }
  });
  mask.addEventListener('mousedown', e=>{ if (e.target === mask) closeCmd(); });
}
function closeCmd(){
  if (!cmdOpen) return;
  cmdOpen = false;
  const mask = $('cmdMask');
  if (mask) animateRemove(mask, 'closing', 150);
}
function renderCmd(q){
  q = (q||'').trim().toLowerCase();
  const views = CMD_VIEWS.filter(x => !q || x.label.toLowerCase().includes(q));
  const acts = CMD_ACTIONS.filter(x => !q || x.label.toLowerCase().includes(q));
  cmdItems = [];
  let html = '';
  if (views.length){
    html += '<div class="cmd-group">视图</div>';
    views.forEach(x => { cmdItems.push({ label:x.label, hint:x.hint, icon:x.icon, run:()=>switchView(x.v) }); });
  }
  if (acts.length){
    html += '<div class="cmd-group">操作</div>';
    acts.forEach(x => { cmdItems.push({ label:x.label, hint:x.hint, icon:x.icon, run:x.run }); });
  }
  html = html + cmdItems.map((x,i)=>{
    const icon = x.icon || '#ic-doc';
    return '<div class="cmd-item'+(i===0?' sel':'')+'" data-i="'+i+'">' +
      '<span class="ico"><svg><use href="'+icon+'"/></svg></span>' +
      '<span class="ci-label">'+esc(x.label)+'</span>' +
      (x.hint?'<span class="ci-hint">'+esc(x.hint)+'</span>':'') + '</div>';
  }).join('');
  if (!cmdItems.length) html = '<div class="cmd-empty">没有匹配的结果</div>';
  const list = $('cmdList');
  if (list) list.innerHTML = html;
  cmdSel = 0;
  paintCmd();
  if (list) list.querySelectorAll('.cmd-item').forEach(el=>{
    el.addEventListener('click', ()=>{ const it = cmdItems[+el.dataset.i]; if (it){ closeCmd(); it.run(); } });
    el.addEventListener('mousemove', ()=>{ cmdSel = +el.dataset.i; paintCmd(); });
  });
}
function paintCmd(){
  document.querySelectorAll('.cmd-item').forEach((el,i)=>el.classList.toggle('sel', i===cmdSel));
  const selEl = document.querySelector('.cmd-item.sel');
  if (selEl && selEl.scrollIntoView) selEl.scrollIntoView({ block:'nearest' });
}

/* ================= 全局键盘快捷键（⌘K 命令面板 + ⌘/Ctrl 1-9 视图切换） ================= */
document.addEventListener('keydown', e=>{
  const mod = e.metaKey || e.ctrlKey;
  if (!mod) return;
  const k = e.key.toLowerCase();
  if (k === 'k'){ e.preventDefault(); openCmd(); return; }
  if (k === 'n'){ e.preventDefault(); newWorkFlow(); return; }
  const idx = parseInt(k, 10);
  if (!isNaN(idx) && idx >= 1 && idx <= 9){
    const order = ['home','rewrite','tts','chat','works','monitor','skeleton','stats'];
    const v = order[idx-1];
    if (v){ e.preventDefault(); switchView(v); }
  }
});

/* ================= Toast（含撤销动作） ================= */
function showToast(msg, action) {
  const root = $('toastRoot');
  // 堆叠上限：最多 3 条，超出先移除最旧的一条（成熟产品的固定位置 + 新顶旧策略）
  while (root.children.length >= 3) { root.removeChild(root.firstChild); }
  const t = document.createElement('div');
  t.className = 'toast';
  t.setAttribute('role', 'status');
  t.setAttribute('aria-live', 'polite');
  t.innerHTML = '<span>' + esc(friendlyError(msg)) + '</span>';
  if (action) {
    const b = document.createElement('button');
    b.className = 'act';
    b.textContent = action.label;
    b.addEventListener('click', () => { action.onClick(); t.remove(); });
    t.appendChild(b);
  }
  root.appendChild(t);
  setTimeout(() => { t.style.opacity='0'; t.style.transition='opacity .3s'; setTimeout(()=>t.remove(),320); }, action && action.ttl ? action.ttl : 4000);
}

/* ================= 弹窗系统 ================= */
function openModal({title, sub='', fields, okText='确定', danger=false, customBody=''}) {
  // fields: [{name,label,type:'text'|'textarea',placeholder,value,rows}]
  const root = $('modalRoot');
  const box = document.createElement('div');
  box.className = 'modal-mask';
  let inner = '<div class="modal-box"><div class="modal-title">' + esc(title) + '</div>';
  if (sub) inner += '<div class="modal-sub">' + esc(sub) + '</div>';
  if (customBody) {
    inner += customBody;
  }
  for (const f of fields || []) {
    inner += '<div class="mfield"><label>' + esc(f.label || '') + '</label>';
    if (f.type === 'textarea') {
      inner += '<textarea rows="' + (f.rows||6) + '" placeholder="' + esc(f.placeholder||'') + '" data-name="' + esc(f.name) + '">' + esc(f.value||'') + '</textarea>';
    } else if (f.type === 'radio') {
      inner += '<div class="radio-group" data-name="' + esc(f.name) + '">' + (f.options||[]).map((opt,i) => {
        const checked = (f.value||'') === opt.value ? ' checked' : '';
        return '<label><input type="radio" name="' + esc(f.name) + '" value="' + esc(opt.value) + '"' + checked + '>' + esc(opt.label) + '</label>';
      }).join('') + '</div>';
    } else if (f.type === 'checkbox') {
      const checked = f.value ? ' checked' : '';
      inner += '<label class="checkbox-row"><input type="checkbox" data-name="' + esc(f.name) + '"' + checked + '><span>' + esc(f.label || '') + '</span></label>';
    } else {
      inner += '<input type="text" placeholder="' + esc(f.placeholder||'') + '" value="' + esc(f.value||'') + '" data-name="' + esc(f.name) + '">';
    }
    inner += '</div>';
  }
  inner += '<div class="modal-btns"><button class="cancel" data-act="cancel">取消</button><button class="ok' + (danger?' danger':'') + '" data-act="ok">' + esc(okText) + '</button></div></div>';
  box.innerHTML = inner;
  root.appendChild(box);
  const first = box.querySelector('input,textarea');
  if (first) setTimeout(()=>first.focus(), 40);
  const close = v => { animateRemove(box, 'closing', 150); if (resolveFn){ const r=resolveFn; resolveFn=null; r(v);} };
  box.querySelector('[data-act=cancel]').addEventListener('click', ()=>close(null));
  box.querySelector('[data-act=ok]').addEventListener('click', ()=>{
    const out = {};
    box.querySelectorAll('[data-name]').forEach(el => {
      if (el.classList && el.classList.contains('radio-group')) {
        const checked = el.querySelector('input[type=radio]:checked');
        out[el.dataset.name] = checked ? checked.value : '';
      } else if (el.type === 'checkbox') {
        out[el.dataset.name] = el.checked;
      } else {
        out[el.dataset.name] = el.value.trim();
      }
    });
    close(out);
  });
  // 点遮罩关闭：危险操作除外（防误触，需显式点「取消」或「确定」）
  box.addEventListener('mousedown', e => { if (e.target === box && !danger) close(null); });
  const escHandler = ev => { if (ev.key === 'Escape') { close(null); document.removeEventListener('keydown', escHandler); } };
  document.addEventListener('keydown', escHandler);
  let resolveFn = null;
  return new Promise(resolve => { resolveFn = resolve; });
}

function confirmDanger(title, sub, okText) {
  const body = sub ? ('<div class="modal-danger-note">⚠️ ' + esc(sub) + '</div>') : '';
  return openModal({ title, okText, danger:true, fields:[], customBody: body }).then(r => r !== null);
}
function confirmSelect(title, sub, options, defaultValue){
  return openModal({ title, sub, fields:[{name:'sel', type:'radio', options, value:defaultValue}], okText:'确定' }).then(r => r ? r.sel : null);
}

/* ================= 专家群聊首次引导（Onboarding，只弹一次） ================= */
function maybeRunChatOnboarding(){
  try { if (localStorage.getItem('wb_chat_onboarded')) return; } catch(_){ return; }
  const chatEl = $('chat');
  if (!chatEl || !chatEl.offsetParent) return; // 仅在聊天区可见时引导
  const steps = [
    { target:'#input', title:'① 粘贴口播文稿', body:'把你写的口播稿贴进来，Ctrl+Enter 或点发送，七位专家团队立刻实时讨论改写。', pos:'top' },
    { target:'#btnAdopt', title:'② 采纳模式', body:'点「采纳模式」后，再点任意专家建议，即可采纳它。采纳的改动会汇入下方合并编辑器。', pos:'right' },
    { target:'#btnHeatmap', title:'③ 争议热力', body:'想看原稿哪些段落专家分歧最大？点「争议热力」打开热力图，还能逐段对照采纳。', pos:'right' },
  ];
  let idx = 0;
  const mask = document.createElement('div');
  mask.className = 'ob-mask';
  const card = document.createElement('div');
  card.className = 'ob-card';
  document.body.appendChild(mask);
  document.body.appendChild(card);

  function removeOb(){
    try { localStorage.setItem('wb_chat_onboarded', '1'); } catch(_){}
    if (card && card.parentNode) card.parentNode.removeChild(card);
    if (mask && mask.parentNode) mask.parentNode.removeChild(mask);
    document.querySelectorAll('.ob-highlight').forEach(e => e.classList.remove('ob-highlight'));
  }
  function placeCard(){
    const s = steps[idx];
    const el = document.querySelector(s.target);
    if (!el) { removeOb(); return; }
    // 高亮目标
    document.querySelectorAll('.ob-highlight').forEach(e => e.classList.remove('ob-highlight'));
    el.classList.add('ob-highlight');
    card.innerHTML =
      '<div class="ob-title"><span class="ob-dot"></span>' + s.title + '</div>' +
      '<div class="ob-body">' + s.body + '</div>' +
      '<div class="ob-btns">' +
        '<span class="ob-count">' + (idx+1) + ' / ' + steps.length + '</span>' +
        (idx > 0 ? '<button class="ob-prev">上一步</button>' : '') +
        '<button class="ob-skip">跳过</button>' +
        '<button class="ob-next">' + (idx === steps.length-1 ? '完成 ✓' : '下一步 ›') + '</button>' +
      '</div>';
    const r = el.getBoundingClientRect();
    const cardW = card.offsetWidth, cardH = card.offsetHeight;
    let left, top, arrowPos = s.pos;
    const pad = 12;
    if (s.pos === 'top') { left = r.left + r.width/2 - cardW/2; top = r.top - cardH - pad - 7; arrowPos='down'; }
    else if (s.pos === 'bottom') { left = r.left + r.width/2 - cardW/2; top = r.bottom + pad + 7; arrowPos='up'; }
    else if (s.pos === 'right') { left = r.right + pad + 7; top = r.top + r.height/2 - cardH/2; arrowPos='left'; }
    else { left = r.left - cardW - pad - 7; top = r.top + r.height/2 - cardH/2; arrowPos='right'; }
    // 边界修正：不超出视口
    const vw = window.innerWidth, vh = window.innerHeight;
    if (left + cardW > vw - 10) left = vw - cardW - 10;
    if (left < 10) left = 10;
    if (top + cardH > vh - 10) top = vh - cardH - 10;
    if (top < 10) top = 10;
    card.style.left = Math.round(left) + 'px';
    card.style.top = Math.round(top) + 'px';
    // 重建箭头方向（用 .ob-arrow.xxx）
    const arrow = document.createElement('div');
    arrow.className = 'ob-arrow ' + arrowPos;
    card.insertBefore(arrow, card.firstChild);
    card.querySelector('.ob-next').addEventListener('click', ()=>{
      if (idx < steps.length-1) { idx++; placeCard(); }
      else removeOb();
    });
    const skip = card.querySelector('.ob-skip');
    if (skip) skip.addEventListener('click', removeOb);
    const prev = card.querySelector('.ob-prev');
    if (prev) prev.addEventListener('click', ()=>{ if (idx>0){ idx--; placeCard(); } });
  }
  mask.addEventListener('click', removeOb);
  placeCard();
}

const NOTIFY_ICONS = { adopt:'ic-thumb', review:'ic-chart', retention:'ic-trend', rewrite:'ic-scissors', session:'ic-chat', debate:'ic-spark', system:'ic-bell', learn:'ic-brain' };
async function loadNotifications() {

function renderBellPanel(items) {
  const p = $('bellPanel');
  if (!items || !items.length) {
    p.innerHTML = '<div class="bp-hd"><span><span class="ico" style="width:15px;height:15px"><svg><use href="#ic-bell"/></svg></span> 通知中心</span><span class="spacer"></span></div><div class="bp-empty">暂无通知</div>';
    return;
  }
  p.innerHTML = '<div class="bp-hd"><span><span class="ico" style="width:15px;height:15px"><svg><use href="#ic-bell"/></svg></span> 通知中心</span><span class="spacer"></span>' +
    '<button id="bellReadAll">全部已读</button>' +
    '<button id="bellClear" style="color:var(--c-text-mute)">清空</button></div>' +
    items.map(n => '<div class="bp-item' + (n.read?'':' unread') + '" data-id="' + esc(n.id) + '">' +
      '<span class="bp-ico"><span class="ico" style="width:15px;height:15px"><svg><use href="#' + (NOTIFY_ICONS[n.type]||'ic-bell') + '"/></svg></span></span>' +
      '<div class="bp-main"><div class="bp-title">' + esc(n.title) + '</div>' +
      '<div class="bp-body">' + esc(n.body||'') + '</div>' +
      '<div class="bp-time">' + esc((n.ts||'').slice(5,16)) + '</div></div></div>').join('');
  p.querySelectorAll('.bp-item').forEach(el => el.addEventListener('click', ()=>{
    const id = el.dataset.id;
    post('/api/notifications/read', { id }).then(()=>{
      closeBell();

  $('bellClear').addEventListener('click', ()=>{
    post('/api/notifications/clear').then(()=>{ loadNotifications(); renderBellPanel([]); });
  });
}
function toggleBell() {
  bellOpen = !bellOpen;

    fetch('/api/notifications').then(r=>r.json()).then(d => { if (d.ok) renderBellPanel(d.items); });

function statCard(num, label, color) {
  return '<div class="stat-card"><div class="num ' + color + '">' + fmtNum(num) + '</div><div class="label">' + esc(label) + '</div></div>';
}
function fmtNum(n) {
  if (n === null || n === undefined) return '—';
  if (typeof n === 'number' && n >= 10000) return (n/10000).toFixed(n>=100000?0:1) + 'w';
  return String(n);
}
