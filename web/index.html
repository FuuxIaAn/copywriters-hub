/* 配音工坊四步流水线进度条：贴主页 → 扒文案 → 建角色 → 开聊
   根据当前状态标出已完成/进行中，并给出下一步入口。 */
function ttsRenderFlowSteps(){
  const bar = $('ttsGuideBar');
  if (!bar) return;
  // 状态判断
  const nameEl = $('tcName');
  const hasRole = nameEl && nameEl.textContent && nameEl.textContent !== '未创建角色';
  const hasExtract = !!(_extractData && _extractData.extract_id);
  const chatBox = $('agentChatBox');
  const hasChat = !!(chatBox && chatBox.querySelector('.msg, .bubble, .wc-msg'));
  // 有账号（第一步）用作品库账号数；这里保守判断：有提取记录即可视为已贴主页进入流程
  let cur = 1;
  if (hasRole || hasChat) cur = 4;
  else if (hasExtract) cur = 3;
  const steps = [
    { n:1, label:'贴主页', go:'wlHomeUrl' },
    { n:2, label:'扒文案', go:'extractBtn' },
    { n:3, label:'建角色', go:'ttsToolsBtn' },
    { n:4, label:'开聊', go:'chatInput' },
  ];
  const label = [
    '粘贴抖音账号主页，批量抓取视频文案',
    '提取字幕、区分发言人，成为对话素材',
    '从文案自动创建 AI 角色，就能开始模拟',
    '你来当师傅，AI 角色陪你模拟对话',
  ];
  bar.innerHTML = '<div class="tts-flow">' + steps.map((s,i)=>{
    const state = s.n < cur ? 'done' : (s.n === cur ? 'active' : '');
    const sep = i < steps.length-1 ? '<span class="tf-sep' + (s.n < cur ? ' done' : '') + '"></span>' : '';
    return '<span class="tf-step ' + state + '"><span class="tf-num">' + s.n + '</span>' + s.label + '</span>' + sep;
  }).join('') +
    '<span class="tf-go" id="ttsFlowGo" title="' + esc(label[cur-1]) + '">下一步：' + label[cur-1] + ' ›</span>' +
  '</div>';
  bar.style.display = 'block';
  const go = $('ttsFlowGo');
  if (go) go.addEventListener('click', () => {
    const target = steps[cur-1].go;
    if (target === 'wlHomeUrl') { ttsOpenTools(); setTimeout(()=>{ const el=$('wlHomeUrl'); if(el) el.focus(); }, 120); }
    else if (target === 'extractBtn') { ttsOpenTools(); setTimeout(()=>{ const el=$('extractBtn'); if(el) el.focus(); }, 120); }
    else if (target === 'ttsToolsBtn') { const b=$('ttsToolsBtn'); if(b) b.click(); }
    else { const el=$('chatInput'); if(el) { el.disabled=false; el.focus(); } }
  });
}

/* 提交文本文件：读取 .txt 内容 → 直接走「区分发言人」流程 */
async function ttsExtractTextFile(evt) {
  const fileInput = evt.target;
  const file = fileInput.files && fileInput.files[0];
  if (!file) return;
  let text;
  try {
    text = await file.text();
  } catch (e) {
    showToast('读取文件失败：' + e.message);
    fileInput.value = '';
    return;
  }
  fileInput.value = '';
  text = (text || '').trim();
  if (!text) { showToast('文件内容为空'); return; }
  // 去掉 BOM
  if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);

  const btn = $('extractTextBtn');
  const statusEl = $('extractStatus');
  btn.disabled = true;
  btn.textContent = '正在区分发言人…';
  statusEl.innerHTML = '<span class="muted" style="color:var(--primary)">⏳ 已读取 ' + file.name + '，正在自动区分发言人…</span>';
  $('extractVideoInfo').innerHTML = '';
  const _ss = $('speakerSegments');
  if (_ss) _ss.innerHTML = '';
  $('visitorProfileBox').innerHTML = '';
  $('visitorStatus').textContent = '';
  try {
    const d = await fetch('/api/extract/text', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text }) }).then(r => r.json());
    if (!d.ok) {
      statusEl.innerHTML = '<span style="color:#ff3b30">❌ ' + esc(d.error || '处理失败') + '</span>';
      return;
    }
    _extractData = d;
    statusEl.innerHTML = '<span style="color:#34c759">✅ 已区分发言人，共 ' + (d.segments || []).length + ' 段对话</span>';
    if (d.video_info) {
      const vi = d.video_info;
      $('extractVideoInfo').innerHTML =
        '<div style="padding:8px 12px;border:1px solid var(--c-border);border-radius:8px;background:var(--c-card);font-size:13px">' +
          '<b>' + esc(vi.nickname || '文本文件') + '</b>' +
        '</div>';
    }
    ttsRenderSegments(d.segments, d.extract_id);
    ttsUpdateSpeakerOptions(d.segments);
    ttsRenderVisitorProfile(d.visitor_profile);
    ttsAutoFlowAfterExtract(d.segments);
  } catch (e) {
    statusEl.innerHTML = '<span style="color:#ff3b30">❌ ' + esc(e.message) + '</span>';
  } finally {
    btn.disabled = false;
    btn.innerHTML = '<span class="btn-ico"><svg><use href="#ic-upload"/></svg></span>提交文本文件（.txt），直接区分发言人';
  }
}

async function ttsExtractLink() {
  const url = $('extractUrl').value.trim();
  if (!url) { showToast('请输入抖音分享链接'); return; }
  $('extractBtn').disabled = true;
  $('extractStatus').innerHTML = '<span class="muted" style="color:var(--primary)">⏳ 正在提取文案…</span>';
  $('extractVideoInfo').innerHTML = '';
  const _ss = $('speakerSegments');
  if (_ss) _ss.innerHTML = '';
  $('visitorProfileBox').innerHTML = '';
  $('visitorStatus').textContent = '';
  try {
    const d = await fetch('/api/extract/link', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ url }) }).then(r => r.json());
    // 无字幕兜底：后端提示「没字幕/没文案」时，直接自动转入语音转录
    if (!d.ok) {
      const errMsg = (d.error || '');
      if (/没有字幕|未.*字幕|没.*文案|提取到文案|纯口播|没有.*描述/.test(errMsg)) {
        $('extractStatus').innerHTML = '<span style="color:#ff9500">🎙️ 未提取到字幕文案，自动转入语音转录…</span>';
        ttsAsrTranscribe();
        return;
      }
      $('extractStatus').innerHTML = '<span style="color:#ff3b30">❌ ' + esc(errMsg || '提取失败') + '</span>';
      return;
    }
    _extractData = d;
    $('extractStatus').innerHTML = '<span style="color:#34c759">✅ 提取成功，共 ' + (d.segments || []).length + ' 段对话</span>';
    if (d.video_info) {
      const vi = d.video_info;
      $('extractVideoInfo').innerHTML =
        '<div style="padding:8px 12px;border:1px solid var(--c-border);border-radius:8px;background:var(--c-card);font-size:13px">' +
          '<b>' + esc(vi.nickname || '未知') + '</b> · ' + esc(vi.desc || '') +
          (vi.digg_count ? ' · 👍 ' + vi.digg_count : '') +
          (vi.comment_count ? ' · 💬 ' + vi.comment_count : '') +
        '</div>';
    }
    ttsRenderSegments(d.segments, d.extract_id);
    ttsUpdateSpeakerOptions(d.segments);
    ttsRenderVisitorProfile(d.visitor_profile);
    // 有字幕：直接进入「确认发言人」；无字幕（<=1 段）走 ASR 语音转录
    if ((d.segments || []).length > 1) {
      ttsAutoFlowAfterExtract(d.segments);
    } else {
      ttsMaybePromptAsr(d.segments, true);
    }
  } catch (e) {
    $('extractStatus').innerHTML = '<span style="color:#ff3b30">❌ ' + esc(e.message) + '</span>';
  } finally {
    $('extractBtn').disabled = false;
  }
}

async function ttsAutoRestore() {

    if (!sessions.length) return;
    const latest = sessions[0];
    const d = await fetch('/api/agent/session/' + latest.sid).then(r => r.json());
    if (!d.ok) return;
    _chatSid = d.sid;
    // 恢复聊天头部

    $('tcAvatar').textContent = '🧑';
    $('tcName').innerHTML = speakerLabel;

    $('chatSendBtn').disabled = false;

    $('chatAddBtn').disabled = false;

    const msgs = d.messages || [];
    if (msgs.length) {
      chatBox.innerHTML = '<div class="wc-time">—— 已恢复上次对话 ——</div>' +
        msgs.map(m => ttsRenderChatMsg(
          m.role === 'assistant' ? 'assistant' : 'user',
          m.content, m.id, m.time, false,
          m.audio || '', m.audio_preset || ''
        )).join('');
    } else {
      chatBox.innerHTML = '<div class="wc-time">' + nowTime() + '</div>';
    }
    chatBox.scrollTop = chatBox.scrollHeight;
    // 等历史语音条延迟渲染完成后，刷新「一键生成全部」的缺失提示
    setTimeout(() => ttsHintGenAll(), 100);
  } catch (e) { /* 静默：没有历史会话就不恢复 */ }
  ttsRenderFlowSteps();
}

function wlToggleAccount(el) {
  const vidBox = el.querySelector('.wl-videos');
  const caret = el.querySelector('.wl-caret');
  const accountId = el.dataset.id;
  const isOpen = vidBox.style.display !== 'none';
  // 互斥手风琴：展开当前账号前，先折叠其它所有已展开的账号
  if (!isOpen) {
    document.querySelectorAll('.wl-acc').forEach(other => {
      if (other === el) return;
      const ov = other.querySelector('.wl-videos');
      const oc = other.querySelector('.wl-caret');
      if (ov && ov.style.display !== 'none') {
        ov.style.display = 'none';
        if (oc) oc.textContent = '▶';
      }
    });
  }
  if (isOpen) {
    // 折叠：隐藏视频区
    vidBox.style.display = 'none';
    if (caret) caret.textContent = '▶';
  } else {
    // 展开：旋转箭头 + 首次展开时才加载视频
    vidBox.style.display = 'block';
    if (caret) caret.textContent = '▼';
    if (!vidBox.dataset.loaded) {
      vidBox.dataset.loaded = '1';
      wlLoadVideos(accountId);
    }
  }
}

  $('wlStatus').innerHTML = '<span class="muted" style="color:var(--primary)">⏳ 开始抓取…</span>';
  try {
    const d = await fetch('/api/workslib/crawl', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ count: 50 }) }).then(r => r.json());
    if (!d.ok) { $('wlStatus').innerHTML = '<span style="color:#ff3b30">❌ ' + esc(d.error || '启动失败') + '</span>'; btn.disabled = false; return; }
    wlPollStatus();
  } catch (e) {
    $('wlStatus').innerHTML = '<span style="color:#ff3b30">❌ ' + esc(e.message) + '</span>';
    btn.disabled = false;
  }
}

async function wlPollStatus() {
  if (_wlPollTimer) clearInterval(_wlPollTimer);
  _wlPollTimer = setInterval(async () => {
    try {
      const d = await fetch('/api/workslib/status').then(r => r.json());
      const p = d.progress || {};
      if (d.running) {
        // 阶段文案：task=crawl 抓视频列表 / extract 扒文案
        const task = d.task || '';
        const stageLabel = task === 'extract' ? '扒文案（字幕/ASR 转录）' : '抓取视频列表';
        const cur = p.current ? esc(p.current) : '';
        const done = p.done || 0, total = p.total || 0;
        const pct = total > 0 ? Math.min(100, Math.round(done / total * 100)) : 0;
        $('wlStatus').innerHTML =
          '<div style="border:1px solid var(--c-border);border-radius:8px;padding:10px 12px;background:var(--c-card)">' +
            '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px">' +
              '<span style="font-size:12px;font-weight:600;color:var(--primary)">⏳ 正在' + stageLabel + '</span>' +
              '<span class="muted" style="font-size:11px">' + done + ' / ' + total + ' · ' + pct + '%</span>' +
            '</div>' +
            '<div style="height:8px;background:var(--c-bg);border-radius:4px;overflow:hidden">' +
              '<div style="height:100%;width:' + pct + '%;background:linear-gradient(90deg,#0a84ff,#34c759);border-radius:4px;transition:width .4s ease"></div>' +
            '</div>' +
            (cur ? '<div class="muted" style="font-size:11px;margin-top:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + cur + '</div>' : '') +
          '</div>';
      } else {
        clearInterval(_wlPollTimer);
        const res = d.result || {};
        const errs = (res.errors || []);
        let msg = '✅ 抓取完成：' + (res.accounts || 0) + ' 个账号，' + (res.videos || 0) + ' 条视频，扒出 ' + (res.extracted || 0) + ' 条对话';
        if (errs.length) msg += '（' + errs.length + ' 条失败）';
        $('wlStatus').innerHTML = '<span style="color:#34c759">' + esc(msg) + '</span>';
        if (errs.length) {
          $('wlStatus').innerHTML += '<div class="muted" style="font-size:11px;color:#ff9500;margin-top:4px">' + errs.slice(0, 3).map(esc).join('<br>') + '</div>';
        }
        $('wlCrawlBtn').disabled = false;
        await wlLoadAccounts();
      }
    } catch (e) {
      clearInterval(_wlPollTimer);
      $('wlStatus').innerHTML = '<span style="color:#ff3b30">❌ ' + esc(e.message) + '</span>';
      $('wlCrawlBtn').disabled = false;
    }
  }, 1500);
}

async function wlLoadVideos(accountId) {
  // 手风琴：视频渲染到对应账号卡片内的 .wl-videos 容器（按 data-id 定位）
  const acc = document.querySelector('.wl-acc[data-id="' + accountId + '"]');
  const box = acc ? acc.querySelector('.wl-videos') : $('wlVideoList');
  if (!box) return;
  box.innerHTML = '<span class="muted" style="font-size:12px">加载中…</span>';
  try {
    const d = await fetch('/api/workslib/videos?account_id=' + encodeURIComponent(accountId)).then(r => r.json());
    if (!d.ok) { box.innerHTML = '<div class="empty" style="padding:12px;font-size:12px">' + esc(d.error || '加载失败') + '</div>'; return; }
    const vids = d.videos || [];
    if (!vids.length) { box.innerHTML = '<div class="empty" style="padding:12px;font-size:12px">该账号还没有视频，点「抓取全部账号」</div>'; return; }
    box.innerHTML = '<div class="muted" style="font-size:11px;margin-bottom:4px">共 ' + vids.length + ' 条</div>' +
      vids.map((v, idx) => {
        const segs = v.segments || [];
        const ok = v.extracted && segs.length;
        const segCount = segs.length;
        // 用 accountId 前缀避免多账号展开后 idx 重复导致 id 冲突（预览点不开的根因）
        const vid = 'wlv_' + accountId.replace(/[^A-Za-z0-9_-]/g, '_') + '_' + idx;
        const accountIdEsc = esc(accountId);
        const awemeEsc = esc(v.aweme_id);
        // 原视频链接：抖音拼 https://www.douyin.com/video/<id>；微博用 video_url 直链
        const isWeibo = (v._platform === 'weibo') || (v.platform === 'weibo');
        const openUrl = isWeibo ? (v.video_url || '') : 'https://www.douyin.com/video/' + encodeURIComponent(v.aweme_id || '');
        return '<div class="wl-vid" style="padding:8px 10px;border:1px solid var(--c-border);border-radius:8px;margin-bottom:6px;background:var(--c-bg)">' +
          '<div style="display:flex;align-items:flex-start;gap:8px">' +
            '<div style="flex:1;min-width:0;cursor:' + (ok ? 'pointer' : 'default') + '" onclick="' + (ok ? 'wlTogglePreview(\'' + vid + '\')' : '') + '" title="' + (ok ? '点击预览对话' : '') + '">' +
              '<div style="font-size:12px;font-weight:600;word-break:break-all">' + esc(v.desc || '(无标题)') + '</div>' +
              '<div class="muted" style="font-size:11px;margin-top:2px">' +
                (v.digg_count ? '👍 ' + v.digg_count + ' · ' : '') +
                (ok ? ('✅ ' + segCount + ' 段对话 <span style="color:var(--c-muted)">· 点击预览</span>') : '<span style="color:#ff9500">' + esc(v.error || '未扒文案') + '</span>') +
              '</div>' +
            '</div>' +
            (ok ? '<button class="btn-primary" style="background:#af52de;padding:4px 10px;flex:none;font-size:12px" onclick="wlImportVideo(\'' + accountIdEsc + '\',\'' + awemeEsc + '\')">导入</button>' : '') +
            (openUrl ? '<button class="btn-ghost" style="padding:4px 8px;flex:none;font-size:12px;color:var(--primary)" title="打开原视频" onclick="wlOpenVideo(event, \'' + esc(openUrl) + '\')">▶</button>' : '') +
            '<button class="btn-ghost" style="padding:4px 8px;flex:none;font-size:12px;color:var(--c-text-sub)" title="重新扒文案" onclick="wlReextractVideo(\'' + accountIdEsc + '\',\'' + awemeEsc + '\', this)">↻</button>' +
            '<button class="seg-del" style="flex:none" title="删除" onclick="wlDeleteVideo(event, \'' + accountIdEsc + '\',\'' + awemeEsc + '\')">✕</button>' +
          '</div>' +
          (ok ? '<div class="wl-preview" id="' + vid + '" style="display:none;margin-top:8px;padding:8px;background:var(--c-bg-soft);border-radius:6px;max-height:180px;overflow-y:auto;font-size:12px;line-height:1.6">' +
            segs.map(s => {
              const isA = (s.speaker || '').indexOf('A') === 0 || /师傅|老师|师|男|客户|甲方|教练|主播/i.test(s.speaker || '');
              return '<div style="margin-bottom:6px;text-align:' + (isA ? 'right' : 'left') + '">' +
                '<span class="muted" style="font-size:10px">' + esc(s.speaker || '?') + '</span>' +
                '<span style="display:inline-block;max-width:82%;padding:4px 8px;border-radius:8px;background:' + (isA ? '#d6e4ff' : '#e6f4ea') + ';color:var(--c-text);word-break:break-all">' + esc(s.text || '') + '</span>' +
              '</div>';
            }).join('') +
          '</div>' : '') +
        '</div>';
      }).join('');
  } catch (e) {
    box.innerHTML = '<div class="empty" style="padding:12px;font-size:12px">加载失败：' + esc(e.message) + '</div>';
  }
}

async function wlImportVideo(accountId, awemeId) {
  const st = $('wlStatus');
  st.innerHTML = '<span class="muted" style="color:var(--primary)">⏳ 导入对话中…</span>';
  try {
    const d = await fetch('/api/workslib/import', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ account_id: accountId, aweme_id: awemeId }) }).then(r => r.json());
    if (!d.ok) { st.innerHTML = '<span style="color:#ff3b30">❌ ' + esc(d.error || '导入失败') + '</span>'; return; }
    // 复用现有提取渲染链路：写入 _extractData，渲染分段 + 经历画像
    _extractData = d;
    st.innerHTML = '<span style="color:#34c759">✅ 已导入对话（' + (d.segments || []).length + ' 段），自动创建角色中…</span>';
    ttsRenderSegments(d.segments, d.extract_id);
    ttsUpdateSpeakerOptions(d.segments);
    ttsRenderVisitorProfile(d.visitor_profile);
    // 一气呵成：导入即自动创建角色，直接进入可对话状态（场景未填时自动兜底）
    setTimeout(() => ttsCreatePersona(true), 300);
  } catch (e) {
    st.innerHTML = '<span style="color:#ff3b30">❌ ' + esc(e.message) + '</span>';
  }
}

// 重新扒某条视频的文案（用户觉得扒得不对时）
async function wlReextractVideo(accountId, awemeId, btn) {
  if (btn) { btn.disabled = true; btn.textContent = '…'; }
  const st = $('wlStatus');
  st.innerHTML = '<span class="muted" style="color:var(--primary)">⏳ 重新扒文案中（字幕/ASR 转录，约需数十秒）…</span>';
  try {
    const d = await fetch('/api/workslib/video/reextract', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ account_id: accountId, aweme_id: awemeId }) }).then(r => r.json());
    if (d.ok) {
      st.innerHTML = '<span style="color:#34c759">✅ 重新扒取完成（' + (d.seg_count || 0) + ' 段对话）</span>';
    } else {
      st.innerHTML = '<span style="color:#ff3b30">❌ ' + esc(d.error || '重新扒取失败') + '</span>';
    }
    // 刷新当前展开账号的视频列表
    const acc = document.querySelector('.wl-acc[data-id="' + accountId + '"]');
    if (acc && acc.querySelector('.wl-videos').dataset.loaded) {
      await wlLoadVideos(accountId);
    }
  } catch (e) {
    st.innerHTML = '<span style="color:#ff3b30">❌ ' + esc(e.message) + '</span>';
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = '↻'; }
  }
}

// 删除某条视频：二次确认 + 记入排除清单（下次抓取不再抓回）
async function wlDeleteVideo(evt, accountId, awemeId) {
  evt.stopPropagation();
  const first = await confirmDanger('删除这条作品？', '将删除这条视频及其已扒文案，且下次「抓取全部账号」会自动排除它（不再抓回）。', '删除');
  if (!first) return;
  try {
    const d = await fetch('/api/workslib/video/delete', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ account_id: accountId, aweme_id: awemeId, exclude: true }) }).then(r => r.json());
    if (d.ok) { showToast('✅ 已删除，下次抓取将排除'); await wlLoadVideos(accountId); }
    else showToast('⚠ ' + (d.error || '删除失败'));
  } catch (e) { showToast('⚠ ' + e.message); }
}

// 批量重扒某账号下「段数过少或失败」的视频（走新提取逻辑）
async function wlReextractAll(evt, accountId, btn) {
  if (evt) evt.stopPropagation();
  const ok = await confirmDanger('批量重扒？', '会把此账号下「段数 < 3 或失败」的视频全部按新逻辑（字幕/ASR 完整口播优先）重新提取，可能耗时数分钟。', '开始批量重扒');
  if (!ok) return;
  if (btn) { btn.disabled = true; btn.dataset.orig = btn.textContent; btn.textContent = '⏳ 重扒中…'; }
  const st = $('wlStatus');
  st.innerHTML = '<span class="muted" style="color:var(--primary)">⏳ 批量重扒中（按新逻辑：字幕/ASR 完整口播优先，可能耗时数分钟）…</span>';
  try {
    const d = await fetch('/api/workslib/reextract_all', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ account_id: accountId, max_segments: 3 }) }).then(r => r.json());
    if (d.ok) {
      const ok2 = d.re_extracted || 0, fail = d.failed || 0, total = d.total || 0, stale = d.stale_count || 0;
      const skippedShort = d.skipped_short || 0;
      st.innerHTML = '<span style="color:#34c759">✅ 批量重扒完成 · 共 ' + total + ' 条 · 命中重扒条件 ' + stale + ' 条 · 成功 ' + ok2 + ' 条' + (fail ? ' · 失败 ' + fail + ' 条' : '') + (skippedShort ? ' · 跳过短视频 ' + skippedShort + ' 条' : '') + '</span>';
      // 刷新该账号的视频列表
      const acc = document.querySelector('.wl-acc[data-id="' + accountId + '"]');
      if (acc && acc.querySelector('.wl-videos').dataset.loaded) {
        await wlLoadVideos(accountId);
      }
      // 刷新账号统计
      await wlLoadAccounts();
    } else {
      st.innerHTML = '<span style="color:#ff3b30">❌ ' + esc(d.error || '批量重扒失败') + '</span>';
    }
  } catch (e) {
    st.innerHTML = '<span style="color:#ff3b30">❌ ' + esc(e.message) + '</span>';
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = btn.dataset.orig || '批量重扒'; }
  }
}

function ttsRenderSegments(segments, extractId) {
  // 渲染到弹窗容器（若弹窗未开则仅更新数据，等打开时再渲染）
  const box = $('speakerSegments');
  if (!box) return;
  if (!segments || !segments.length) {
    box.innerHTML = '<div class="empty" style="padding:20px;font-size:13px;text-align:center;color:var(--c-text-mute)">还没有提取到对话内容</div>';
    return;
  }
  box.innerHTML = segments.map((seg, i) => {
    const sp = (seg.speaker === 'B') ? 'B' : 'A';
    const other = sp === 'A' ? 'B' : 'A';
    const otherName = other === 'A' ? 'A·师傅' : 'B·求测者';
    return '<div class="tts-seg-wrap ' + (sp === 'A' ? 'is-a' : 'is-b') + '" data-idx="' + i + '">' +
      (sp === 'B' ? '<div class="seg-avatar seg-avatar-b">🧑</div>' : '') +
      '<div class="tts-seg-bubble">' +
        '<div class="tts-seg-ops">' +
          '<button class="seg-switch" onclick="ttsUpdateSpeaker(' + i + ', \'' + other + '\')" title="改成对方说的">⇄ 改成 ' + otherName + '</button>' +
          '<button class="seg-switch" onclick="ttsSplitSeg(' + i + ')" title="在光标处把这一句拆成两句">✂️ 拆分</button>' +
          '<button class="seg-switch" onclick="ttsAddSeg(' + i + ')" title="在这句下面新增一句">＋ 加一句</button>' +
          '<button class="seg-del" onclick="ttsDelSeg(' + i + ')" title="删除这一句">删除</button>' +
        '</div>' +
        '<div contenteditable="true" id="segText' + i + '" data-idx="' + i + '" onblur="ttsEditText(' + i + ', this.textContent)">' + esc(seg.text) + '</div>' +
      '</div>' +
      (sp === 'A' ? '<div class="seg-avatar seg-avatar-a">🧙</div>' : '') +
    '</div>';
  }).join('');
}

/* 流程化核心：提取（链接/文本/ASR）成功后，自动把下一步「确认发言人」弹出来。
   保留一次「确认」点击——区分发言人会直接影响角色质量，人工过目是质量关，不是流程繁琐。 */
function ttsAutoFlowAfterExtract(segments) {
  if (!segments || !segments.length) return;
  // 若已有进行中的对话会话，不打断用户，跳过自动弹窗
  if (_chatSid) return;
  ttsOpenSpeakerDialog();
}

function ttsOpenSpeakerDialog() {
  if (!_extractData || !_extractData.segments) { showToast('请先提取文案'); return; }
  const root = $('modalRoot');
  // 关闭已存在的对话弹窗
  const old = $('speakerDialog');
  if (old) old.remove();
  const mask = document.createElement('div');
  mask.className = 'modal-mask';
  mask.id = 'speakerDialog';
  mask.innerHTML =
    '<div class="spk-dialog">' +
      '<div class="spk-hd">' +
        '<div class="spk-title">👥 每句话是谁说的</div>' +
        '<button class="spk-close" onclick="this.closest(\'.modal-mask\').remove()" title="关闭">✕</button>' +
      '</div>' +
      '<div class="spk-sub">像微信聊天一样：<b style="color:#0a84ff">A·师傅</b>靠右、<b style="color:#0a84ff">B·求测者</b>靠左。鼠标移到一句话上会显示操作：<b>⇄ 改成对方</b>、<b>✂️ 拆分</b>（先把光标点到句子要断开的位置再点）、<b>＋ 加一句</b>、<b>删除</b>。点文字可直接编辑。改完点下方「确定」，会用最新说话人重新梳理求测者经历，并<b>自动创建角色</b>，不用再手动去点。</div>' +
      '<div class="spk-body" id="speakerSegments"></div>' +
      '<div class="spk-ft">' +
        '<button class="btn-primary" id="spkConfirmBtn" style="background:#34c759;flex:1;font-weight:600">✅ 确定，已区分好发言人</button>' +
      '</div>' +
    '</div>';
  root.appendChild(mask);
  // 渲染对话
  ttsRenderSegments(_extractData.segments, _extractData.extract_id);
  // 确定按钮：关闭弹窗 → 基于已修正的发言人重新提取经历 → 自动创建角色
  $('spkConfirmBtn').addEventListener('click', () => {
    mask.remove();
    showToast('✅ 已确认发言人，正在重新提取经历并自动创建角色…');
    ttsReextractVisitorProfile(true, () => { ttsCreatePersona(true); });
  });
  // 点击遮罩空白关闭
  mask.addEventListener('mousedown', e => { if (e.target === mask) mask.remove(); });
  const escHandler = ev => { if (ev.key === 'Escape') { mask.remove(); document.removeEventListener('keydown', escHandler); } };
  document.addEventListener('keydown', escHandler);
}

  // 创建角色已固定为 B·求测者，无需再维护发言人下拉
}

async function ttsUpdateSpeaker(idx, speaker) {
  if (!_extractData) return;
  const d = await fetch('/api/extract/segment', { method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ extract_id: _extractData.extract_id, seg_idx: idx, speaker }) }).then(r => r.json());
  if (d.ok) { _extractData.segments = d.segments; ttsRenderSegments(d.segments, _extractData.extract_id); }
}

async function ttsEditText(idx, text) {

async function ttsDelSeg(idx) {
  if (!_extractData) return;

  if (!ok) return;

    body: JSON.stringify({ extract_id: _extractData.extract_id, seg_idx: idx }) }).then(r => r.json());
  if (d.ok) { _extractData.segments = d.segments; ttsRenderSegments(d.segments, _extractData.extract_id); }
}

async function ttsSplitSeg(idx) {
  // 在光标位置把某句拆成两句（先聚焦到该句编辑框，用户放好光标后点拆分）
  if (!_extractData) return;
  const seg = _extractData.segments[idx];
  if (!seg) return;
  const el = document.querySelector('#segText' + idx);
  // 取光标位置（selection），若没聚焦则默认从中间拆
  let pos = 0;
  if (el) {
    const sel = window.getSelection();
    if (sel && sel.rangeCount > 0 && el.contains(sel.anchorNode)) {
      const range = sel.getRangeAt(0).cloneRange();
      range.selectNodeContents(el);
      range.setEnd(sel.anchorNode, sel.anchorOffset);
      pos = range.toString().length;
    }
  }
  if (!pos || pos <= 0) pos = Math.floor(seg.text.length / 2);
  const d = await fetch('/api/extract/segment/split', { method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ extract_id: _extractData.extract_id, seg_idx: idx, split_pos: pos }) }).then(r => r.json());
  if (d.ok) {
    _extractData.segments = d.segments;
    ttsRenderSegments(d.segments, _extractData.extract_id);
    showToast('✅ 已拆成两句，请分别点「改成对方」标好说话人');
  } else {
    showToast('⚠ ' + (d.error || '拆分失败'));
  }
}

async function ttsAddSeg(idx) {
  // 在某句下面新增一句，先选说话人再填内容
  if (!_extractData) return;
  const role = await ttsPickInsertRole();
  if (!role) return;
  const text = prompt('输入要新增这句话的内容（' + (role === 'assistant' ? 'B·求测者' : 'A·师傅') + '）：');
  if (text === null) return;
  if (!text.trim()) { showToast('内容不能为空'); return; }
  const d = await fetch('/api/extract/segment/add', { method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ extract_id: _extractData.extract_id, after_idx: idx, speaker: role === 'assistant' ? 'B' : 'A', text: text.trim() }) }).then(r => r.json());
  if (d.ok) {
    _extractData.segments = d.segments;
    ttsRenderSegments(d.segments, _extractData.extract_id);
    showToast('✅ 已新增一句');
  } else {
    showToast('⚠ ' + (d.error || '新增失败'));
  }
}

function ttsRenderVisitorProfile(profile) {
  const box = $('visitorProfileBox');

/* 经历时间线：按年份聚合，一年一行展示，可点开编辑 */
function ttsTimelineField(experiences) {
  // 存到全局，供编辑/收集使用
  _vpExperiences = (experiences || []).map(String);
  const rows = _vpExperiences.map((ev, i) => {
    const m = ev.match(/^\s*(\d{4})\s*[年\.\-—:：]?\s*(.*)$/);
    const year = m ? m[1] : '';
    const rest = m ? (m[2] || '').trim() : ev.trim();
    const ylabel = year || '——';
    return '<div class="vp-tl-row" data-idx="' + i + '">' +
      '<div class="vp-tl-year">' + esc(ylabel) + '</div>' +
      '<div class="vp-tl-dot"></div>' +
      '<div class="vp-tl-body">' +
        '<div contenteditable="true" class="vp-tl-text" onblur="ttsTimelineEdit(' + i + ', this.textContent)">' + esc(rest || (year ? '' : ev)) + '</div>' +
        '<button class="vp-tl-del" onclick="ttsTimelineDel(' + i + ')" title="删除这一行">✕</button>' +
      '</div>' +
    '</div>';
  });
  return '<div style="margin-bottom:8px">' +
    '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:3px">' +
      '<span style="font-size:12px;font-weight:600;color:var(--c-text-sub)">📖 经历时间线（一年一行）</span>' +
      '<button class="mp-mini-btn" style="padding:1px 8px;font-size:11px" onclick="ttsTimelineAdd()">＋ 加一行</button>' +
    '</div>' +
    '<div class="vp-tl" id="vp_timeline">' + (rows.join('') || '<div class="empty" style="padding:6px;font-size:12px">还没有经历数据</div>') + '</div>' +
    '<div class="muted" style="font-size:11px;margin-top:4px">点文字直接改；每行一条「年份 + 事件」。</div>' +
  '</div>';
}

function ttsTimelineEdit(idx, text) {
  if (!_vpExperiences) return;
  const t = (text || '').trim();
  _vpExperiences[idx] = t;
}
function ttsTimelineDel(idx) {
  if (!_vpExperiences) return;
  _vpExperiences.splice(idx, 1);
  ttsRenderTimeline();
}
function ttsTimelineAdd() {
  if (!_vpExperiences) _vpExperiences = [];
  _vpExperiences.push('');

}
function ttsRenderTimeline() {
  const box = $('vp_timeline');
  if (!box) return;
  box.innerHTML = _vpExperiences.map((ev, i) => {
    const m = ev.match(/^\s*(\d{4})\s*[年\.\-—:：]?\s*(.*)$/);
    const year = m ? m[1] : '';
    const rest = m ? (m[2] || '').trim() : ev.trim();
    const ylabel = year || '——';
    return '<div class="vp-tl-row" data-idx="' + i + '">' +
      '<div class="vp-tl-year">' + esc(ylabel) + '</div>' +
      '<div class="vp-tl-dot"></div>' +
      '<div class="vp-tl-body">' +
        '<div contenteditable="true" class="vp-tl-text" onblur="ttsTimelineEdit(' + i + ', this.textContent)">' + esc(rest || (year ? '' : ev)) + '</div>' +
        '<button class="vp-tl-del" onclick="ttsTimelineDel(' + i + ')" title="删除这一行">✕</button>' +
      '</div>' +

function ttsCollectVisitorProfile() {
  const get = id => { const el = $('vp_' + id); return el ? el.value.trim() : ''; };
  const lines = id => get(id).split('\n').map(s => s.trim()).filter(Boolean);
  // 经历时间线：把「年份 + 事件」重新拼成完整字符串数组（用于保存）
  const experiences = (_vpExperiences || []).map(ev => {
    const m = ev.match(/^\s*(\d{4})\s*[年\.\-—:：]?\s*(.*)$/);
    if (!m) return ev.trim();
    return m[1] + ' 年 ' + (m[2] || '').trim();
  }).map(s => s.trim()).filter(Boolean);
  const vsEl = $('vp_visitor_speaker');
  const out = {
    summary: get('summary'),
    basics: get('basics'),
    experiences: experiences,
    problems: lines('problems'),
    demands: lines('demands'),
    emotion: get('emotion'),
  };
  if (vsEl) out.visitor_speaker = vsEl.value;
  return out;
}

async function ttsReextractVisitorProfile(silent, onDone) {

    if (!d.ok) { $('visitorStatus').textContent = ''; if (!silent) showToast('⚠ ' + (d.error || '提取失败')); return; }

// 统计输入框字数：总字符数（不含空白）、汉字数、阿拉伯数字个数（含半角/全角）
function ttsUpdateCharCount() {
  const box = $('chatCountBox');
  if (!box) return;
  // 统计整个聊天记录的字数：取所有气泡正文（.wc-bub 文本），排除「新增」徽标
  const chatBox = $('agentChatBox');
  let text = '';
  if (chatBox) {
    chatBox.querySelectorAll('.wc-bub').forEach(b => { text += b.textContent + '\n'; });
  }
  // 若聊天记录为空，则退回到输入框内容（发消息前仍可预览）
  if (!text.trim()) {
    const input = $('chatInput');
    if (input) text = input.value;
  }
  if (!text.trim()) { box.style.display = 'none'; return; }
  // 总字符数：去除所有空白后统计（汉字+数字+字母+标点都算）
  const total = (text.replace(/\s+/g, '').match(/./gu) || []).length;
  // 汉字：CJK 统一表意文字
  const han = (text.match(/[\u4e00-\u9fff]/g) || []).length;
  // 数字：半角 0-9 和全角 ０-９
  const digit = (text.match(/[0-9０-９]/g) || []).length;
  $('chatCountTotal').textContent = total;
  $('chatCountHan').textContent = han;
  $('chatCountDigit').textContent = digit;
  box.style.display = 'flex';
}

async function ttsInsertMessage() {
  if (!_chatSid) { showToast('请先创建角色'); return; }
  const input = $('chatInput');
  const content = input.value.trim();
  if (!content) { showToast('请先输入要新增的消息内容'); return; }
  // 弹出选择：这条消息是谁说的
  const role = await ttsPickInsertRole();
  if (!role) return;
  const chatBox = $('agentChatBox');
  const tmpId = 'insert_' + Date.now();
  // 先乐观渲染（灰色标注「新增」），后端确认后再落库
  chatBox.innerHTML += ttsRenderChatMsg(role === 'assistant' ? 'assistant' : 'user', content, tmpId, '', true);
  chatBox.scrollTop = chatBox.scrollHeight;
  input.value = '';
  ttsUpdateCharCount();
  try {
    const d = await fetch('/api/agent/insert', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ sid: _chatSid, role: role, content }) }).then(r => r.json());
    if (!d.ok) { showToast('⚠ ' + (d.error || '新增失败')); return; }
    // 成功后用后端返回的正式 msg_id 回填 DOM（否则占位 insert_xxx 永远无法删除），并去掉「新增」占位态、补上删除按钮
    ttsFinalizeInsert(tmpId, (d.msg && d.msg.id) ? d.msg.id : '');
    showToast('✅ 已新增一条 ' + (role === 'assistant' ? 'B·求测者' : 'A·师傅') + ' 消息');
  } catch (e) {
    showToast('⚠ ' + e.message);
  }
}

// 在某条消息之后插入一条新消息：先选角色，再输入内容，插入到该句后面（可拖动定位到任意一句）
async function ttsInsertAfter(ev, afterMsgId) {
  ev.stopPropagation();
  if (!_chatSid) { showToast('请先创建角色'); return; }
  if (!afterMsgId) return;
  // 1) 选角色
  const role = await ttsPickInsertRole();
  if (!role) return;
  // 2) 输入内容
  const roleName = role === 'assistant' ? 'B·求测者' : 'A·师傅';
  const content = prompt('输入要在这一句后面新增的内容（' + roleName + '）：');
  if (content === null) return;      // 取消
  const text = content.trim();
  if (!text) { showToast('内容不能为空'); return; }
  const chatBox = $('agentChatBox');
  const anchor = chatBox.querySelector('.wc-row[data-msgid="' + afterMsgId + '"]');
  if (!anchor) { showToast('未找到插入位置'); return; }
  const tmpId = 'insert_' + Date.now();
  // 先乐观渲染（灰色标注「新增」），后端确认后再落库
  const html = ttsRenderChatMsg(role === 'assistant' ? 'assistant' : 'user', text, tmpId, '', true);
  const tmp = document.createElement('div');
  tmp.innerHTML = html;
  const node = tmp.firstElementChild;
  anchor.after(node);
  node.scrollIntoView({ block: 'center', behavior: 'smooth' });
  ttsUpdateCharCount();
  try {
    const d = await fetch('/api/agent/insert', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ sid: _chatSid, role: role, content: text, after_id: afterMsgId }) }).then(r => r.json());
    if (!d.ok) { showToast('⚠ ' + (d.error || '新增失败')); node.remove(); return; }
    // 成功后用后端返回的正式 msg_id 回填 DOM，去掉「新增」占位态、补上删除按钮
    ttsFinalizeInsert(tmpId, (d.msg && d.msg.id) ? d.msg.id : '');
    showToast('✅ 已在该句后面新增一条 ' + roleName + ' 消息');
  } catch (e) {
    showToast('⚠ ' + e.message);
  }
}

function ttsPickInsertRole() {
  return new Promise(resolve => {
    // 简单的内联选择弹层：A·师傅（右，user） / B·求测者（左，assistant）
    let mask = document.createElement('div');
    mask.className = 'tts-drawer-mask';
    mask.style.display = 'block';
    mask.style.zIndex = '999';
    let box = document.createElement('div');
    box.style.cssText = 'position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:1000;background:var(--c-card);border:1px solid var(--c-border);border-radius:12px;padding:18px;min-width:260px;box-shadow:0 8px 30px rgba(0,0,0,.2)';
    box.innerHTML =
      '<div style="font-weight:600;margin-bottom:12px">这条消息是谁说的？</div>' +
      '<div style="display:flex;flex-direction:column;gap:8px">' +
        '<button class="btn-primary" style="background:#0a84ff;width:100%" onclick="window.__pickRole(\'user\')"><span class="btn-ico"><svg><use href="#ic-home"/></svg></span>A·师傅（右侧）</button>' +
        '<button class="btn-primary" style="background:#ff9500;width:100%" onclick="window.__pickRole(\'assistant\')"><span class="btn-ico"><svg><use href="#ic-chat"/></svg></span>B·求测者（左侧）</button>' +
        '<button class="btn-primary" style="background:var(--c-bg-soft);color:var(--c-text);width:100%" onclick="window.__pickRole(null)">取消</button>' +
      '</div>';
    window.__pickRole = (r) => { mask.remove(); box.remove(); delete window.__pickRole; resolve(r); };
    document.body.appendChild(mask);
    document.body.appendChild(box);
  });
}

async function ttsSendChatMessage() {
  if (!_chatSid) { showToast('请先创建角色'); return; }
  const input = $('chatInput');
  const msg = input.value.trim();
  if (!msg) return;
  input.value = '';
  ttsUpdateCharCount();
  input.disabled = true;
  $('chatSendBtn').disabled = true;
  const chatBox = $('agentChatBox');
  // 临时渲染用户消息（尚无真实 id，先不显示删除/编辑按钮）；用 data-tmp 标记，拿到真实 id 后再重渲染
  chatBox.innerHTML += ttsRenderChatMsg('user', msg, '').replace('data-key="', 'data-tmp="1" data-key="');
  chatBox.scrollTop = chatBox.scrollHeight;
  chatBox.innerHTML += '<div id="chatLoading" class="wc-row agent"><div class="wc-va agent"><span class="ico"><svg><use href="#ic-chat"/></svg></span></div><div class="wc-col"><div class="wc-bub" style="color:var(--c-text-mute)">正在思考…</div></div></div>';
  chatBox.scrollTop = chatBox.scrollHeight;
  try {
    const d = await fetch('/api/agent/send', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ sid: _chatSid, message: msg }) }).then(r => r.json());
    if (d && d.error) d.error = friendlyError(d.error);
    const loading = $('chatLoading');
    if (loading) loading.remove();
    if (!d.ok) {
      chatBox.innerHTML += '<div style="color:#ff3b30;padding:4px 10px">❌ ' + esc(friendlyError(d.error)) + '</div>';
      return;
    }
    // 拿到 user 消息真实 id 后，重渲染整行（带上删除/编辑按钮）。后端返回 d.user_msg 结构：
    // { id, content, time }。用 data-tmp 定位临时行，删除后插入正式行。
    const userMsgId = (d.user_msg && d.user_msg.id) || '';
    if (userMsgId) {
      const tmpRow = chatBox.querySelector('.wc-row.me[data-tmp]');
      if (tmpRow) {
        const newRowHtml = ttsRenderChatMsg('user', d.user_msg.content || msg, userMsgId, d.user_msg.time || '');
        tmpRow.outerHTML = newRowHtml;
      }
    }
    chatBox.innerHTML += ttsRenderChatMsg('assistant', d.agent_msg.content, d.agent_msg.id, d.agent_msg.time);
    chatBox.scrollTop = chatBox.scrollHeight;
    ttsUpdateCharCount();
    ttsHintGenAll();
  } catch (e) {
    const loading = $('chatLoading');
    if (loading) loading.remove();
    chatBox.innerHTML += '<div style="color:#ff3b30;padding:4px 10px">❌ ' + esc(e.message) + '</div>';
    ttsUpdateCharCount();
  } finally {
    input.disabled = false;
    $('chatSendBtn').disabled = false;
    input.focus();
  }
}

function ttsRenderChatMsg(role, content, msgId, time, isInserted, audio, audioPreset) {
  const isAgent = role === 'assistant';
  const cls = isAgent ? 'agent' : 'me';
  const ava = isAgent ? '<span class="ico"><svg><use href="#ic-chat"/></svg></span>' : '<span class="ico"><svg><use href="#ic-home"/></svg></span>';
  const key = (msgId || 'm') + '_' + (++ttsMsgSeq);
  // 音频类操作（转音频）在气泡右侧；文字类操作（重写/评论/删除）在气泡下方横排
  const bubHtml = '<div class="wc-bub" onclick="ttsEditBubble(event, this, \'' + key + '\', ' + (msgId ? '\'' + msgId + '\'' : 'null') + ')">' +
    '<span class="wc-edit-hint"><span class="ico" style="width:12px;height:12px"><svg><use href="#ic-edit"/></svg></span></span>' +
    esc(content) +
    (isInserted ? ' <span class="tc-badge" style="font-size:9px;padding:0 5px;vertical-align:1px">新增</span>' : '') +
    '</div>';
  // 文字操作栏（气泡下方）：评论=评论文字（重写文字）
  // 重写/评论仅 agent 消息；删除对 agent 和 user 都开放
  // 关键：只要有真实 msgId（非 insert_ 临时占位），就该显示操作按钮
  // isInserted 仅用于控制「新增」徽章显示，不影响操作栏
  const hasRealId = msgId && msgId.indexOf('insert_') !== 0;
  const showOps = hasRealId;
  const opsHtml =
    '<div class="wc-ops">' +
      (showOps ?
        (isAgent ?
          '<button class="wc-op" onclick="ttsDoRegen(\'' + msgId + '\', \'\')"><span class="ico" style="width:13px;height:13px"><svg><use href="#ic-refresh"/></svg></span>重写</button>' +
          '<button class="wc-op" onclick="ttsCommentMsg(\'' + msgId + '\')"><span class="ico" style="width:13px;height:13px"><svg><use href="#ic-comment"/></svg></span>评论</button>'
          : '') +
        '<button class="wc-op" style="color:#ff3b30" onclick="ttsDelMsg(\'' + msgId + '\')"><span class="ico" style="width:13px;height:13px"><svg><use href="#ic-trash"/></svg></span>删除</button>'
        : '') +
    '</div>';
  // 音频操作按钮（气泡右侧，竖排）：只有 agent 消息才给「转音频」按钮，用户自己发的消息不需要
  // 右侧评论按钮 = 评论音频：只按评论重新合成音频语气，不改文字
  const audioBtnHtml = isAgent
    ? '<div class="wc-va-ops">' +
        '<button class="wc-op wc-op-main" data-ttsbtn="' + key + '" onclick="ttsMsgToAudio(\'' + key + '\')" title="用当前音色合成这条消息"><span class="ico" style="width:13px;height:13px"><svg><use href="#ic-speaker"/></svg></span></button>' +
        (showOps
          ? '<button class="wc-op" data-commentbtn="' + key + '" onclick="ttsCommentAudio(\'' + key + '\', \'' + msgId + '\')" title="评论音频：按你的意见只调整语气重新合成，不改文字"><span class="ico" style="width:13px;height:13px"><svg><use href="#ic-comment"/></svg></span></button>'
          : '') +
      '</div>'
    : '';
  // 已生成的语音条（重开软件恢复时，带出历史音频，无需重新合成）
  const audioBarHtml = (isAgent && audio)
    ? '<div class="wc-audio"></div>'
    : '';
  let html = '<div class="wc-row ' + cls + '" data-key="' + key + '"' + (msgId ? ' data-msgid="' + msgId + '"' : '') + '>' +
    '<div class="wc-va ' + cls + '">' + ava + '</div>' +
    '<div class="wc-col">' +
      (time ? '<div class="wc-time" style="margin:0 0 2px">' + esc(time) + '</div>' : '') +
      '<div class="wc-main">' + bubHtml + audioBtnHtml + '</div>' +
      audioBarHtml +
      opsHtml +
    '</div>' +
    // 句间插入点：hover 该条消息时显示「＋」，点击在该句之后插入一条新消息（可选 A 或 B）
    (hasRealId
      ? '<button class="wc-insert-hook" data-after="' + msgId + '" onclick="ttsInsertAfter(event, \'' + msgId + '\')" title="在这句后面新增一条消息"><span class="ico" style="width:12px;height:12px"><svg><use href="#ic-plus"/></svg></span></button>'
      : '') +
  '</div>';
  // 带历史音频时，渲染语音条并把按钮置为「已生成」状态
  if (audioBarHtml) {
    // 延迟到 DOM 挂载后再填充语音条（此时 row 已存在）
    setTimeout(function () {
      const chatBox = $('agentChatBox');
      const row = chatBox ? chatBox.querySelector('.wc-row[data-key="' + key + '"]') : null;
      const bar = row ? row.querySelector('.wc-audio') : null;
      if (row && bar) {
        ttsRenderVoiceBar(bar, '/api/tts/audio/' + encodeURIComponent(audio), audioPreset || '语音');
        ttsSetBtnState(key, 'regen');
      }
    }, 0);
  }
  return html;
}

// 评论文字：对这条消息的「文字」提意见，AI 据此重写文字（不自动合成音频）
async function ttsCommentMsg(msgId) {
  const comment = prompt('输入你对这条文字的意见/要求，AI 会据此重新改写这段文字（如：太书面了、更口语一点、情绪不够）：');
  if (!comment) return;
  await ttsDoRegen(msgId, comment);
}

// 评论音频：对这条消息的「音频」提意见，只按评论重新合成语气，不改文字
async function ttsCommentAudio(key, msgId) {
  if (!_chatSid) { showToast('请先创建角色'); return; }
  const comment = prompt('输入你对这段音频的意见（只调整语气，不改文字），如：语速太快、太激动了、再温柔一点、情绪再饱满一点：');
  if (!comment) return;
  await ttsGenAudioForRow(key, comment);
